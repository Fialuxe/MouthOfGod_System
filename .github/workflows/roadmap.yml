# ロードマップと活動記録を作り直す。
# - ロードマップ Issue（ラベル roadmap）: マイルストーンと Issue の依存関係（Blocked by）から
# - 活動記録 Issue（ラベル activity）: コミット・マージした PR・クローズした Issue から
# - README に載せる図（SVG）を描き、roadmap-assets ブランチに置く（main は PR 必須なので別ブランチ）
# 依存関係の変更は Actions のトリガーにならないため、1 時間ごとにも実行する。
name: Roadmap & Activity

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred, milestoned, demilestoned]
  milestone:
    types: [created, edited, opened, closed, deleted]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: roadmap
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ロードマップ Issue を更新し、図の元を書き出す
        run: python3 .github/scripts/update_roadmap.py --mermaid-dir mmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 活動記録 Issue を更新し、活動の図を描く
        run: python3 .github/scripts/update_activity.py --svg-dir svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 図を SVG にする
        run: |
          sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
          echo '{"args":["--no-sandbox"]}' > puppeteer.json
          mkdir -p svg
          for f in mmd/*.mmd; do
            npx -y @mermaid-js/mermaid-cli@11.4.2 -p puppeteer.json -b white -i "$f" -o "svg/$(basename "$f" .mmd).svg"
          done
          cp mmd/*.svg svg/ 2>/dev/null || true  # 今の区切りのカード（focus.svg）はスクリプトが直接描く

      - name: roadmap-assets ブランチに置く
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin roadmap-assets || true
          git worktree add --detach assets
          cd assets
          if git rev-parse --verify -q origin/roadmap-assets; then
            git checkout -B roadmap-assets origin/roadmap-assets
          else
            git checkout --orphan roadmap-assets
          fi
          git rm -rfq --ignore-unmatch .
          cp ../svg/*.svg .
          git add -A
          git diff --cached --quiet && exit 0
          git commit -qm "ロードマップの図を更新"
          git push origin roadmap-assets
