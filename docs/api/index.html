alizable": false, "doc": "", "brief": "", "values": [], "fields": [], "menus": [], "members": [{"mods": [], "rtype": "string", "name": "Id", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "float CenterX,", "name": "CenterZ", "params": "", "kind": "property", "acc": "", "doc": "台全体の中での、フィールドの中心（メートル。実物のミニチュアの寸法）。", "brief": "台全体の中での、フィールドの中心（メートル。"}, {"mods": [], "rtype": "List<VillageItem> Items = new", "name": "List<VillageItem>", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": []}, {"id": "t-VillageLayout", "name": "VillageLayout", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Village.Editor.Draft", "file": "Village/Editor/Draft/VillageLayout.cs", "mod": "Village", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "村の配置の下書き。メニュー MouthOfGod > Village > Bake Draft Village Prefab で、ここから Village.prefab を作る。作った後の配置は Prefab を手で直す（ここは最初の下書きとして残す。Prefab と同じに保つ必要はない）。数字はすべて実物のミニチュアの寸法（メートル）。台は 1.08 m 四方、村はその中の 0.54 m 四方。村らしく見せるための決まり（README「配置の考え方」）: 1. 中心に広場と井戸（目が最初に行く所）。道は広場で交わり、村の外（隣のフィールド）へ抜ける。2. 家は道か広場に正面を向け、少しずつ角度と下がり具合を変える（一直線にそろえない）。3. 北は山に接するので、風車や家畜は置かない（道は北へ延ばさない）。4. 畑・納屋・家畜は外側。家の集まりと畑の間を細い道でつなぐ。5. 外周に木を置いて、村の端をやわらげる。詰め込みすぎず、広場のまわりは空ける。6. 村人は、何かをしている場所にいる。1 か所に集めない。村は届けるたびに少しずつ戻る（README「ステップ」）。はじめは飢饉（畑は枯れ、木は茶色、家は屋根が無く、村人は全員悩む）。どのステップの欲しい物も農作物で、1 ステップに戻るものは、畝 1 本・木 1 本・家 1 軒・村人 1 人: 1 かぼちゃ（畑の入り口の人が元気になる）2 にんじん（井戸の人が元気になる）3 かぶ（畑の中の人が元気になる）4 トマト（戸口の人も元気になり、全員が元気）北（山のフィールド）と東（海のフィールド）の端には、何も置かない・畑を寄せない（隣の景色とぶつけないため）。", "brief": "村の配置の下書き。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["const"], "rtype": "string", "name": "Village", "params": "", "kind": "field", "acc": "", "doc": "", "brief": ""}, {"mods": ["static", "readonly"], "rtype": "IReadOnlyList<VillageStep>", "name": "Steps", "params": "", "kind": "field", "acc": "", "doc": "村の戻り方の順番。欲しい物の ID は仮。", "brief": "村の戻り方の順番。"}, { lyList<GameObject>", "name": "HideWhenDone", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "Transform", "name": "Anchor", "params": "", "kind": "property", "acc": "", "doc": "吹き出しの場所。1 人目の頭の上の印、無ければその人、誰もいなければこのステップ。", "brief": "吹き出しの場所。"}, {"mods": [], "rtype": "void", "name": "SetHelped", "params": "params VillagerMood[] villagers", "kind": "method", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "void", "name": "SetHideWhenDone", "params": "params GameObject[] objects", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "コンポーネント", "remarks": "", "usedBy": ["DeliveryFx", "FieldStages", "TutorialTestSceneBuilder", "VillageBaker"], "uses": ["SkipPopIn", "VillagerMood"]}, {"id": "t-SkipPopIn", "name": "SkipPopIn", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Village", "file": "Village/PopInEffect.cs", "mod": "Village", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "ステップの子の物を、このスクリプトで「ぽんっ」と出さないようにする印。付けた物は、出るときに拡大しない。自分のスクリプトで出方を作る物（OnEnable で大きさを動かす物など）に付ける。", "brief": "ステップの子の物を、このスクリプトで「ぽんっ」と出さないようにする印。", "values": [], "fields": [], "menus": [], "members": [], "nested_in": null, "role": "コンポーネント", "remarks": "", "usedBy": ["FieldStep"], "uses": ["DeliveryFx"]}, {"id": "t-StandArea", "name": "StandArea", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Village", "file": "Village/StandArea.cs", "mod": "Village", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": ["[assembly: InternalsVisibleTo(\"MouthOfGod.Village.Tests\")]"], "serializable": false, "doc": "体験者が、そのフィールドの前に立っているかを判定する場所。フィールドごとに 1 つ置く。頭が箱に入ったら Core の Set を呼び、出たら Leave を呼ぶ。立っている場所は、チュートリアルの案内と、そのフィールド専用の食べ物の表を選ぶのに使う。物がどこに届くかは、落ちた所（DeliveryZone）で決まる。", "brief": "体験者が、そのフィールドの前に立っているかを判定する場所。", "values": [], "fields": [{"header": null, "type": "string", "name": "fieldId", "label": "Field Id", "default": "\"\"", "tooltip": "このフィールドの ID（village など）。空なら、親にあるフィールド（FieldStages）の ID"}, {"header": null, "type": "Vector3", "name": "center", "label": "Center", "default": "new Vector3(0f, 1f, 0f)", "tooltip": "立つ場所の箱の中心（このオブジェクトのローカル座標）"}, {"header": null, "type": "Vector3", "name": "size", "label": "Size", "default": "new Vector3(0.8f, 2f, 0.6f)", "tooltip": "立つ場所の箱の大きさ（このオブジェクトのローカル座標）。台の 1 辺の前に、体験者が立つ広さにする"}, {"header": null, "type": "bool", "name": "ignoreHeight", "label": "Ignore Height", "default": "true", "tooltip": "高さを見ない（床の上の広さだけで判定する）。しゃがんでも、背が高くても、同じに扱う"}, {"header": null, "type": "float", "name": "margin", "label": "Margin", "default": "0.1f", "tooltip": "出たと判定するまでの余白（ローカル座標の長さ）。境目で、入る・出るをくり返さないようにする"}, {"header": null, "type": "Transform", "name": "head", "label": "Head", "default": "", "tooltip": "体験者の頭。空なら、Main Camera"}, {"header": null, "type": "GameObject", "name": "footprint", "label": "Footprint", "default": "", "tooltip": "床の印（足あと）。合図 <field>.footprint で出し、<field>.footprint-off で消す。空でもよい"}, {"header": null, "type": "bool", "name": "hideFootprintOnArrive", "label": "Hide Footprint On Arrive", "default": "true", "tooltip": "体験者が立ったら、床の印を消す"}, {"header": null, "type": "bool", "name": "hideFootprintAtStart", "label": "Hide Footprint At Start", "default": "true", "tooltip": "Play の始めに、床の印を消しておく（合図で出す）"}, {"header": null, "type": "bool", "name": "logEvents", "label": "Log Events", "default": "true", "tooltip": "立った・離れたを Console に出す"}], "menus": [{"kind": "ContextMenu", "path": "Stand Here"}, {"kind": "ContextMenu", "path": "Leave"}], "members": [{"mods": [], "rtype": "FieldId", "name": "Field", "params": "", "kind": "property", "acc": "", "doc": "この場所のフィールド。Field Id が空なら、親のフィールド。見つからなければ None。", "brief": "この場所のフィールド。"}, {"mods": [], "rtype": "bool", "name": "IsInside", "params": "", "kind": "property", "acc": "", "doc": "頭が、いまこの場所に入っているか。", "brief": "頭が、いまこの場所に入っているか。"}], "nested_in": null, "role": "コンポーネント", "remarks": "- 箱は、このオブジェクトのローカル座標で持つ。台ごと動いても（AprilTag で合わせても）ついてくる。\n- 出るときだけ、箱を `Margin` だけ広げて判定する。境目で、入る・出るをくり返さない。\n- 箱が重なっているときは、あとから入った場所が勝つ。そこを出たとき、まだ入っている場所があれば、そちらに戻る。\n- フィールドは `Field Id`。空なら、親にあるフィールド（FieldStages）。\n- 床の印（`Footprint`）は、合図 `<field>.footprint` で出し、`<field>.footprint-off` で消す。\n- ヘッドセットなしで試すときは、右クリックの「Stand Here」「Leave」を使う。", "usedBy": ["FieldDiagnostics", "MountDeliveryZoneAdder", "TutorialTestSceneBuilder"], "uses": ["CueRequested", "Cues", "FieldId", "IFieldRequests", "Standing"]}, {"id": "t-StepProgress", "name": "StepProgress", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Village", "file": "Village/StepProgress.cs", "mod": "Village", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "フィールド 1 つの、ステップ（戻り方の 1 段）の進み具合。Unity に依存しない（テストできる）。ステップごとに欲しい物が 1 つあり、届くとそのステップが済む。済んだかはステップごとに持つ（番号で数えない）。同時に出せる欲しい物は MaxOpen まで。次に出すのは、まだ済んでおらず、出てもいない最初のステップ（NextIndex）。", "brief": "フィールド 1 つの、ステップ（戻り方の 1 段）の進み具合。", "values": [], "fields": [], "menus": [], "members": [{"mods": [], "rtype": "", "name": "StepProgress", "params": "IReadOnlyList<FoodId> wants, int maxOpen = 1", "kind": "ctor", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "int", "name": "Count", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "int", "name": "MaxOpen", "params": "", "kind": "property", "acc": "get;", "doc": "同時に出せる欲しい物の数。", "brief": "同時に出せる欲しい物の数。"}, {"mods": [], "rtype": "IReadOnlyList<int>", "name": "OpenIndices", "params": "", "kind": "property", "acc": "", "doc": "出ている欲しい物のステップ。出した順（古い順）。", "brief": "出ている欲しい物のステップ。"}, {"mods": [], "rtype": "int", "name": "OpenIndex", "params": "", "kind": "property", "acc": "", "doc": "出ている欲しい物のうち、一番古いもののステップ。出ていなければ -1。", "brief": "出ている欲しい物のうち、一番古いもののステップ。"}, {"mods": [], "rtype": "bool", "name": "IsOpen", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "bool", "name": "IsOpenAt", "params": "int index", "kind": "method", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "FoodId", "name": "Current", "params": "", "kind": "property", "acc": "", "doc": "出ている欲しい物のうち、一番古いもの。出ていなければ FoodId.None。", "brief": "出ている欲しい物のうち、一番古いもの。"}, {"mods": [], "rtype": "FoodId", "name": "WantOf", "params": "int index", "kind": "method", "acc": "", "doc": "そのステップの欲しい物。範囲の外なら FoodId.None。", "brief": "そのステップの欲しい物。"}, {"mods": [], "rtype": "bool", "name": "IsDone", "params": "int index", "kind": "method", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "int", "name": "DoneCount", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "bool", "name": "IsComplete", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "int", "name": "NextIndex", "params": "", "kind": "property", "acc": "", "doc": "次に出すステップ（まだ済んでおらず、出てもおらず、欲しい物があるもの）。無ければ -1。順番を変えたいときは、ここだけを変える。", "brief": "次に出すステップ（まだ済んでおらず、出てもおらず、欲しい物があるもの）。"}, {"mods": [], "rtype": "bool", "name": "CanOpen", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "bool", "name": "TryOpen", "params": "out int index, System.Random random = null", "kind": "method", "acc": "", "doc": "次の欲しい物を出す。出せなければ false（index は -1）。random を渡すと、並び順ではなく、出せるステップからランダムに選ぶ。", "brief": "次の欲しい物を出す。"}, {"mods": [], "rtype": "bool", "name": "Wants", "params": "FoodId food", "kind": "method", "acc": "", "doc": "このフィールドのどれかのステップが欲しがる物か（済んだステップも含む）。", "brief": "このフィールドのどれかのステップが欲しがる物か（済んだステップも含む）。"}, {"mods": [], "rtype": "bool", "name": "TryOpen", "params": "FoodId food, out int index", "kind": "method", "acc": "", "doc": "その物を欲しがる、出せる最初のステップを出す。上限まで出ている・出せるステップが無いなら false（index は -1）。", "brief": "その物を欲しがる、出せる最初のステップを出す。"}, {"mods": [], "rtype": "bool", "name": "TryResolve", "params": "FoodId delivered, out int index", "kind": "method", "acc": "", "doc": "届いた物を、出ている欲しい物のうち、同じ物を欲しがる一番古いものに当てる。当たれば、そのステップを済ませて閉じる（true）。どれにも当たらなければ false（index は -1）。", "brief": "届いた物を、出ている欲しい物のうち、同じ物を欲しがる一番古いものに当てる。"}, {"mods": [], "rtype": "int", "name": "Close", "params": "", "kind": "method", "acc": "", "doc": "出ている欲しい物のうち、一番古いものを、届かないまま閉じる。閉じたステップを返す（出ていなければ -1）。", "brief": "出ている欲しい物のうち、一番古いものを、届かないまま閉じる。"}, {"mods": [], "rtype": "bool", "name": "Close", "params": "int index", "kind": "method", "acc": "", "doc": "そのステップの欲しい物を、届かないまま閉じる。出ていなければ false。", "brief": "そのステップの欲しい物を、届かないまま閉じる。"}, {"mods": [], "rtype": "int[]", "name": "CloseAll", "params": "", "kind": "method", "acc": "", "doc": "出ている欲しい物を、すべて届かないまま閉じる。閉じたステップを、出した順に返す。", "brief": "出ている欲しい物を、すべて届かないまま閉じる。"}, {"mods": [], "rtype": "void", "name": "Complete", "params": "int index", "kind": "method", "acc": "", "doc": "欲しい物を通さずに、ステップを済ませる（開発中の確認用）。出ていたら閉じる。", "brief": "欲しい物を通さずに、ステップを済ませる（開発中の確認用）。"}, {"mods": [], "rtype": "void", "name": "Reset", "params": "", "kind": "method", "acc": "", "doc": "はじめ（全部まだ）に戻す。出ていた欲しい物も閉じる。", "brief": "はじめ（全部まだ）に戻す。"}], "nested_in": null, "role": "クラス", "remarks": "", "usedBy": ["FieldStages"], "uses": ["FoodId"]}, {"id": "t-SurfaceAnchor", "name": "SurfaceAnchor", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Village", "file": "Village/SurfaceAnchor.cs", "mod": "Village", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": ["[ExecuteAlways]"], "serializable": false, "doc": "フィールドの Prefab の一番上に付ける。親（シーンの Village などの立方体の地面）の上面に乗せ、親の倍率を打ち消す。シーンの台は (0.54, 0.2, 0.54) のように縦が潰れているので、その子にそのまま置くと中身がゆがむ。これを付けると、Prefab の中は「1 = 1 m」のままになる。編集中もシーンで同じ見た目になる。", "brief": "フィールドの Prefab の一番上に付ける。", "values": [], "fields": [{"header": null, "type": "float", "name": "surfaceLocalY", "label": "Surface Local Y", "default": "0.5f", "tooltip": "親のローカルで、乗せる面の高さ。Cube の上面は 0.5"}], "menus": [], "members": [], "nested_in": null, "role": "コンポーネント", "remarks": "", "usedBy": ["MainSeaSwapper", "VillageBaker"], "uses": []}, {"id": "t-VillagerMood", "name": "VillagerMood", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Village", "file": "Village/VillagerMood.cs", "mod": "Village", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "村人の気持ち。FieldStages が、この人の名前があるステップ（FieldStep の Helped）がすべて済むまで「悩む」にする。悩んでいる間: 頭の上に印を出し、肩を落としてゆっくり立つ（Worried）。ときどき、がっくりうなだれる（Slump = Defeat）。うなだれる間隔と長さは人ごとにばらつかせ、全員が同時に動かないようにする（止まって見えないように）。元気: Idle。ステップが済んだときは、元気な人が Victory を 1 回やって喜ぶ。Animator は Villager.controller（VillagePrefabGenerator が作る）。村人の Prefab に付いている。", "brief": "村人の気持ち。", "values": [], "fields": [{"header": null, "type": "GameObject", "name": "worryMark", "label": "Worry Mark", "default": "", "tooltip": "悩んでいる間だけ見える、頭の上の印"}, {"header": null, "type": "Vector2", "name": "uprightSeconds", "label": "Upright Seconds", "default": "new Vector2(4f, 9f)", "tooltip": "体を起こしている時間（秒）の範囲。この間でばらつく"}, {"header": null, "type": "Vector2", "name": "slumpSeconds", "label": "Slump Seconds", "default": "new Vector2(3f, 6f)", "tooltip": "うなだれている時間（秒）の範囲。この間でばらつく"}], "menus": [], "members": [{"mods": ["const"], "rtype": "string", "name": "MissedTrigger", "params": "", "kind": "field", "acc": "", "doc": "違う物が届いたときに送る、Animator のトリガーの名前（Villager.controller に入っている）。", "brief": "違う物が届いたときに送る、Animator のトリガーの名前（Villager.controller に入っている）。"}, {"mods": [], "rtype": "GameObject", "name": "WorryMark", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "bool", "name": "IsWorried", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "bool", "name": "React", "params": "string trigger", "kind": "method", "acc": "", "doc": "Animator に、その名前のトリガーを送る。Animator Controller にその名前のトリガーが無ければ、何もしないで false。動きを足すときは、Animator Controller にトリガーとステートを足し、ここに名前を渡すだけでよい（コードは直さない）。", "brief": "Animator に、その名前のトリガーを送る。"}, {"mods": [], "rtype": "void", "name": "SetWorried", "params": "bool worried, bool celebrate", "kind": "method", "acc": "", "doc": "悩むか元気かを決める。celebrate なら、元気な人は喜ぶ（ステップが済んだとき）。FieldStages が呼ぶ。", "brief": "悩むか元気かを決める。"}], "nested_in": null, "role": "コンポーネント", "remarks": "", "usedBy": ["DeliveryFx", "FieldStages", "FieldStep", "MainSeaVillagerResizer", "VillageBaker", "VillagePrefabGenerator"], "uses": []}], "guide": [{"id": "g-reading", "title": "この文書の読み方", "md": "- 対象は、`main`（`5530138`、マップ仕上げ #346）に、PR #347（カメラのカット再生・チュートリアルのスキップ・置き場・巫女の追従）を重ねた状態です。#347 が入るまでは、`CameraWork` 全体と、`TutorialRunner.Skip`・`FoodSpawner.FoodParent`・`DeliveryFx.FxParent`・`MikoMover` の追従まわりが、`main` にはありません。\n- 第 1 章は全体の作りです。第 2 章は、機能どうしがどうつながるかです。第 3 章は、共有シーン Main の中身です。第 4 章は、機能ごとの型の一覧です。付録に、メニューとファイルの置き場所があります。\n- 各型の表は、公開されている `public`・`protected` のメンバーだけを載せます。`internal` はテスト用の入口なので載せません。\n- 「Inspector」の表は、Unity が Inspector に出す項目です。項目名は、Unity が変数名から作る表示名です。`[Header]` は太字の行で示します。\n- 確かめたこと: 型・メンバー・既定値・説明は、コードから機械的に取り出しています。Main シーンの位置は、`Main.unity` と入れ子の Prefab の YAML から計算しました。\n- 確かめていないこと: Unity でコンパイルも実行もしていません。Mesh の見た目の大きさは読んでいないので、第 3 章の位置は、オブジェクトの原点です。"}, {"id": "g-overview-arch", "title": "1. 全体像", "md": "### 1.1 層と依存の向き\n\n機能は、`Core` の小さな型・interface・置き場を通してだけつながります。機能どうしは、互いのクラスを参照しません。\n\n```mermaid\nflowchart BT\n  Core[\"Core<br/>ID・イベントの型・interface・置き場\"]\n  Device --> Core\n  Fork --> Core\n  Food --> Core\n  Village --> Core\n  UI --> Core\n  Miko --> Core\n  Game --> Core\n  Tutorial --> Core\n  DevTools --> Core\n  DevTools --> Tutorial\n  Tracking\n  CameraWork\n```\n\n- `Tracking` と `CameraWork` は、`Core` も参照しません。どちらの機能も、ほかの機能の型を使いません。\n- `DevTools` だけが、`Tutorial` を参照します。`TutorialDebugHud` が `TutorialRunner` を操作するためです。\n- 機能の中の依存の向きは、asmdef の `references` で決まります。`.github/scripts/check_coupling.py` は、`MouthOfGod.<他の機能>` を参照するコードを、警告として PR に出します（止めません）。\n- 全機能を参照する組み立て役（Bootstrap）と、中央の進行クラス（`GameManager`）は、置きません（[architecture.md](https://github.com/Fialuxe/MouthOfGod_System/blob/main/docs/architecture.md)）。\n\n### 1.2 アセンブリと名前空間\n\n名前空間は、フォルダ名に合わせて `MouthOfGod.<フォルダ>` です。エディタ専用の部分は、`.Editor` を付けた別のアセンブリです。\n\n| アセンブリ | 名前空間 | 参照する asmdef |\n|---|---|---|\n| `MouthOfGod.Core` | `MouthOfGod.Core` | なし |\n| `MouthOfGod.Device` | `MouthOfGod.Device` | Core、Unity.InputSystem |\n| `MouthOfGod.Fork` | `MouthOfGod.Fork` | Core、Unity.InputSystem |\n| `MouthOfGod.Food` | `MouthOfGod.Food` | Core |\n| `MouthOfGod.Village` | `MouthOfGod.Village` | Core |\n| `MouthOfGod.UI` | `MouthOfGod.UI` | Core |\n| `MouthOfGod.Miko` | `MouthOfGod.Miko` | Core、UnityEngine.UI |\n| `MouthOfGod.Tutorial` | `MouthOfGod.Tutorial`、`MouthOfGod.Tutorial.Sandbox` | Core、Unity.InputSystem |\n| `MouthOfGod.Game` | `MouthOfGod.Game` | Core、Unity.TextMeshPro |\n| `MouthOfGod.Tracking` | `MouthOfGod.Tracking` | meta.xr.mrutilitykit、Oculus.VR、Unity.InputSystem、AprilTag.Runtime |\n| `MouthOfGod.CameraWork` | `MouthOfGod.CameraWork` | なし |\n| `MouthOfGod.DevTools` | `MouthOfGod.DevTools` | Core、Tutorial、Unity.InputSystem |\n| `MouthOfGod.Device.Editor` | `MouthOfGod.Device.Editor` | Device |\n| `MouthOfGod.Fork.Editor` | `MouthOfGod.Fork.Editor` | Fork |\n| `MouthOfGod.Food.Editor` | `MouthOfGod.Food.Editor` | Food |\n| `MouthOfGod.Village.Editor` | `MouthOfGod.Village.Editor`、`MouthOfGod.Village.Editor.Draft` | Village、Food |\n| `MouthOfGod.Miko.Editor` | `MouthOfGod.Miko.Editor` | Miko |\n| `MouthOfGod.Tutorial.Editor` | `MouthOfGod.Tutorial.Editor` | Tutorial、Miko |\n| `MouthOfGod.CameraWork.Editor` | `MouthOfGod.CameraWork.Editor` | CameraWork |\n| `MouthOfGod.DevTools.Editor` | `MouthOfGod.DevTools.Editor` | Core、DevTools、Tutorial、Fork、Food、Village、UI、Miko、Tutorial.Editor |\n\n- テストは、機能ごとに `MouthOfGod.<機能>.Tests`（Editor のみ）です。`Core`・`Device`・`Food`・`Fork`・`Game`・`Tutorial`・`UI`・`CameraWork`・`Village` は、`InternalsVisibleTo` で `internal` をテストに見せています。\n- `Tracking` の asmdef は `Core` を参照しません。コードも `MouthOfGod.Core` を使いません。ほかの機能には、`Transform` と追跡中かどうかだけを渡します。\n\n### 1.3 Play のたびに自動で置かれるもの\n\n手でシーンに置かなくても、次のものは Play で現れます。\n\n| 自動で置かれるもの | 条件 | 置く所 |\n|---|---|---|\n| `MockDevice`（と `MockDeviceModel`） | シーン読み込みのあと、実機のデバイスが先に `Devices` へ登録していなければ | `MockDevice.GetOrCreate`。Prefab `Resources/Prefabs/Device/MockDevice` があればそれ、なければコードで作る。`DontDestroyOnLoad` |\n| `RequestBubbles` | シーン読み込みのあと | 自分で GameObject を作って付く（村人の頭の上の吹き出し） |\n| `AprilTagDetectionService` | `AprilTagPlace` が必要なとき | `AprilTagDetectionService.GetOrCreate` |\n| `AprilTagRecalibrateInput` | `AprilTagDetectionService` が起動したとき | 同じ GameObject に自動で付く |\n| `DeliveryFx` | `FieldStages` を持つ物に付いていないとき | `FieldStages` が自分で付ける |\n| `FoodItemTag` | 食べ物を生んだとき | `FoodSpawner` が、生んだ食べ物に付ける |\n| `SphereCollider`・`Rigidbody` | `ForkTip` に無いとき | `ForkTip` が自分に足す |"}, {"id": "g-wiring", "title": "2. 機能どうしのつなぎ方", "md": "### 2.1 置き場（Core の static クラス）\n\n機能をまたいで使う「もの」は、自分で置き場に登録します。使う側は、置き場から受け取ります。置き場は static なので、Play のたびに空にします（`RuntimeInitializeOnLoadMethod` の `Reset`）。\n\n| 置き場 | 持つもの | 登録・設定する側 | 受け取る側（例） |\n|---|---|---|---|\n| `Devices` | `IDevice`（1 台） | `MockDevice` | `FoodSpawner`、`FoodShadow`、`ForkTip`、`TutorialScript` の待ち、`TutorialDebugHud` |\n| `Forks` | `IFork`（1 本） | `ForkTip` | `FoodShadow`、`TutorialScript` の待ち、`TutorialDebugHud` |\n| `FoodSpawners` | `IFoodSpawner`（1 つ） | `FoodSpawner` | `FoodShadow`、`TutorialScript` の待ち |\n| `Fields` | `IFieldRequests`（フィールドごと） | `FieldStages` | `RequestBubbles`、`DeliveryZone`、`TutorialRunner`（Skip）、`T3Recognize`、`T4Deliver`、待ち、`TutorialDebugHud` |\n| `Standing` | 前に立っているフィールド（`FieldId`） | `StandArea` | `FoodSpawner`（食べ物の表を選ぶ）、`StandWait`、`TutorialDebugHud` |\n| `Phases` | いまの場面（`PhaseId`） | `TutorialRunner`、`GameRunner` | `GameRunner`、`FoodShadow`、`TutorialScript`、`TutorialDebugHud` |\n| `Cues` | 合図（`CueRequested`） | `TutorialScript.Cue`、`TutorialRunner.Skip` | `MikoCueReceiver`、`CloudCues`、`FoodShadow`、`StandArea`、`CueReaction`、`TutorialDebugHud` |\n\n`FoodTables`（Food）は、`FoodTable` の置き場です。機能をまたぐ置き場ではなく、Food の内側にあります。\n\n### 2.2 合図（`Cues`）の名前\n\n出す側は、誰が受けるかを知りません。受ける側がいなければ、何も起きません。名前は、機能ごとの決まりに従います。\n\n| 合図の名前 | 受ける所 | 意味 |\n|---|---|---|\n| `miko.say.<id>` | `MikoCueReceiver` → `MikoSpeech` | 巫女がセリフ `<id>` を言う |\n| `miko.face.<名前>` | `MikoCueReceiver` → `MikoFace` | 表情を変える（normal / happy / squint / love / sleep / wink / tired） |\n| `miko.point` | `MikoCueReceiver` | 指さしをする |\n| `miko.hush` | `MikoCueReceiver` → `MikoSpeech` | しゃべるのをやめる |\n| `miko.follow` / `miko.stay` | `MikoCueReceiver` → `MikoMover` | 体験者についてくる / その場にとどまる |\n| `cloud.glow` | `CloudCues` | 正面にいちばん近い雲を 1 つ光らせる |\n| `cloud.approach` | `CloudCues` | 光る雲を、体験者の近くへ寄せる |\n| `cloud.calm` | `CloudCues` | 光を消し、雲を戻す |\n| `shadow.show` / `shadow.faint` / `shadow.emphasize` / `shadow.hide` | `FoodShadow` | 食べ物の影を、ふつうに / 薄く / 強く出す / 消す |\n| `<フィールド>.footprint` / `<フィールド>.footprint-off` | `StandArea` | 床の足あとの印を出す / 消す |\n| `<フィールド>.glow` / `<フィールド>.glow-off` | `CueReaction`（Inspector で設定した物） | フィールドを光らせる / 消す |\n| `offering.show` / `offering.hide` | `CueReaction`（Inspector で設定した物） | T2 のお供え物を出す / 隠す |\n| `device.button.glow` / `device.button.glow-strong` / `device.button.glow-off` | `CueReaction`（Inspector で設定した物） | デバイスのボタンを光らせる / 強く光らせる / 消す |\n| `staff.alert` | `CueReaction`（Inspector で設定した物） | スタッフに知らせる |\n| `prologue.start` / `prologue.end` | `CueReaction`（Inspector で設定した物） | プロローグの動画の前後 |\n\n- `CueReaction` は、合図の名前ごとに、物を出す・消す・`UnityEvent` を呼ぶ、を Inspector だけで設定できる部品です。コードの外で足せる反応は、これで受けます。\n- 合図の名前は、`TutorialScript` を継いだ各スクリプトの Inspector で変えられます。空にすると、その合図は出しません。\n- フィールドの合図は、フィールド名から始めます（`sea.glow`、`village.footprint`）。決まりは [requests.md](https://github.com/Fialuxe/MouthOfGod_System/blob/main/docs/requests.md) にあります。\n\n### 2.3 場面（`Phases`）の名前\n\n`Phases.Current` に入る名前です。番号ではなく、やることを表す名前にします。一覧と決める所は [progress-keys.md](https://github.com/Fialuxe/MouthOfGod_System/blob/main/docs/progress-keys.md) にもあります。\n\n| 名前 | 決める所 | 意味 |\n|---|---|---|\n| `prologue` | `PrologueVideo` | 導入の動画 |\n| `fork` | `T1Fork` | フォークの使い方 |\n| `spawn` | `T2Spawn` | 口から物が生まれる |\n| `recognize` | `T3Recognize` | 食感で物が変わる・欲しい物を知る |\n| `deliver` | `T4Deliver` | 立つ場所で届ける |\n| `main-game` | `GameRunner` | 本編（制限時間のあいだ） |\n| `game-over` | `GameRunner` | 本編の時間切れ |\n\n### 2.4 流れ 1: 食べ物を生んで、届けるまで\n\n```mermaid\nsequenceDiagram\n  participant D as MockDevice (IDevice)\n  participant S as FoodSpawner\n  participant T as FoodTables\n  participant Z as DeliveryZone\n  participant F as FieldStages (IFieldRequests)\n  participant U as RequestBubbles / DeliveryFx / VillagerMood\n  D->>S: Confirmed(TextureId)\n  S->>T: Resolve(Standing.Field, TextureId)\n  T-->>S: 食べ物の Prefab\n  S->>S: Instantiate（Spawn Point に、Food Parent の子として）＋FoodItemTag＋初速\n  S-->>S: Spawned(FoodId, 位置) を出す\n  Note over S,Z: 体験者が顔を向けた方へ飛ぶ\n  Z->>F: Receive(FoodId)（Collider に入ったとき）\n  F-->>U: Closed → Received → StepDone（欲しい物なら）／ Received だけ（違う物なら）\n```\n\n1. デバイスが決定すると、`IDevice.Confirmed` が、そのときの食感を運びます。噛む前の決定（食感が空）は、食べ物を生みません。\n2. `FoodSpawner` が `FoodTables.Resolve` で Prefab を引きます。引く順は、立っているフィールドの表、共通の表、なし、です。立っているフィールドは `Standing.Field` です。\n3. `Spawn Point` の位置と向きに生みます。`Food Parent` を入れてあれば、その子にします。`FoodItemTag` を付け、`Launch Speed` が 0 より大きく、`Rigidbody` が動く物なら、前向きに初速を与えます。\n4. 食べ物は、物理で飛びます。落ちた先の `DeliveryZone`（`Collider` の Is Trigger）が、`IFoodItem` を読んで、フィールドの `Receive` を呼びます。\n5. `FieldStages.Receive` は、`DeliveryKind` を返します。欲しがっていた物（`Requested`）なら、ステップを済ませ、`Closed`（`Resolved = true`）、`Received`、`StepDone` の順に出します。このフィールドの物（`Own`）とよその物（`Foreign`）は、`Received` だけを出します。\n6. `DeliveryFx` は、`StepDone` で喜びの粒と音を出し、`Received` が `Requested` 以外なら、困っている村人にトリガー `Missed` を送り、音を鳴らします。`RequestBubbles` は、`Closed` で吹き出しを消します。\n\n### 2.5 流れ 2: 欲しい物を出す\n\n- `IFieldRequests.Open()` が、次の欲しい物を出します。出せなければ `false` です（上限まで出ている、ステップが残っていない、など）。\n- 出すと `Issued`（`RequestIssued`）が出ます。`RequestBubbles` は、`Anchor`（村人の頭の上の `Transform`）に吹き出しを出します。\n- 同じフィールドで、同時に複数出せます。上限は `FieldStages` の Max Open Requests（既定 2）です。欲しい物は、`Request`（番号）で見分けます。\n- `Expire()` は、出ている欲しい物を、届かないまま終えます（`Closed` の `Resolved = false`）。`Restart()` は、フィールドを最初に戻します。\n- 本編が、いつ・どこに出すかを決めるコードは、まだありません。いまは、`OpenAllRequestsAfterTutorial`（試験用）が、チュートリアルのあとに、全フィールドへ出せるだけ出します。\n\n### 2.6 流れ 3: チュートリアルから本編へ\n\n```mermaid\nflowchart LR\n  B[\"TutorialRunner.Begin()\"] --> P[\"Prologue → T1Fork → T2Spawn → T3Recognize → T4Deliver\"]\n  P --> E[\"Phases: deliver → 空<br/>Finished\"]\n  K[\"TutorialRunner.Skip()\"] --> E\n  E --> G[\"GameRunner<br/>（After Phase = deliver）\"]\n  G --> M[\"Phases: main-game<br/>制限時間のあと game-over\"]\n```\n\n- `TutorialRunner` は、子の `TutorialScript` を、Hierarchy の順に 1 つずつ動かします。動かす間、`Phases` を各スクリプトの場面にします。例外が出たスクリプトは、そこでやめて、次へ進みます。\n- 全部終わると、`Phases` を空に戻し、`Finished` を出します。\n- `GameRunner` は、場面 `deliver` のあとに場面が空になったとき、本編を始めます（After Phase の既定は `deliver`）。`TutorialRunner` の型は、参照しません。\n- `TutorialRunner.Skip()` は、チュートリアルを飛ばして、全部終わった扱いにします。まず、動いていれば止め、`Memory` を空にし、全フィールドを `Restart` します。次に、`<フィールド>.glow-off`・`<フィールド>.footprint-off`・`miko.stay` の合図を出します。最後に、場面を Skip Phase（既定 `deliver`）から空の場面へ進め、`Finished` を出します。\n- Skip で本編が始まるには、シーンに `GameRunner` が必要です。**2026-10-28 時点の Main シーンには `GameRunner` がありません**（第 3 章）。\n\n### 2.7 ID の型\n\n| 型 | 中身 | 例 |\n|---|---|---|\n| `TextureId` | 食感 | `placeholder-a` |\n| `FoodId` | 食べ物。Prefab のファイル名と同じ | `fish` |\n| `FieldId` | フィールド（`village` / `mountain` / `sea` / `grassland`） | `sea` |\n| `CueId` | 合図の名前 | `miko.say.t1-pierce` |\n| `PhaseId` | 場面の名前 | `deliver` |\n\nどれも、文字列を包んだ `readonly struct` です。`null` と空文字は、どちらも空 ID（`None`、`IsEmpty`）です。大文字小文字を区別します。型が違えば、同じ文字列でも別物です。"}, {"id": "g-main-scene", "title": "3. 共有シーン Main の姿", "md": "`Assets/Scenes/Main.unity` を、YAML から読んで計算した結果です。単位はメートル、座標はワールドです。ミニチュアの台は、`Border_*` の枠で、およそ ±0.6 m 四方です。\n\n### 3.1 位置\n\n| 物 | 位置 (x, y, z) | 備考 |\n|---|---|---|\n| Main Camera | (-0.27, 1.51, -1.34) | FOV 60。子に `MouthAnchor` (-0.27, 1.43, -1.26)、`ButtonGlow`、`ButtonGlowStrong`、`StaffAlert` |\n| Miko | (-1.17, 1.21, 0.26) | 向きは Y 軸 180 度 |\n| 村（`Village/Village/Plaza`） | (-0.31, 0.11, -0.30) | 村人・家・畑・木 |\n| 山（`MountVer2/mount`） | (-0.27, 0.13, 0.30) | |\n| 草原（`Grass/Tree1`） | (0.28, 0.13, 0.39) | `Grass` のルートは (0.27, 0.01, 0.27) |\n| 海（`Sea_work`） | (0.31, -0.07, -0.30) | `Terrain_sea` は (0.04, 0.06, -0.57) |\n| 立つ場所（`StandArea`） | 村 (-1.02, -0.06, -1.03)、海 (1.07, -0.16, -0.85)、草原 (0.90, -0.09, 1.17)、山 (-0.93, -0.06, 1.00) | |\n\n### 3.2 Hierarchy とコンポーネント\n\nMain.unity のシーンに直接付いている、このリポジトリのスクリプトです。\n\n| オブジェクト | コンポーネント |\n|---|---|\n| `Main Camera` | `DesktopHead` |\n| `MinitureBase` | `AprilTagPlace` |\n| `CloudRing` | `CloudRing`、`CloudCues` |\n| `ForkTip` | `ForkTip`、`HandHeldPose` |\n| `Indicators` | `CueReaction` |\n| `DebugHud` | `TutorialDebugHud` |\n| `OpenAllRequestsAfterTutorial` | `OpenAllRequestsAfterTutorial` |\n\nPrefab として置かれている物と、その中のコンポーネントです。\n\n| Prefab の置き場 | 中身 |\n|---|---|\n| `Resources/Prefabs/Miko/Miko` | `Body` に `MikoFloat`・`MikoMover`・`MikoPointer`・`MikoCueReceiver`・`MikoFace`・`MikoSpeech`。子の `LineBook` に `MikoLineBook` |\n| `Resources/Prefabs/Misc/FoodSpawner` | `FoodSpawner`、`FoodTable`（共通の表） |\n| `Resources/Prefabs/Misc/FoodShadow` | `FoodShadow` |\n| `Resources/Prefabs/Misc/TutorialRunner` | `TutorialRunner`。Main では、子に `Prologue`・`T1Fork`・`T2Spawn`・`T3Recognize`・`T4Deliver` の Prefab が並ぶ（この順がチュートリアルの順） |\n| `Resources/Prefabs/Tutorial/<名前>` | `PrologueVideo`（子に `VideoScreen`）、`T1Fork`、`T2Spawn`、`T3Recognize`、`T4Deliver`。どれにも `MikoLineBook` が付く |\n| `[BuildingBlock] Camera Rig with MouthAnchor` | Meta XR のカメラ装置 |\n\nフィールドの Prefab です。Main では、`Resources/Prefabs/Misc/` の Variant（`Village`、`Grass Variant`、`MountVer2 Variant`）と、`Resources/Prefabs/Sea/Sea_work` を使います。Variant は、元の Prefab に、Main 用の部品（`StandArea`、`DeliveryZone` など）を足した物です。\n\n| フィールド | 元の Prefab | ルートのコンポーネント | ステップ（`FieldStep`、順に欲しい物） |\n|---|---|---|---|\n| 村 `village` | `Resources/Prefabs/Village/Village` | `FieldStages`、`SurfaceAnchor`、`DeliveryFx`、`DeliveryZone`、`FoodTable` | pumpkin、carrot、turnip、tomato |\n| 海 `sea` | `Resources/Prefabs/Sea/Sea_work` | `SurfaceAnchor`、`FieldStages`、`FoodTable`、`DeliveryZone`、`DeliveryFx`、`CueReaction` | fish、shell、shrimp |\n| 草原 `grassland` | `Resources/Prefabs/Grass/Grass` | `FieldStages`、`FoodTable` | chicken、pig、sheep、cow |\n| 山 `mountain` | `Resources/Prefabs/Mount/MountVer2` | `FoodTable`、`FieldStages`、`DeliveryZone`、`DeliveryFx` | mushroom、apple、chestnut |\n\n- 村人は、各フィールドの子に `VillagerMood` として置かれます。`FieldStep` の Helped に入れた村人が、そのステップが済むまで悩みます。\n- 食べ物の Prefab は、`Resources/Prefabs/Food/` にあります（apple、carrot、chestnut、chicken、cow、fish、mushroom、pig、pumpkin、sheep、shell、shrimp、tomato、turnip）。ファイル名が食べ物の ID です。\n\n### 3.3 Main にまだ無いもの\n\n- `GameRunner` と `RemainingTimeText`: シーンにも Prefab にもありません。置かないと、チュートリアルが終わっても本編（`main-game`）は始まりません。`TutorialRunner.Skip()` も、同じです。\n- 自動で置かれる物（1.3 節）は、手で置く必要がありません。"}, {"id": "g-menus", "title": "付録 A. メニュー一覧", "md": "| 種類 | メニュー | 型 |\n|---|---|---|\n| エディタ | `Assets/MouthOfGod/Food/Generate Icon From Selected` | `FoodIconGenerator` |\n| エディタ | `MouthOfGod/CameraWork/Add Village Tour` | `VillageTourBuilder` |\n| エディタ | `MouthOfGod/CameraWork/Add Village Zoom-Out` | `VillageTourBuilder` |\n| エディタ | `MouthOfGod/Dev/Add Delivery Zone To Mount Variant` | `MountDeliveryZoneAdder` |\n| エディタ | `MouthOfGod/Dev/Build Tutorial Test Scene` | `TutorialTestSceneBuilder` |\n| エディタ | `MouthOfGod/Dev/Fix Main Sea Placement (remove SurfaceAnchor)` | `MainSeaSwapper` |\n| エディタ | `MouthOfGod/Dev/Match Main Sea Villager Height to Village` | `MainSeaVillagerResizer` |\n| エディタ | `MouthOfGod/Dev/Print Field Diagnostics (Play mode)` | `FieldDiagnostics` |\n| エディタ | `MouthOfGod/Dev/Swap Main Sea (Temporal to Sea_work)` | `MainSeaSwapper` |\n| エディタ | `MouthOfGod/Device/Create MockDevice Prefab` | `MockDevicePrefabGenerator` |\n| エディタ | `MouthOfGod/Food/Fit Prefab Sizes` | `FoodPrefabFitter` |\n| エディタ | `MouthOfGod/Food/Generate Icons` | `FoodIconGenerator` |\n| エディタ | `MouthOfGod/Food/Generate Prefabs` | `FoodPrefabGenerator` |\n| エディタ | `MouthOfGod/Food/Regenerate Prefabs (Overwrite)` | `FoodPrefabGenerator` |\n| エディタ | `MouthOfGod/Fork/Generate Cloud Prefab` | `CloudPrefabGenerator` |\n| エディタ | `MouthOfGod/Miko/Generate Prefab` | `MikoPrefabGenerator` |\n| エディタ | `MouthOfGod/Tutorial/Generate Tutorial Prefabs` | `TutorialPrefabGenerator` |\n| エディタ | `MouthOfGod/Village/Add Missed To Villager Controller` | `VillagePrefabGenerator` |\n| エディタ | `MouthOfGod/Village/Bake Draft Village Prefab` | `VillageBaker` |\n| エディタ | `MouthOfGod/Village/Generate Effects` | `VillageFxGenerator` |\n| エディタ | `MouthOfGod/Village/Generate Prefabs` | `VillagePrefabGenerator` |\n| 右クリック | `Begin` | `TutorialRunner` |\n| 右クリック | `Complete Next Step` | `FieldStages` |\n| 右クリック | `Deliver Foreign Food (test)` | `FieldStages` |\n| 右クリック | `Deliver Wanted Food` | `FieldStages` |\n| 右クリック | `Leave` | `StandArea` |\n| 右クリック | `Open Next Want` | `FieldStages` |\n| 右クリック | `Open Now` | `OpenAllRequestsAfterTutorial` |\n| 右クリック | `Play` | `CameraCutPlayer` |\n| 右クリック | `Point` | `MikoCueReceiver` |\n| 右クリック | `Recalibrate` | `AprilTagPlace` |\n| 右クリック | `Restart` | `FieldStages` |\n| 右クリック | `Skip` | `VideoScreen` |\n| 右クリック | `Skip` | `TutorialRunner` |\n| 右クリック | `Stand Here` | `StandArea` |\n| 右クリック | `Stop` | `TutorialRunner` |\n| 右クリック | `Stop` | `CameraCutPlayer` |\n| 右クリック | `テスト: 最初のセリフ` | `MikoSpeech` |\n| 右クリック | `対応一覧を出す` | `FoodTable` |\n| 右クリック | `表情: ∪∪` | `MikoFace` |\n| 右クリック | `表情: ♡♡` | `MikoFace` |\n| 右クリック | `表情: にっこり` | `MikoFace` |\n| 右クリック | `表情: ふつう` | `MikoFace` |\n| 右クリック | `表情: ー・` | `MikoFace` |\n| 右クリック | `表情: ーー` | `MikoFace` |\n| 右クリック | `表情: ＞＜` | `MikoFace` |"}, {"id": "g-resources", "title": "付録 B. Resources の置き場所", "md": "コードが `Resources.Load` で読む場所です。\n\n| パス | 読む所 | 中身 |\n|---|---|---|\n| `Resources/Prefabs/Device/MockDevice` | `MockDevice.GetOrCreate` | MockDevice の Prefab |\n| `Resources/Prefabs/Fork/Cloud` | `CloudRing` | 雲の Prefab |\n| `Resources/Prefabs/Food/<食べ物の ID>` | `FoodTable`（Prefab の参照）、`FoodTables.IdOf` | 食べ物の Prefab。ファイル名が食べ物の ID |\n| `Resources/Icons/Food/<食べ物の ID>` | `RequestBubbleText.IconPath` | 吹き出しのアイコン |\n| `Resources/Prefabs/Village/Fx_Joy`・`Fx_Smoke` | `DeliveryFx`、`DeliveryZone`、`PopInEffect` | 喜びの粒・煙 |\n| `Resources/Sounds/Village/Done`・`Missed` | `DeliveryFx` | 欲しい物が届いた音・違う物が届いた音 |\n| `Resources/Prefabs/Miko/Miko` | シーンの Miko | 巫女の Prefab |\n| `Resources/Prefabs/Tutorial/<名前>` | `TutorialRunner` の子 | プロローグと T1〜T4 の Prefab |\n| `Resources/AprilTagSettings` | `AprilTagSettings.Load` | AprilTag の設定（無ければコードの既定値） |\n| `Resources/RequestBubbleSettings` | `RequestBubbleSettings.Load` | 吹き出しの設定（無ければコードの既定値） |"}], "modules": ["Core", "Device", "Fork", "Food", "Village", "UI", "Miko", "Tutorial", "Game", "Tracking", "CameraWork", "DevTools"], "intro": {"Core": "全体で共有する、小さな基盤です。他の asmdef に依存しません。ロジックは置かず、ID・イベントのデータ・interface・置き場だけを置きます。\n\n#### 置き場", "Device": "触感デバイスの入力です。`MockDevice` が、デバイスなしで、Quest のコントローラやキーボードで「噛む・決定する」を代わりにします。実機は、`IDevice` を実装して `Devices.Register` するだけで差し替わります。", "Fork": "体験者が持つフォークです。雲を刺し、口に含み、決定で食べ終えるまでの状態を持ちます。", "Food": "食感から食べ物を引いて、生み、前へ飛ばします。「食感 → 食べ物」の表は、全フィールド共通の表（`Field Id` が空）と、フィールドごとの表に分けます。", "Village": "フィールド（村・山・海・草原）の見た目の戻り方と、欲しい物です。物が落ちた場所の判定、届いたときの反応、立つ場所の判定も、ここにあります。", "UI": "表示の部品です。Core のイベントと合図を受けます。", "Miko": "巫女です。浮いて、体験者の方を向き、しゃべり、表情を変え、指さし、体験者についてきます。身振りは Animator が担当します。", "Tutorial": "プロローグとチュートリアル 1〜4 を進めます。1 チュートリアル = 1 つの `TutorialScript`（人形劇スクリプト）を、`TutorialRunner` が順に動かします。", "Game": "本編の進行です。チュートリアルが終わったら本編を始め、制限時間が来たら終わらせます。", "Tracking": "AprilTag とハンドトラッキングで、位置を合わせます。ほかの機能には、`Transform` と追跡中かどうかだけを渡します。", "CameraWork": "付けたオブジェクト（カメラなど）を、決めた軌道と速さで動かします。直線・ベジェ曲線・円弧・待ちのカットをつなぎ、緩急・向き・ズームを Inspector で決めます。村のカットを置くメニューは、`MouthOfGod/CameraWork/Add Village Tour` と `Add Village Zoom-Out` です。", "DevTools": "Quest なしで試すための道具です。展示では使いません。"}, "preface": "2026-10-28 時点の `Assets/Scripts` の全スクリプトについて、API・名前空間・Inspector での見え方・機能どうしのつながりをまとめます。\n\n> この文書の「API」「Inspector」の表は、`tools/api_doc/build.py` が C# のコードから作ります。手で直さないでください。直すときは、コードの `///` の説明か `[Tooltip]` を直して、`python3 tools/api_doc/build.py` を実行します。章の説明文は `tools/api_doc/template.md` に書きます。"};
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const byName = new Map(), byId = new Map();
for (const t of DATA.types) { if (!byName.has(t.name)) byName.set(t.name, t); byId.set(t.id, t); }
const KIND = { class: "class", struct: "struct", interface: "interface", enum: "enum" };
const SECTION = { Runtime: "", Editor: "エディタ専用", Sandbox: "試験用" };
// 文章用の小さな Markdown 変換（見出し・段落・箇条書き・表・コード・引用・太字・リンク）。外部のライブラリは使わない。
function inline(t) {
  const codes = [];
  t = t.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  t = esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
  return t.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + esc(codes[+i]) + "</code>");
}
function mdToHtml(src) {
  const lines = src.replace(/\r/g, "").split("\n"); const out = []; let i = 0;
  const isTable = l => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    let m;
    if ((m = l.match(/^```(\w*)/))) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].startsWith("```")) buf.push(lines[i++]);
      i++; out.push(`<pre><code class="language-${m[1]}">${esc(buf.join("\n"))}</code></pre>`); continue;
    }
    if ((m = l.match(/^(#{1,4})\s+(.*)$/))) { out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if (isTable(l) && i + 1 < lines.length && /^\s*\|[\s|:-]+\|\s*$/.test(lines[i + 1])) {
      const cells = r => r.trim().replace(/^\||\|$/g, "").split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, "|"));
      const head = cells(l); i += 2; const rows = [];
      while (i < lines.length && isTable(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<table><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr>${rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</table>`); continue;
    }
    if (/^>\s?/.test(l)) { const buf = []; while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, "")); out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const mm = lines[i].match(/^\s*([-*]|\d+\.)\s+(.*)$/);
        if (mm) items.push(mm[2]); else items[items.length - 1] += " " + lines[i].trim();
        i++;
      }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map(x => `<li>${inline(x)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`); continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|>\s?|\s*([-*]|\d+\.)\s+|\s*\|)/.test(lines[i])) buf.push(lines[i++].trim());
    if (!buf.length) { out.push(`<p>${inline(lines[i++])}</p>`); continue; }
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}

// 型名を、型のページへのリンクにする（自分自身は除く）
function linkTypes(text, self) {
  return esc(text).replace(/[A-Za-z_][A-Za-z0-9_]*/g, w => (byName.has(w) && w !== self) ? `<a href="#${byName.get(w).id}">${w}</a>` : w);
}
function md(text) {
  const el = document.createElement("div");
  el.className = "prose";
  el.innerHTML = mdToHtml(text);
  el.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tablewrap"; t.replaceWith(w); w.append(t); });
  el.querySelectorAll("pre > code.language-mermaid").forEach(c => {
    const p = document.createElement("p"); p.className = "see";
    p.innerHTML = '図は <a href="#g-graph">つながりの図</a> のページにあります。';
    c.parentElement.replaceWith(p);
  });
  el.querySelectorAll("code").forEach(c => {
    if (c.parentElement.tagName === "PRE") return;
    const name = c.textContent.replace(/[（(].*$/, "").replace(/^`|`$/g, "").split(".")[0];
    const t = byName.get(c.textContent) || (c.textContent.includes(".") ? byName.get(name) : null);
    if (t) { const a = document.createElement("a"); a.href = "#" + t.id; c.replaceWith(a); a.append(c); }
  });
  el.querySelectorAll("a[href^='http']").forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  return el;
}

// ---- 一覧 ----
function buildNav(filter) {
  const nav = $("#nav");
  const q = (filter || "").trim().toLowerCase();
  let h = "";
  if (q) {
    const hits = [];
    for (const t of DATA.types) {
      if (t.name.toLowerCase().includes(q)) hits.push([t, null, t.brief]);
      for (const m of t.members) if (m.name.toLowerCase().includes(q)) hits.push([t, m, m.brief]);
    }
    h += `<h2>検索結果 ${hits.length} 件</h2><div class="results">`;
    for (const [t, m, b] of hits.slice(0, 80)) h += `<a href="#${t.id}${m ? "" : ""}" data-m="${m ? esc(m.name) : ""}">${esc(t.name)}${m ? "." + esc(m.name) : ""}<small>${esc(b || "")}</small></a>`;
    h += "</div>";
    nav.innerHTML = h;
    nav.querySelectorAll("a[data-m]").forEach(a => a.addEventListener("click", () => { window.__scrollMember = a.dataset.m; }));
    return;
  }
  h += `<h2>ガイド</h2><a href="#overview" data-k="overview">概要</a><a href="#g-design" data-k="g-design"><strong>設計の考え方（なぜこの形か）</strong></a><a href="#g-graph" data-k="g-graph"><strong>つながりの図</strong></a><a href="#g-recipes" data-k="g-recipes"><strong>やりたいこと別の手順</strong></a>`;
  for (const g of DATA.guide) h += `<a href="#${g.id}" data-k="${g.id}">${esc(g.title)}</a>`;
  h += `<h2>名前空間</h2>`;
  for (const mod of DATA.modules) {
    const ts = DATA.types.filter(t => t.mod === mod).sort((a, b) => a.name.localeCompare(b.name));
    h += `<a class="mod" href="#m-${mod}" data-k="m-${mod}">MouthOfGod.${mod}<span class="count">${ts.length}</span></a>`;
    for (const [role] of DATA.roles) {
      const g = ts.filter(t => t.role === role);
      if (!g.length) continue;
      const links = g.map(t => `<a class="t" href="#${t.id}" data-k="${t.id}">${esc(t.name)}</a>`).join("");
      if (role === "エディタ" || role === "試験用") h += `<details><summary>${role} ${g.length}</summary>${links}</details>`;
      else h += `<div class="grp">${role}</div>${links}`;
    }
  }
  nav.innerHTML = h;
}
function markNav(id) {
  document.querySelectorAll("#nav a.on").forEach(a => a.classList.remove("on"));
  const a = $(`#nav a[data-k="${id}"]`);
  if (a) { a.classList.add("on"); const d = a.closest("details"); if (d) d.open = true; a.scrollIntoView({ block: "nearest" }); }

  const inner = document.createElement("div"); inner.innerHTML = h; wrap.append(inner);

    e.preventDefault(); const el = document.getElementById(a.dataset.go); if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 1600); }
  }));
  return wrap;
}

function route() {
  const id = (location.hash || "#overview").slice(1);
  const main = $("#main");
  let page, navKey = id;
  let scrollTo = null;
  if (id === "overview") page = pageOverview();
  else if (id === "g-design") page = pageDesign();
  else if (id === "g-graph") page = pageGraph();
  else if (id === "g-recipes") page = pageRecipes();
  else if (id.startsWith("r-")) { page = pageRecipes(); navKey = "g-recipes"; scrollTo = "sec-" + id; }
  else if (id.startsWith("d-")) { page = pageDesign(); navKey = "g-design"; scrollTo = "sec-" + id; }
  else if (id.startsWith("g-")) { const g = DATA.guide.find(x => x.id === id); page = g ? pageGuide(g) : pageOverview(); }
  else if (id.startsWith("m-")) page = pageModule(id.slice(2));
  else if (byId.has(id)) page = pageType(byId.get(id));
  else { page = pageOverview(); navKey = "overview"; }
  main.replaceChildren(page);
  main.scrollTop = 0;
  markNav(navKey);
  if (scrollTo) { const el = document.getElementById(scrollTo); if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 1800); } }
  document.body.classList.remove("open");
  document.title = id.startsWith("t-") && byId.has(id) ? byId.get(id).name + " | MouthOfGod API" : "MouthOfGod API";
  if (window.__scrollMember) {
    const el = main.querySelector(`article[data-name="${CSS.escape(window.__scrollMember)}"]`);
    if (el) { el.scrollIntoView({ block: "start" }); el.classList.add("hit"); }
    window.__scrollMember = null;
  }
  try { if (window.mermaid && main.querySelector(".mermaid")) window.mermaid.run({ querySelector: "#main .mermaid" }); } catch (e) { /* 図が出なくても、本文は読める */ }
}

buildNav("");
window.addEventListener("hashchange", route);
route();
$("#q").addEventListener("input", e => { buildNav(e.target.value); if (!e.target.value) markNav((location.hash || "#overview").slice(1)); });
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") { const a = $("#nav .results a"); if (a) { window.__scrollMember = a.dataset.m || null; location.hash = a.getAttribute("href"); route(); } } });
$("#menu").addEventListener("click", () => document.body.classList.toggle("open"));
$("#theme").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("api-theme", root.dataset.theme); } catch (e) { /* 保存できなくても動く */ }
});
try { const s = localStorage.getItem("api-theme"); if (s) document.documentElement.dataset.theme = s; } catch (e) { /* 既定のまま */ }
</script>
