ける。", "brief": "いまの場面（チュートリアルの名前、本編、エンディングなど）の置き場。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "PhaseId", "name": "Current", "params": "", "kind": "property", "acc": "", "doc": "いまの場面。決まっていなければ None。", "brief": "いまの場面。"}, {"mods": ["static"], "rtype": "Action<PhaseId>", "name": "Changed", "params": "", "kind": "event", "acc": "", "doc": "場面が変わった（新しい場面を運ぶ）。Current を更新してから出す。同じ場面を Set しても出ない。", "brief": "場面が変わった（新しい場面を運ぶ）。"}, {"mods": ["static"], "rtype": "void", "name": "Set", "params": "PhaseId phase", "kind": "method", "acc": "", "doc": "いまの場面を決める。いまと同じなら何もしない。", "brief": "いまの場面を決める。"}], "nested_in": null, "role": "static（置き場・計算）", "remarks": "- 場面は `PhaseId`（文字列）。番号ではなく名前にする（チュートリアルの順番が変わっても、読む側を直さずに済む）。\n  名前の一覧は docs/progress-keys.md の「場面（PhaseId の名前）」に書く。\n- フィールドは、この置き場を読んで「いまのチュートリアルなら…」と分けてよい。ふつうの反応は `Cues`（合図）で受ける。\n- 何も決まっていないときは `None`。\n- static なので、Play のたびに空にする。すべてメインスレッドから呼ぶ。\n- この形を変えるときは、使う側すべてに効くので、別の PR にする。", "usedBy": ["FoodShadow", "GameRunner", "TutorialRunner"], "uses": ["PhaseId"]}, {"id": "t-Standing", "name": "Standing", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Core", "file": "Core/Standing.cs", "mod": "Core", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "体験者がいま前に立っているフィールドの置き場。チュートリアルの「ここに立って」の案内と、そのフィールド専用の食べ物の表を選ぶのに使う。物がどのフィールドに届くかは、ここでは決めない。体験者が狙って飛ばした物が、実際に落ちたフィールドに届く（Village の DeliveryZone）。立つ位置を判定する側（Village の立つ場所）が Set し、使う側（Food・Tutorial・Game）は Field で読み、Changed で知らせを受ける。", "brief": "体験者がいま前に立っているフィールドの置き場。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "FieldId", "name": "Field", "params": "", "kind": "property", "acc": "", "doc": "いま前に立っているフィールド。どこにも立っていなければ None。", "brief": "いま前に立っているフィールド。"}, {"mods": ["static"], "rtype": "Action<FieldId>", "name": "Changed", "params": "", "kind": "event", "acc": "", "doc": "立っているフィールドが変わった（新しいフィールドを運ぶ）。Field を更新してから出す。同じフィールドを Set しても出ない。", "brief": "立っているフィールドが変わった（新しいフィールドを運ぶ）。"}, {"mods": ["static"], "rtype": "void", "name": "Set", "params": "FieldId field", "kind": "method", "acc": "", "doc": "いま立っているフィールドを決める。", "brief": "いま立っているフィールドを決める。"}, {"mods": ["static"], "rtype": "void", "name": "Leave", "params": "FieldId field", "kind": "method", "acc": "", "doc": "そのフィールドに立っているときだけ、どこにも立っていない状態に戻す。離れた場所が、別の場所の判定を消さないようにするため。", "brief": "そのフィールドに立っているときだけ、どこにも立っていない状態に戻す。"}], "nested_in": null, "role": "static（置き場・計算）", "remarks": "- どこにも立っていないときは `None`。\n- 立つ位置の取り方（頭の位置、床の印など）は、判定する側が決める。使う側は知らない。\n- static なので、Play のたびに空にする。すべてメインスレッドから呼ぶ。\n- この形を変えるときは、使う側すべてに効くので、別の PR にする。", "usedBy": ["FieldDiagnostics", "FoodSpawner", "StandArea", "TutorialWait"], "uses": ["FieldId"]}, {"id": "t-DesktopHead", "name": "DesktopHead", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.DevTools", "file": "DevTools/DesktopHead.cs", "mod": "DevTools", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "Quest なしで試すための頭。Main Camera に付けると、キーボードとマウスで歩いて見回せる。", "brief": "Quest なしで試すための頭。", "values": [], "fields": [{"header": null, "type": "float", "name": "walkSpeed", "label": "Walk Speed", "default": "1.2f", "tooltip": "歩く速さ（m / 秒）"}, {"header": null, "type": "float", "name": "runMultiplier", "label": "Run Multiplier", "default": "3f", "tooltip": "Shift を押している間、歩く速さを何倍にするか"}, {"header": null, "type": "float", "name": "degreesPerPixel", "label": "Degrees Per Pixel", "default": "0.15f", "tooltip": "マウスを 1 ピクセル動かしたときに回る角度（度）"}, {"header": null, "type": "float", "name": "maxPitch", "label": "Max Pitch", "default": "80f", "tooltip": "上下を向ける角度の上限（度）"}], "menus": [], "members": [{"mods": [], "rtype": "void", "name": "Teleport", "params": "Vector3 position, float yaw", "kind": "method", "acc": "", "doc": "水平の位置だけを移す。高さはそのまま。向きは yaw（度）にする。", "brief": "水平の位置だけを移す。"}], "nested_in": null, "role": "コンポーネント", "remarks": "- WASD で歩く。Shift を押している間は速く歩く。マウスの右ボタンを押しながら動かすと、向きが変わる。\n- 高さは変えない。立っている場所（StandArea）は、頭の水平の位置で決まるため。\n- Quest の頭が動いているときは、何もしない（頭の位置は XR が決める）。\n- 展示では使わない。", "usedBy": ["TutorialDebugHud", "TutorialTestSceneBuilder"], "uses": []}, {"id": "t-FieldDiagnostics", "name": "FieldDiagnostics", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.DevTools.Editor", "file": "DevTools/Editor/FieldDiagnostics.cs", "mod": "DevTools", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "Play 中に押すと、場所ごとに食べ物が引けているかを調べる材料を、Console に 1 回で出す。出すもの: いま立っているフィールド、頭の位置、各「立つ場所」の位置・広さ・頭との距離・入っているか、登録された食べ物の表。フィールドの前に立った状態で押す。結果を貼れば、箱に入っていないのか、表が引けないのかが分かる。", "brief": "Play 中に押すと、場所ごとに食べ物が引けているかを調べる材料を、Console に 1 回で出す。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Dev/Print Field Diagnostics (Play mode)"}], "members": [{"mods": ["static"], "rtype": "void", "name": "Print", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": ["FoodTables", "StandArea", "Standing"]}, {"id": "t-MainSeaSwapper", "name": "MainSeaSwapper", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.DevTools.Editor", "file": "DevTools/Editor/MainSeaSwapper.cs", "mod": "DevTools", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "共有シーン（Main）の仮の海（Misc/Sea(Temporal)）を、完成版の海（Sea/Sea_work）に入れ替える（#329・#338）。仮の海は、村人も海の食べ物の表も持たない。そのため、吹き出しが村人から離れた所に出て、海では共通の表（e・f だけ）しか引けなかった。位置・向き・親・兄弟の順・体験者の頭（StandArea の Head）は、仮の海から引き継ぐ。仮の海を指していた参照は、新しい海に付け替える。1 回実行して、Main をコミットする。Main に仮の海が無ければ、何もしない（何度実行しても同じ）。", "brief": "共有シーン（Main）の仮の海（Misc/Sea(Temporal)）を、完成版の海（Sea/Sea_work）に入れ替える（#329・#338）。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Dev/Swap Main Sea (Temporal to Sea_work)"}, {"kind": "MenuItem", "path": "MouthOfGod/Dev/Fix Main Sea Placement (remove SurfaceAnchor)"}], "members": [{"mods": ["static"], "rtype": "void", "name": "Swap", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}, {"mods": ["static"], "rtype": "void", "name": "FixPlacement", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": ["SurfaceAnchor"]}, {"id": "t-MainSeaVillagerResizer", "name": "MainSeaVillagerResizer", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.DevTools.Editor", "file": "DevTools/Editor/MainSeaVillagerResizer.cs", "mod": "DevTools", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "共有シーン（Main）の海の村人の背の高さを、村の村人の平均に合わせる。高さはワールド座標で測る。海の親は (0.54, 0.2, 0.54) とつぶれていて、海の村人のローカルの大きさは縦だけ大きくして打ち消している。そのため、ローカルの大きさに同じ倍率を 3 軸ともかけて、打ち消しを崩さないようにする。変更は Main の上書きとして残し、Sea_work.prefab は変えない。直した海は、バックアップとして独立した Prefab（Sea_work_VillagerResized）にも保存する。何度実行しても同じ結果になる。", "brief": "共有シーン（Main）の海の村人の背の高さを、村の村人の平均に合わせる。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Dev/Match Main Sea Villager Height to Village"}], "members": [{"mods": ["static"], "rtype": "void", "name": "Resize", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": ["VillagerMood"]}, {"id": "t-MountDeliveryZoneAdder", "name": "MountDeliveryZoneAdder", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.DevTools.Editor", "file": "DevTools/Editor/MountDeliveryZoneAdder.cs", "mod": "DevTools", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "山の Main 用 Prefab（Misc/MountVer2 Variant）に、届ける場所（DeliveryZone）と、それを受けるトリガーの箱を足す。山には、食べ物が落ちた場所を判定する DeliveryZone が無く、山の村人に向けて飛ばしても届いたことにならなかった。草原の Variant と同じ形にする。箱は、山の見た目（立つ場所の足あとは除く）の広さに合わせ、横に余白を、上に高さを足す。1 回実行して、Variant をコミットする。すでに DeliveryZone があれば、何もしない（何度実行しても同じ）。", "brief": "山の Main 用 Prefab（Misc/MountVer2 Variant）に、届ける場所（DeliveryZone）と、それを受けるトリガーの箱を足す。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Dev/Add Delivery Zone To Mount Variant"}], "members": [{"mods": ["static"], "rtype": "void", "name": "Add", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": ["DeliveryZone", "StandArea"]}, {"id": "t-TutorialTestSceneBuilder", "name": "TutorialTestSceneBuilder", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.DevTools.Editor", "file": "DevTools/Editor/TutorialTestSceneBuilder.cs", "mod": "DevTools", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "Quest なしで、プロローグとチュートリアル 1〜4 を通して試すシーンを作る。メニュー「MouthOfGod/Dev/Build Tutorial Test Scene」。", "brief": "Quest なしで、プロローグとチュートリアル 1〜4 を通して試すシーンを作る。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Dev/Build Tutorial Test Scene"}], "members": [{"mods": ["const"], "rtype": "string", "name": "ScenePath", "params": "", "kind": "field", "acc": "", "doc": "", "brief": ""}, {"mods": ["static"], "rtype": "void", "name": "Build", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "- 作るシーンは `ScenePath`。毎回、作り直す（手で直した所は消える）。試したい値は、Play 中か、作ったあとに Inspector で変える。\n- 並べる物: 頭（キーボードとマウスで動く Main Camera）、フォークの先、雲、食べ物を生む装置と表、村と海のフィールド、立つ場所、巫女、影、合図で光る印、チュートリアル、状態の表示。\n- フィールドに届いたときの反応は、FieldStages が自分で付ける DeliveryFx が出す（違う物は煙を出して消える）。\n- チュートリアルは、Assets/Resources/Prefabs/Tutorial/ の Prefab を置く。セリフも Prefab に入っている。Prefab を直せば、作り直さなくても、このシーンに反映される。\n- 食感は MockDevice の既定（placeholder-a〜f）を使う。a〜d は各フィールドの食べ物（村の表）、e はリンゴ、f は魚（共通の表）。\n- バッチモードからも作れる: `-executeMethod MouthOfGod.DevTools.Editor.TutorialTestSceneBuilder.Build`", "usedBy": [], "uses": ["CloudCues", "CloudRing", "CueReaction", "DeliveryZone", "DesktopHead", "FieldStages", "FieldStep", "FoodShadow", "FoodSpawner", "FoodTable", "ForkTip", "StandArea", "TutorialDebugHud", "TutorialPrefabGenerator", "TutorialRunner"]}, {"id": "t-TutorialDebugHud", "name": "TutorialDebugHud", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.DevTools", "file": "DevTools/TutorialDebugHud.cs", "mod": "DevTools", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "Quest なしで試すときの表示。Game ビューの左上に、いまの場面・立っている場所・食感・フォーク・欲しい物・覚えたこと・最近の合図を出す。ボタンで、チュートリアルを始める・止める、立つ場所へ移る、ができる。", "brief": "Quest なしで試すときの表示。", "values": [], "fields": [{"header": null, "type": "TutorialRunner", "name": "runner", "label": "Runner", "default": "", "tooltip": "始める・止めるボタンと、覚えたことの表示に使う"}, {"header": null, "type": "DesktopHead", "name": "head", "label": "Head", "default": "", "tooltip": "移るボタンで動かす頭。空なら、Main Camera の DesktopHead"}, {"header": null, "type": "Transform[]", "name": "teleportTargets", "label": "Teleport Targets", "default": "new Transform[0]", "tooltip": "移るボタンの行き先。ふつうは各フィールドの StandArea"}, {"header": null, "type": "string[]", "name": "memoryKeys", "label": "Memory Keys", "default": "{ \"fork-learned\", \"food-born\", \"texture-shadow-seen\", \"request-seen\", \"delivered-by-standing\", }", "tooltip": "表示する、覚えたことの名前（docs/progress-keys.md）"}, {"header": null, "type": "int", "name": "cueLines", "label": "Cue Lines", "default": "12", "tooltip": "最近の合図を、いくつまで出すか"}, {"header": null, "type": "float", "name": "width", "label": "Width", "default": "420f", "tooltip": "表示の幅（ピクセル）"}], "menus": [], "members": [], "nested_in": null, "role": "コンポーネント", "remarks": "読むのは Core の置き場と、`TutorialRunner` だけ。展示では使わない（Quest の中には出ない）。", "usedBy": ["TutorialTestSceneBuilder"], "uses": ["CueRequested", "Cues", "DesktopHead", "Devices", "Fields", "Forks", "IDevice", "IFieldRequests", "IFork", "TutorialRunner"]}, {"id": "t-MockDevicePrefabGenerator", "name": "MockDevicePrefabGenerator", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Device.Editor", "file": "Device/Editor/MockDevicePrefabGenerator.cs", "mod": "Device", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "MockDevice の Prefab を Assets/Resources/Prefabs/Device/ に作る。1 回実行して、できた Prefab をコミットする。Play すると、MockDevice はこの Prefab から作られる（Inspector で変えた設定が残る）。既にある Prefab は上書きしない。", "brief": "MockDevice の Prefab を Assets/Resources/Prefabs/Device/ に作る。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Device/Create MockDevice Prefab"}], "members": [], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": ["MockDevice", "MockDeviceModel"]}, {"id": "t-MockDevice", "name": "MockDevice", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Device", "file": "Device/MockDevice.cs", "mod": "Device", "sec": "Runtime", "bases": ["MonoBehaviour", "IDevice"], "attrs": [], "serializable": false, "doc": "デバイスなしで動かす IDevice。Meta Quest のコントローラ（ゲームパッド・キーボードも可）で「噛む・決定する」を代わりにする。噛み始めで Bitten、噛んでいる間は一定間隔で TextureChanged、決定操作で Confirmed。操作の割り当ては Inspector（InputAction）で変えられる。スクリプトで作れる（GetOrCreate）。Play すると自動で用意する。", "brief": "デバイスなしで動かす IDevice。", "values": [], "fields": [{"header": null, "type": "string[]", "name": "textureIds", "label": "Texture Ids", "default": "{ \"placeholder-a\", \"placeholder-b\", \"placeholder-c\", \"placeholder-d\", \"placeholder-e\", \"placeholder-f\" }", "tooltip": "噛んでいる間に順に切り替わる食感 ID。既定はプレースホルダー。実際の ID に差し替える。Play 中に変えても反映されない"}, {"header": null, "type": "float", "name": "switchIntervalSeconds", "label": "Switch Interval Seconds", "default": "1.5f", "tooltip": "食感が切り替わる間隔（秒）。暫定。Play 中に変えても反映されない"}, {"header": null, "type": "InputAction", "name": "biteAction", "label": "Bite Action", "default": "new InputAction(\"Bite\", InputActionType.Button, \"<XRController>{RightHand}/triggerPressed\")", "tooltip": "噛む操作（押している間が噛んでいる間）。Inspector でバインドを変えられる。暫定: Quest 右トリガー / 左手を握る（ハンドトラッキング） / Space / ゲームパッド A"}, {"header": null, "type": "InputAction", "name": "confirmAction", "label": "Confirm Action", "default": "new InputAction(\"Confirm\", InputActionType.Button, \"<XRController>{RightHand}/primaryButton\")", "tooltip": "決定操作。Inspector でバインドを変えられる。暫定: Quest 右 A ボタン / 左手のつまみ（ハンドトラッキング） / Enter / ゲームパッド Start。実機の「ハードのボタン 1 つ」の代わり"}, {"header": null, "type": "bool", "name": "logEvents", "label": "Log Events", "default": "true", "tooltip": "噛む・食感・決定を Console に出す（受け取る側がまだ無くても、動いているか分かるように）"}, {"header": null, "type": "float", "name": "contentPercent", "label": "Content Percent", "default": "", "tooltip": "デバイスの内容量（0〜100 %）。先端に表示する。Inspector で動かして試せる"}], "menus": [], "members": [{"mods": [], "rtype": "float", "name": "ContentPercent", "params": "", "kind": "property", "acc": "", "doc": "デバイスの内容量（0〜100 %）。見た目（MockDeviceModel）が読む。", "brief": "デバイスの内容量（0〜100 %）。"}, {"mods": [], "rtype": "TextureId", "name": "Current", "params": "", "kind": "property", "acc": "", "doc": "いまの食感。まだ噛んでいなければ TextureId.None。噛むのをやめても、最後の食感が残る。（IDevice の説明）", "brief": "いまの食感。"}, {"mods": [], "rtype": "bool", "name": "IsBiting", "params": "", "kind": "property", "acc": "", "doc": "噛んでいる間（噛む操作を押している間）。見た目（MockDeviceModel）が読む。", "brief": "噛んでいる間（噛む操作を押している間）。"}, {"mods": [], "rtype": "Action<TextureId>", "name": "TextureChanged", "params": "", "kind": "event", "acc": "", "doc": "食感が変わった（新しい食感を運ぶ）。Current を更新してから出す。噛み始めは Bitten の直後に、最初の食感で出す（前と同じ食感でも出す）。噛むのをやめても None では出さない。（IDevice の説明）", "brief": "食感が変わった（新しい食感を運ぶ）。"}, {"mods": [], "rtype": "Action<TextureId>", "name": "Confirmed", "params": "", "kind": "event", "acc": "", "doc": "決定した。決定したときの食感（Current）を運ぶ。噛む前の決定なら TextureId.None。（IDevice の説明）", "brief": "決定した。"}, {"mods": [], "rtype": "Action", "name": "Bitten", "params": "", "kind": "event", "acc": "", "doc": "噛み始めた。噛み始めるたびに 1 回出す（噛んでいる間は出さない）。（IDevice の説明）", "brief": "噛み始めた。"}, {"mods": ["static"], "rtype": "MockDevice", "name": "GetOrCreate", "params": "", "kind": "method", "acc": "", "doc": "シーン内の MockDevice を返す。無ければ、Prefab があれば Prefab から、無ければスクリプトで作る（既定の操作割り当て付き）。Prefab にしておくと、Inspector で変えた設定（操作の割り当て・間隔・食感 ID）が残る。", "brief": "シーン内の MockDevice を返す。"}], "nested_in": null, "role": "コンポーネント", "remarks": "", "usedBy": ["MockDeviceModel", "MockDevicePrefabGenerator"], "uses": ["Devices", "IDevice", "MockDeviceModel", "TextureId"]}, {"id": "t-MockDeviceModel", "name": "MockDeviceModel", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Device", "file": "Device/MockDeviceModel.cs", "mod": "Device", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": ["[RequireComponent(typeof(MockDevice))]"], "serializable": false, "doc": "MockDevice の雑な見た目。細長い棒で、先端に内容量（%）を出す。手（Quest のハンドトラッキング）を握ると、手に付いて保持される。離すとその場に残る。見た目だけで、IDevice のイベントには関わらない。", "brief": "MockDevice の雑な見た目。", "values": [], "fields": [{"header": null, "type": "Transform", "name": "handAnchor", "label": "Hand Anchor", "default": "", "tooltip": "手の位置。空なら、シーン内の RightHandAnchor（OVRCameraRig）を探す"}, {"header": null, "type": "float", "name": "graspThreshold", "label": "Grasp Threshold", "default": "0.8f", "tooltip": "握りの強さ（0〜1）。この値以上で握ったことにする。暫定"}, {"header": null, "type": "InputAction", "name": "graspAction", "label": "Grasp Action", "default": "new InputAction(\"Grasp\", InputActionType.Value, \"<HandInteraction>{RightHand}/graspValue\")", "tooltip": "握る操作（float）。Inspector でバインドを変えられる。暫定: OpenXR Hand Interaction の右手 graspValue / Quest 右グリップ"}, {"header": null, "type": "float", "name": "length", "label": "Length", "default": "0.2f", "tooltip": "棒の長さ（m）。見た目を作るときに使う"}, {"header": null, "type": "TextMesh", "name": "label", "label": "Label", "default": "", "tooltip": "先端の内容量（%）の表示。Prefab に入っていればそれを使う。空なら Play 時に見た目を作る"}], "menus": [], "members": [], "nested_in": null, "role": "コンポーネント", "remarks": "", "usedBy": ["MockDevice", "MockDevicePrefabGenerator"], "uses": ["MockDevice", "TextureId"]}, {"id": "t-FoodIconGenerator", "name": "FoodIconGenerator", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Food.Editor", "file": "Food/Editor/FoodIconGenerator.cs", "mod": "Food", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "食べ物の Prefab を、遠近のあるカメラで斜め前から写し、背景が透明な PNG にする。村人の吹き出しのアイコンに使う。Assets/Resources/Prefabs/Food/ のすべての Prefab から、Assets/Resources/Icons/Food/<食べ物の ID>.png を作る。1 回実行して、できた PNG をコミットする（Play 時には使わない）。既にある PNG は上書きしない。手で描いたアイコンを同じ名前で置けば、そちらが使われる。作り直すときは、Project で食べ物の Prefab を選び、右クリックの「MouthOfGod/Food/Generate Icon From Selected」を使う（上書きする）。", "brief": "食べ物の Prefab を、遠近のあるカメラで斜め前から写し、背景が透明な PNG にする。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Food/Generate Icons"}, {"kind": "MenuItem", "path": "Assets/MouthOfGod/Food/Generate Icon From Selected"}], "members": [{"mods": ["static"], "rtype": "void", "name": "Generate", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": []}, {"id": "t-FoodPrefabFitter", "name": "FoodPrefabFitter", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Food.Editor", "file": "Food/Editor/FoodPrefabFitter.cs", "mod": "Food", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "手で作った食べ物の Prefab（FoodPrefabGenerator を通っていないもの）の大きさを、その場で合わせる。一番長い辺が目標の長さ（m）になるよう、一番上の大きさを同じ倍率で変える。GUID も Mass などの設定も変わらない。すでに目標どおりの Prefab は、何もしない（何度実行しても同じ）。食べ物を飛ばして見やすい大きさは、FoodPrefabGenerator の Sources と同じ考えで、長さは仮。", "brief": "手で作った食べ物の Prefab（FoodPrefabGenerator を通っていないもの）の大きさを、その場で合わせる。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Food/Fit Prefab Sizes"}], "members": [{"mods": ["static"], "rtype": "void", "name": "Fit", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": []}, {"id": "t-FoodPrefabGenerator", "name": "FoodPrefabGenerator", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Food.Editor", "file": "Food/Editor/FoodPrefabGenerator.cs", "mod": "Food", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "食べ物の Prefab を、素材（FBX）から Assets/Resources/Prefabs/Food/ に作る。1 回実行して、できた Prefab をコミットする（Play 時には使わない）。既にある Prefab は上書きしない。Prefab のファイル名が食べ物の ID（FoodId）になるので、村の欲しい物（FieldStep の Food）と同じ小文字にする。素材の置き場所は docs/quaternius-assets.md。", "brief": "食べ物の Prefab を、素材（FBX）から Assets/Resources/Prefabs/Food/ に作る。", "values": [], "fields": [], "menus": [{"kind": "MenuItem", "path": "MouthOfGod/Food/Generate Prefabs"}, {"kind": "MenuItem", "path": "MouthOfGod/Food/Regenerate Prefabs (Overwrite)"}], "members": [{"mods": ["static"], "rtype": "void", "name": "Generate", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}, {"mods": ["static"], "rtype": "void", "name": "Regenerate", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "エディタ", "remarks": "", "usedBy": [], "uses": []}, {"id": "t-FoodRow", "name": "FoodRow", "kind": "struct", "mods": [], "ns": "MouthOfGod.Food", "file": "Food/FoodRow.cs", "mod": "Food", "sec": "Runtime", "bases": [], "attrs": [], "serializable": true, "doc": "FoodTable の 1 行。「この食感のとき、この食べ物が生まれる」。", "brief": "FoodTable の 1 行。", "values": [], "fields": [{"header": null, "type": "string", "name": "texture", "label": "Texture", "default": "", "tooltip": "食感の ID。デバイスが出す食感と同じ文字にする（大文字小文字は区別する）。空の行は使われない"}, {"header": null, "type": "GameObject", "name": "food", "label": "Food", "default": "", "tooltip": "この食感で生まれる食べ物の Prefab。Prefab のファイル名が、食べ物の ID（FoodId）になる"}], "menus": [], "members": [{"mods": [], "rtype": "", "name": "FoodRow", "params": "string texture, GameObject food", "kind": "ctor", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "データ", "remarks": "", "usedBy": ["FoodTable", "FoodTables", "VillageBaker"], "uses": []}, {"id": "t-FoodSpawner", "name": "FoodSpawner", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Food", "file": "Food/FoodSpawner.cs", "mod": "Food", "sec": "Runtime", "bases": ["MonoBehaviour", "IFoodSpawner"], "attrs": [], "serializable": false, "doc": "デバイスで決定した食感から、食べ物を引いて生み、前へ飛ばす。食感が決まったとき（Confirmed）に、Resolve で Prefab を引き、Spawn Point の位置に生む。", "brief": "デバイスで決定した食感から、食べ物を引いて生み、前へ飛ばす。", "values": [], "fields": [{"header": null, "type": "Transform", "name": "spawnPoint", "label": "Spawn Point", "default": "", "tooltip": "食べ物が生まれる位置と向き（口の位置。MouthAnchor を置いたら、ここに入れる）。空なら、このオブジェクトの位置と向き"}, {"header": null, "type": "Transform", "name": "foodParent", "label": "Food Parent", "default": "", "tooltip": "生んだ食べ物を、この子として置く（Hierarchy が散らからない・まとめて消せる）。位置と向きは Spawn Point のまま。空なら、シーンの直下"}, {"header": null, "type": "float", "name": "launchSpeed", "label": "Launch Speed", "default": "2f", "tooltip": "生んだ食べ物に、Spawn Point の前向きに与える初速（m/s）。0 以下、または食べ物に Rigidbody がなければ、与えない。そのあとの動きは、食べ物の Rigidbody（Mass など）しだい"}], "menus": [], "members": [{"mods": [], "rtype": "Func<FieldId>", "name": "CurrentField", "params": "", "kind": "property", "acc": "get; set;", "doc": "体験者の前のフィールドを返す関数。入れたときだけ、Field の代わりに使う。空のままなら、Core の Field（立っている場所。どこにも立っていなければ共通の表だけ）。", "brief": "体験者の前のフィールドを返す関数。"}, {"mods": [], "rtype": "Transform", "name": "FoodParent", "params": "", "kind": "property", "acc": "", "doc": "生んだ食べ物の置き場（親）。空ならシーンの直下。", "brief": "生んだ食べ物の置き場（親）。"}, {"mods": [], "rtype": "Action<Spawned>", "name": "Spawned", "params": "", "kind": "event", "acc": "", "doc": "食べ物を生んだ直後に、1 回出る。", "brief": "食べ物を生んだ直後に、1 回出る。"}, {"mods": [], "rtype": "GameObject", "name": "Preview", "params": "TextureId texture", "kind": "method", "acc": "", "doc": "食感から、生まれる食べ物の Prefab を引くだけ。生まない。チュートリアルで、噛んでいる間に、その食感で生まれる物の影を見せるときに使う。引けなければ null。", "brief": "食感から、生まれる食べ物の Prefab を引くだけ。"}, {"mods": [], "rtype": "GameObject", "name": "Spawn", "params": "TextureId texture", "kind": "method", "acc": "", "doc": "食感から食べ物を引いて、1 つ生む。生んだ食べ物を返す。食感が空（噛む前の決定）なら、何もせず null。引けなければ、警告を出して null。", "brief": "食感から食べ物を引いて、1 つ生む。"}], "nested_in": null, "role": "コンポーネント", "remarks": "- デバイスは Core の `WhenReady` で受け取る。Mock か実機かは知らない。\n- 飛ばす: `Launch Speed` が 0 より大きく、生んだ食べ物に Rigidbody があれば、`Spawn Point` の前向きに初速を与える。そのあとの動きは、食べ物の Rigidbody（Mass など）と物理しだい。\n  体験者は、顔を向けて狙いを定め、欲しがっている人のところへ飛ばす。どこに届いたかは、落ちた所の DeliveryZone（Village）が決める。\n- `Food Parent` を入れると、生んだ食べ物をその子にする（位置と向きは Spawn Point のまま）。\n- 生んだ食べ物には、どの食べ物かを渡す `IFoodItem`（`FoodItemTag`）を付ける。\n- 「体験者の前のフィールド」は、Core の `Field` を読む。`CurrentField` に関数を入れたときは、そちらを使う（テストや、別の決め方を試すとき）。\n- 有効になると、自分で Core の `FoodSpawners` に登録する。チュートリアルや影の UI は、そこから受け取る。\n- 間違えたとき（欲しい物と違う食べ物が届いたとき）の反応は、ここにはない。届いた知らせ（`Received`）を受ける側が足す。", "usedBy": ["TutorialTestSceneBuilder"], "uses": ["Devices", "FieldId", "FoodId", "FoodSpawners", "FoodTables", "IDevice", "IFoodSpawner", "Spawned", "Standing", "TextureId"]}, {"id": "t-FoodTable", "name": "FoodTable", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Food", "file": "Food/FoodTable.cs", "mod": "Food", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "「食感 → 食べ物の Prefab」の表。Field Id が空なら全フィールド共通の表、フィールドの ID（village / mountain / sea / grassland）なら、そのフィールドの専用の表。専用の表は、そのフィールドの Prefab に付ける。有効になると、自分で FoodTables に登録する。", "brief": "「食感 → 食べ物の Prefab」の表。", "values": [], "fields": [{"header": null, "type": "string", "name": "fieldId", "label": "Field Id", "default": "\"\"", "tooltip": "空なら全フィールド共通の表。専用の表は、フィールドの ID（village / mountain / sea / grassland）。そのフィールドの FieldStages の Field Id と同じ文字にする"}, {"header": null, "type": "FoodRow[]", "name": "rows", "label": "Rows", "default": "new FoodRow[0]", "tooltip": "食感の ID と、生まれる食べ物の Prefab。食感の段階の順に並べる。足す・消すだけで、食感の数を変えられる"}], "menus": [{"kind": "ContextMenu", "path": "対応一覧を出す"}], "members": [{"mods": [], "rtype": "FieldId", "name": "Field", "params": "", "kind": "property", "acc": "", "doc": "この表のフィールド。空なら共通の表。", "brief": "この表のフィールド。"}, {"mods": [], "rtype": "bool", "name": "IsDefault", "params": "", "kind": "property", "acc": "", "doc": "全フィールド共通の表か。", "brief": "全フィールド共通の表か。"}, {"mods": [], "rtype": "IReadOnlyList<FoodRow>", "name": "Rows", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "void", "name": "Configure", "params": "string fieldId, params FoodRow[] rows", "kind": "method", "acc": "", "doc": "コードから表を作る（テストや補助ツール用）。有効なら、登録し直す。", "brief": "コードから表を作る（テストや補助ツール用）。"}, {"mods": [], "rtype": "GameObject", "name": "Find", "params": "TextureId texture", "kind": "method", "acc": "", "doc": "この表だけを引く。行がない、食感が空、または Prefab が空なら null。同じ食感の行が重なっているときは、先の行を使う。", "brief": "この表だけを引く。"}], "nested_in": null, "role": "コンポーネント", "remarks": "- 共通の表は、なくてもよい。なければ、専用の表にない食感は何も生まれない。\n- 同じ食感の行が重なったら、先の行を使う。\n- 引くのは `Resolve`。この表だけを引くときは `Find`。", "usedBy": ["FoodTables", "TutorialTestSceneBuilder", "VillageBaker"], "uses": ["FieldId", "FoodRow", "FoodTables", "TextureId"]}, {"id": "t-FoodTables", "name": "FoodTables", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Food", "file": "Food/FoodTables.cs", "mod": "Food", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "いまシーンにある FoodTable の置き場。表は有効になると自分で Register する。食べ物は Resolve で引く（そのフィールドの表、なければ共通の表）。", "brief": "いまシーンにある FoodTable の置き場。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "bool", "name": "Register", "params": "FoodTable table", "kind": "method", "acc": "", "doc": "表を登録する。空 ID の表がすでにある、または同じフィールドの表がすでにあるなら、登録せずに警告を出して false。同じ表を 2 回登録しても 1 つ。", "brief": "表を登録する。"}, {"mods": ["static"], "rtype": "void", "name": "Unregister", "params": "FoodTable table", "kind": "method", "acc": "", "doc": "登録を外す。登録されていなければ何もしない。", "brief": "登録を外す。"}, {"mods": ["static"], "rtype": "GameObject", "name": "Resolve", "params": "FieldId field, TextureId texture", "kind": "method", "acc": "", "doc": "食感から、生まれる食べ物の Prefab を引く。そのフィールドの表 → 共通の表 → null の順。フィールドが空、または専用の表がないフィールドは、共通の表だけで引く。食感が空なら null。", "brief": "食感から、生まれる食べ物の Prefab を引く。"}, {"mods": ["static"], "rtype": "FoodId", "name": "IdOf", "params": "GameObject prefab", "kind": "method", "acc": "", "doc": "食べ物の ID。Prefab のファイル名。", "brief": "食べ物の ID。"}, {"mods": ["static"], "rtype": "IReadOnlyList<string>", "name": "Validate", "params": "", "kind": "method", "acc": "", "doc": "表の食い違いを集める。無ければ空。共通の表がないことは、食い違いに入れない。フィールドの欲しい物（FieldStep）との突き合わせは、Food が Village を参照できないため、ここではしない。", "brief": "表の食い違いを集める。"}, {"mods": ["static"], "rtype": "string", "name": "Describe", "params": "", "kind": "method", "acc": "", "doc": "登録されている表の一覧（フィールド × 食感）。専用の表にない食感は、共通の表の食べ物に「(共通)」を付けて出す。", "brief": "登録されている表の一覧（フィールド × 食感）。"}], "nested_in": null, "role": "static（置き場・計算）", "remarks": "- 共通の表（Field Id が空）は 1 つだけ。同じフィールドの表も 1 つだけ。重なったら、警告して登録しない。\n- 共通の表はなくてもよい（なければ、専用の表だけで引く）。\n- static なので、Play のたびに空にする。\n- すべてメインスレッドから呼ぶ。", "usedBy": ["FieldDiagnostics", "FoodSpawner", "FoodTable"], "uses": ["FieldId", "FoodId", "FoodRow", "FoodTable", "TextureId"]}, {"id": "t-Cloud", "name": "Cloud", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Fork", "file": "Fork/Cloud.cs", "mod": "Fork", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "フォークで刺せる雲。当たり判定（Collider）と一緒に、雲の見た目に付ける。刺されると、見た目と当たり判定を隠し、Respawn Seconds たったら戻る。", "brief": "フォークで刺せる雲。", "values": [], "fields": [{"header": null, "type": "float", "name": "respawnSeconds", "label": "Respawn Seconds", "default": "3f", "tooltip": "刺されてから、また刺せるようになるまでの秒数。仮の値"}], "menus": [], "members": [{"mods": [], "rtype": "bool", "name": "IsAvailable", "params": "", "kind": "property", "acc": "", "doc": "いま刺せる（隠れていない）。", "brief": "いま刺せる（隠れていない）。"}, {"mods": [], "rtype": "void", "name": "Take", "params": "", "kind": "method", "acc": "", "doc": "刺された。隠して、時間がたったら戻す。", "brief": "刺された。"}], "nested_in": null, "role": "コンポーネント", "remarks": "光らせる・近くへ寄せるなどの見せ方は、ここには書かない。合図（Cues）を受ける側が足す。\n当たり判定は、起動時にトリガーにする。体験者が口から飛ばした物が、手前の雲に当たって跳ね返らないようにするため。", "usedBy": ["CloudCues", "CloudPrefabGenerator", "CloudRing", "ForkTip"], "uses": []}, {"id": "t-CloudCues", "name": "CloudCues", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Fork", "file": "Fork/CloudCues.cs", "mod": "Fork", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "雲の合図（Cues）を受けて、雲に見せる。CloudRing と同じオブジェクトに付ける（その子の雲を使う）。", "brief": "雲の合図（Cues）を受けて、雲に見せる。", "values": [], "fields": [{"header": null, "type": "Transform", "name": "cloudRoot", "label": "Cloud Root", "default": "", "tooltip": "雲を探す親。空なら、このオブジェクト（CloudRing）の子から探す"}, {"header": "合図の名前", "type": "string", "name": "glowCue", "label": "Glow Cue", "default": "\"cloud.glow\"", "tooltip": "雲を 1 つ光らせる合図"}, {"header": "合図の名前", "type": "string", "name": "approachCue", "label": "Approach Cue", "default": "\"cloud.approach\"", "tooltip": "光る雲を体験者の近くへ寄せる合図"}, {"header": "合図の名前", "type": "string", "name": "calmCue", "label": "Calm Cue", "default": "\"cloud.calm\"", "tooltip": "光を消し、雲を戻す合図"}, {"header": "光らせ方", "type": "Color", "name": "glowColor", "label": "Glow Color", "default": "new Color(1f, 0.85f, 0.4f)", "tooltip": "光るときの色。元の色とこの色のあいだを行き来する"}, {"header": "光らせ方", "type": "float", "name": "pulseScale", "label": "Pulse Scale", "default": "0.15f", "tooltip": "大きさの脈の幅。0.15 なら、元の 1〜1.15 倍のあいだで脈打つ"}, {"header": "光らせ方", "type": "float", "name": "pulsePerSecond", "label": "Pulse Per Second", "default": "1.2f", "tooltip": "1 秒に脈打つ回数"}, {"header": "寄せ方", "type": "float", "name": "approachMeters", "label": "Approach Meters", "default": "0.2f", "tooltip": "頭のほうへ寄せる距離（m）"}, {"header": "寄せ方", "type": "float", "name": "minHeadDistance", "label": "Min Head Distance", "default": "0.25f", "tooltip": "寄せても、頭からこの距離（m）より近くにはしない"}, {"header": "寄せ方", "type": "float", "name": "approachSeconds", "label": "Approach Seconds", "default": "1.5f", "tooltip": "寄せきるまでの秒数"}, {"header": "寄せ方", "type": "float", "name": "returnSeconds", "label": "Return Seconds", "default": "1f", "tooltip": "元の位置へ戻りきるまでの秒数"}], "menus": [], "members": [], "nested_in": null, "role": "コンポーネント", "remarks": "- `cloud.glow`: 体験者の正面にいちばん近い雲を 1 つ選び、色と大きさを脈打たせて光らせる。\n- `cloud.approach`: 光らせた雲を、体験者の頭のほうへ寄せる。光らせた雲がなければ、先に 1 つ選ぶ。\n- `cloud.calm`: 光を消し、寄せた雲を元の位置へ戻す。\n- 光らせた雲が刺されて隠れたら、光と寄せをやめる（戻ってきたときは、ふつうの雲）。\n- 雲の位置は CloudRing が毎フレーム決める。寄せる分は、そのあと（LateUpdate）で足す。", "usedBy": ["TutorialTestSceneBuilder"], "uses": ["Cloud", "CueRequested", "Cues"]}, {"id": "t-CloudRing", "name": "CloudRing", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Fork", "file": "Fork/CloudRing.cs", "mod": "Fork", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "体験者の前に、雲（Cloud）を半円状に浮かべる。体験者が歩くと、ついて来る。シーンのどこか 1 か所に置く。雲の Prefab は Resources/Prefabs/Fork/Cloud（メニュー「MouthOfGod/Fork/Generate Cloud Prefab」で作る）。", "brief": "体験者の前に、雲（Cloud）を半円状に浮かべる。", "values": [], "fields": [{"header": null, "type": "Cloud", "name": "cloudPrefab", "label": "Cloud Prefab", "default": "", "tooltip": "雲の Prefab。空なら Resources/Prefabs/Fork/Cloud を使う"}, {"header": null, "type": "int", "name": "count", "label": "Count", "default": "5", "tooltip": "浮かべる雲の数。仮の値"}, {"header": null, "type": "float", "name": "radius", "label": "Radius", "default": "0.45f", "tooltip": "頭から雲までの水平の距離（m）。腕を伸ばして届く所。仮の値"}, {"header": null, "type": "float", "name": "height", "label": "Height", "default": "-0.3f", "tooltip": "頭から見た雲の高さ（m）。マイナスで頭より下。仮の値"}, {"header": null, "type": "float", "name": "spreadDegrees", "label": "Spread Degrees", "default": "120f", "tooltip": "雲を並べる角度の幅（度）。正面を中心に、この幅に並べる。360 で体験者を囲む"}, {"header": null, "type": "float", "name": "bobAmplitude", "label": "Bob Amplitude", "default": "0.02f", "tooltip": "上下にゆれる幅（m）"}, {"header": null, "type": "float", "name": "followSpeed", "label": "Follow Speed", "default": "2f", "tooltip": "体験者について来る速さ。大きいほど早く追いつく"}], "menus": [], "members": [], "nested_in": null, "role": "コンポーネント", "remarks": "- どこに、いくつ浮かべるかは、まだ決まっていない（シナリオブックの未決事項）。数・半径・高さは仮の値で、Inspector で変えられる。\n- 体験者の位置は Main Camera。向きは、置いたときの頭の向きで決め、そのあとは回らない（首を振るたびに雲が動かないように）。", "usedBy": ["TutorialTestSceneBuilder"], "uses": ["Cloud"]}, {"id": "t-CloudPrefabGenerator", "name": "CloudPrefabGenerator", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Fork.Editor", "file": "Fork/Editor/CloudPrefabGenerator.cs", "mod": "Fork", "sec": "Editor", "bases": [], "attrs": [], "serializable": false, "doc": "雲の Prefab を、白い球を重ねて Assets/Resources/Prefabs/Fork/Cloud.prefab に作る。1 回実行して、できた Prefab をコミットする（Play 時には使わない）。既にある Prefab は上書きしない。素材の雲が無いので仮の見た目にしている。素材ができたら、この Prefab の見た目だけを差し替える（Cloud と当たり判定は残す）。", "brief": "雲の Prefab od": "Game", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "本編の制限時間の時計。Unity に依存しない（Tick に経過秒を渡して進める）。", "brief": "本編の制限時間の時計。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["const"], "rtype": "float", "name": "CountdownSeconds", "params": "", "kind": "field", "acc": "", "doc": "カウントダウンを始める残り秒。", "brief": "カウントダウンを始める残り秒。"}, {"mods": [], "rtype": "", "name": "GameClock", "params": "float totalSeconds", "kind": "ctor", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "float", "name": "TotalSeconds", "params": "", "kind": "property", "acc": "get;", "doc": "", "brief": ""}, {"mods": [], "rtype": "float", "name": "Remaining", "params": "", "kind": "property", "acc": "", "doc": "残り秒（0 以上）。", "brief": "残り秒（0 以上）。"}, {"mods": [], "rtype": "int", "name": "RemainingWholeSeconds", "params": "", "kind": "property", "acc": "", "doc": "切り上げた残り秒。UI に出す数。", "brief": "切り上げた残り秒。"}, {"mods": [], "rtype": "bool", "name": "IsCountdown", "params": "", "kind": "property", "acc": "", "doc": "残り CountdownSeconds 秒以下（時間切れも含む）。", "brief": "残り CountdownSeconds 秒以下（時間切れも含む）。"}, {"mods": [], "rtype": "bool", "name": "IsTimeUp", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "Action<int>", "name": "RemainingChanged", "params": "", "kind": "event", "acc": "", "doc": "切り上げた残り秒が変わった（新しい残り秒を運ぶ）。", "brief": "切り上げた残り秒が変わった（新しい残り秒を運ぶ）。"}, {"mods": [], "rtype": "Action", "name": "CountdownStarted", "params": "", "kind": "event", "acc": "", "doc": "残りが CountdownSeconds 秒以下になった（1 回だけ）。", "brief": "残りが CountdownSeconds 秒以下になった（1 回だけ）。"}, {"mods": [], "rtype": "Action", "name": "TimeUp", "params": "", "kind": "event", "acc": "", "doc": "時間切れになった（1 回だけ）。", "brief": "時間切れになった（1 回だけ）。"}, {"mods": [], "rtype": "void", "name": "Tick", "params": "float deltaSeconds", "kind": "method", "acc": "", "doc": "経過秒だけ進める。0 以下の値と、時間切れのあとの呼び出しは何もしない。", "brief": "経過秒だけ進める。"}], "nested_in": null, "role": "クラス", "remarks": "- 残り秒、残り `CountdownSeconds` 秒以下か、時間切れか、を持つ。\n- `CountdownStarted` と `TimeUp` は、それぞれ 1 回だけ出る。時間切れのあとに Tick しても、何も出ない。\n- `RemainingChanged` は、切り上げた残り秒（120.0〜119.01 秒なら 120）が変わったときに出る。\n- 一度に大きく進めても、カウントダウン開始 → 残り秒 → 時間切れの順に、出すべきものは出る。", "usedBy": ["GameRunner"], "uses": []}, {"id": "t-GameRunner", "name": "GameRunner", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Game", "file": "Game/GameRunner.cs", "mod": "Game", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "本編の進行役。チュートリアルが終わったら本編（場面 main-game）を始め、制限時間が来たら終わらせる（場面 game-over）。時間の計算は GameClock。ここは Unity とつなぐだけ。", "brief": "本編の進行役。", "values": [], "fields": [{"header": null, "type": "float", "name": "timeLimitSeconds", "label": "Time Limit Seconds", "default": "120f", "tooltip": "本編の制限時間（秒）。120 は仮の値"}, {"header": null, "type": "string", "name": "afterPhase", "label": "After Phase", "default": "\"deliver\"", "tooltip": "この場面が終わって場面が空になったら、本編を始める（最後のチュートリアルの場面名。空にすると自動では始めない）"}], "menus": [], "members": [{"mods": [], "rtype": "Action<int>", "name": "RemainingChanged", "params": "", "kind": "event", "acc": "", "doc": "残り秒（切り上げ）が変わった。本編の開始時にも最初の値を出す。", "brief": "残り秒（切り上げ）が変わった。"}, {"mods": [], "rtype": "Action", "name": "CountdownStarted", "params": "", "kind": "event", "acc": "", "doc": "残り 10 秒以下になった（カウントダウン開始。1 回）。", "brief": "残り 10 秒以下になった（カウントダウン開始。"}, {"mods": [], "rtype": "Action", "name": "TimeUp", "params": "", "kind": "event", "acc": "", "doc": "時間切れ（1 回）。場面を game-over にしてから出す。", "brief": "時間切れ（1 回）。"}, {"mods": [], "rtype": "bool", "name": "IsRunning", "params": "", "kind": "property", "acc": "", "doc": "本編が動いている。", "brief": "本編が動いている。"}, {"mods": [], "rtype": "float", "name": "Remaining", "params": "", "kind": "property", "acc": "", "doc": "残り秒。本編が始まる前は制限時間。", "brief": "残り秒。"}, {"mods": [], "rtype": "void", "name": "Begin", "params": "", "kind": "method", "acc": "", "doc": "本編を始める（場面を main-game にして、時計を動かす）。動いている間に呼ぶと、はじめからやり直す。", "brief": "本編を始める（場面を main-game に , "name": "AprilTagDetectionService", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Tracking", "file": "Tracking/AprilTagDetectionService.cs", "mod": "Tracking", "sec": "Runtime", "bases": ["MonoBehaviour", "IAprilTagSource"], "attrs": ["[RequireComponent(typeof(PassthroughCameraAccess))]", "[DefaultExecutionOrder(-50)]"], "serializable": false, "doc": "パススルーカメラの RGB フレームから AprilTag を検出し、ワールド座標の姿勢を IAprilTagSource として公開する。シーンに 1 つだけ存在する（AprilTagPlace が必要なときに自動で作るので、手で置かなくてよい）。カメラの読み出しと検出は重いため、タグごとではなくここで 1 回だけ行い、各 AprilTagPlace が結果を共有する。設定は AprilTagSettings（Resources/AprilTagSettings.asset）から読む。", "brief": "パススルーカメラの RGB フレームから AprilTag を検出し、ワールド座標の姿勢を IAprilTagSource として公開する。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "AprilTagDetectionService", "name": "GetOrCreate", "params": "", "kind": "method", "acc": "", "doc": "シーンにあればそれを、なければ作って返す。AprilTagPlace が使うので、手で置く必要はない。", "brief": "シーンにあればそれを、なければ作って返す。"}, {"mods": [], "rtype": "Action<IReadOnlyList<AprilTagObservation>>", "name": "ObservationsUpdated", "params": "", "kind": "event", "acc": "", "doc": "検出のたびに呼ばれる。引数のリストは次回の検出で再利用されるため、保持しないこと。検出したタグが 0 枚のときは呼ばれない。（IAprilTagSource の説明）", "brief": "検出のたびに呼ばれる。"}, {"mods": [], "rtype": "bool", "name": "TryGetLatest", "params": "int tagId, out AprilTagObservation observation", "kind": "method", "acc": "", "doc": "指定 ID の、最後に検出した結果を返す。まだ検出していなければ false。（IAprilTagSource の説明）", "brief": "指定 ID の、最後に検出した結果を返す。"}], "nested_in": null, "role": "コンポーネント", "remarks": "", "usedBy": ["AprilTagPlace"], "uses": ["AprilTagGeometry", "AprilTagObservation", "AprilTagRecalibrateInput", "AprilTagSettings", "IAprilTagSource"]}, {"id": "t-AprilTagGeometry", "name": "AprilTagGeometry", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Tracking", "file": "Tracking/AprilTagGeometry.cs", "mod": "Tracking", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "カメラの内部パラメータの換算と、座標変換。Unity のオブジェクトに依存しない純粋な計算。", "brief": "カメラの内部パラメータの換算と、座標変換。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "ImageIntrinsics", "name": "ToImageIntrinsics", "params": " Vector2 sensorFocalLength, Vector2 sensorPrincipalPoint, Vector2Int sensorResolution, Vector2Int imageResolution", "kind": "method", "acc": "", "doc": "センサー基準の内部パラメータを、現在の画像解像度の基準に換算する。画像は、センサーを中央でクロップして縮小したもの（Meta の PassthroughCameraAccess と同じ扱い）。", "brief": "センサー基準の内部パラメータを、現在の画像解像度の基準に換算する。"}, {"mods": ["static"], "rtype": "float", "name": "VerticalFovRadians", "params": "float focalLengthY, int imageHeight", "kind": "method", "acc": "", "doc": "AprilTag ライブラリに渡す、垂直方向の画角（ラジアン）。ライブラリは画素が正方形で主点が画像中央にあると仮定する。", "brief": "AprilTag ライブラリに渡す、垂直方向の画角（ラジアン）。"}, {"mods": ["static"], "rtype": "Pose", "name": "CameraLocalToWorld", "params": "Pose cameraWorldPose, Vector3 localPosition, Quaternion localRotation", "kind": "method", "acc": "", "doc": "カメラのローカル座標で得たタグの姿勢を、ワールド座標に直す。", "brief": "カメラのローカル座標で得たタグの姿勢を、ワールド座標に直す。"}, {"mods": ["static"], "rtype": "Quaternion", "name": "AlignNormalToVertical", "params": "Quaternion rotation, Vector3 localNormalAxis", "kind": "method", "acc": "", "doc": "タグの法線（タグ座標の localNormalAxis 軸）が鉛直になるように、傾きだけを取り除く。法線まわりの回転（水平なタグなら向き）は変えない。法線が上向きなら上、下向きなら下に揃える。水平な面に置いたタグ向け。壁など、法線が水平なタグには使わない。", "brief": "タグの法線（タグ座標の localNormalAxis 軸）が鉛直になるように、傾きだけを取り除く。"}, {"mods": ["static"], "rtype": "Pose", "name": "ApplyOffsets", "params": "Pose tag, Vector3 localPosition, Vector3 localEuler, Vector3 worldEuler", "kind": "method", "acc": "", "doc": "タグの姿勢に、オフセットを足した、対象の姿勢を求める。基準の向きは「ワールド軸の回転 × タグの回転」。ワールドの回転を 0 にすれば、タグの向きそのまま。位置のオフセットとローカルのオイラー角は、この基準の座標系で足す。そのため、ワールドの回転は、タグの位置を軸に全体を回す。", "brief": "タグの姿勢に、オフセットを足した、対象の姿勢を求める。"}, {"mods": ["static"], "rtype": "Pose", "name": "AlignRigToTarget", "params": "Pose rig, Pose observed, Pose desired, bool alignYaw", "kind": "method", "acc": "", "doc": "観測したタグの姿勢を、シーンの基準の姿勢に重ねるために、リグ（ユーザー側）を動かした後の姿勢を求める。動かすのは、位置と、鉛直軸まわりの向き（alignYaw のとき）だけ。傾きは変えない（VR の水平線 : "雲を 1 つ光らせる合図。空なら出さない"}, {"header": "1. 雲を刺す", "type": "string", "name": "pierceLine", "label": "Pierce Line", "default": "\"t1-pierce\"", "tooltip": "刺すように言うセリフの id。Take the fork in your hand. Pierce that glowing cloud."}, {"header": "1. 雲を刺す", "type": "float", "name": "pierceHintSeconds", "label": "Pierce Hint Seconds", "default": "10f", "tooltip": "この秒数たっても刺せなければ、ヒントの合図を出す。0 ならヒントなし"}, {"header": "1. 雲を刺す", "type": "string", "name": "pierceHintCue", "label": "Pierce Hint Cue", "default": "\"cloud.approach\"", "tooltip": "刺せないときのヒントの合図（光る雲を近くへ寄せる）。空なら出さない"}, {"header": "1. 雲を刺す", "type": "float", "name": "pierceGiveUpSeconds", "label": "Pierce Give Up Seconds", "default": "45f", "tooltip": "この秒数たっても刺せなければ、次へ進む。0 なら待ち続ける"}, {"header": "2. 口に含む", "type": "string", "name": "mouthLine", "label": "Mouth Line", "default": "\"t1-mouth\"", "tooltip": "口に含むように言うセリフの id。Now bring it to your mouth."}, {"header": "2. 口に含む", "type": "float", "name": "mouthHintSeconds", "label": "Mouth Hint Seconds", "default": "10f", "tooltip": "この秒数たっても含まなければ、もう一度言う。0 ならくり返さない"}, {"header": "2. 口に含む", "type": "string", "name": "mouthHintLine", "label": "Mouth Hint Line", "default": "\"t1-mouth-again\"", "tooltip": "くり返すセリフの id。Bring it to your mouth."}, {"header": "2. 口に含む", "type": "float", "name": "mouthAlertSeconds", "label": "Mouth Alert Seconds", "default": "20f", "tooltip": "この秒数たっても含まなければ、スタッフに知らせる合図を出す（待ち始めからの秒数）。0 なら出さない"}, {"header": "2. 口に含む", "type": "string", "name": "mouthAlertCue", "label": "Mouth Alert Cue", "default": "\"staff.alert\"", "tooltip": "スタッフに知らせる合図。空なら出さない"}, {"header": "2. 口に含む", "type": "float", "name": "mouthGiveUpSeconds", "label": "Mouth Give Up Seconds", "default": "45f", "tooltip": "この秒数たっても含まなければ、次へ進む。0 なら待ち続ける"}, {"header": "3. 食感が切り替わる", "type": "string", "name": "changingLine", "label": "Changing Line", "default": "\"t1-changing\"", "tooltip": "含んだままでいるように言うセリフの id。Keep it in your mouth. Feel it? The texture keeps changing."}, {"header": "3. 食感が切り替わる", "type": "int", "name": "textureChanges", "label": "Texture Changes", "default": "3", "tooltip": "食感が何回切り替わったら進むか"}, {"header": "3. 食感が切り替わる", "type": "float", "name": "changingGiveUpSeconds", "label": "Changing Give Up Seconds", "default": "30f", "tooltip": "この秒数たっても切り替わりきらなければ、次へ進む。0 なら待ち続ける"}, {"header": "4. ボタンで決定する", "type": "string", "name": "buttonGlowCue", "label": "Button Glow Cue", "default": "\"device.button.glow\"", "tooltip": "ボタンの位置を光らせる合図。空なら出さない"}, {"header": "4. ボタンで決定する", "type": "string", "name": "buttonLine", "label": "Button Line", "default": "\"t1-button\"", "tooltip": "ボタンを押すように言うセリフの id。When it feels right, press the button."}, {"header": "4. ボタンで決定する", "type": "float", "name": "buttonHintSeconds", "label": "Button Hint Seconds", "default": "10f", "tooltip": "この秒数たっても押さなければ、ヒントの合図を出す。0 ならヒントなし"}, {"header": "4. ボタンで決定する", "type": "string", "name": "buttonHintCue", "label": "Button Hint Cue", "default": "\"device.button.glow-strong\"", "tooltip": "押さないときのヒントの合図（ボタンを強く光らせる）。空なら出さない"}, {"header": "4. ボタンで決定する", "type": "float", "name": "buttonGiveUpSeconds", "label": "Button Give Up Seconds", "default": "45f", "tooltip": "この秒数たっても押さなければ、次へ進む。0 なら待ち続ける"}, {"header": "5. 終わり", "type": "string", "name": "calmCue", "label": "Calm Cue", "default": "\"cloud.calm\"", "tooltip": "雲の光を消し、寄せた雲を戻す合図。空なら出さない"}, {"header": "5. 終わり", "type": "string", "name": "buttonOffCue", "label": "Button Off Cue", "default": "\"device.button.glow-off\"", "tooltip": "ボタンの光を消す合図。空なら出さない"}, {"header": "5. 終わり", "type": "string", "name": "goodLine", "label": "Good Line", "default": "\"t1-good\"", "tooltip": "ほめるセリフの id。Good."}, {"header": "5. 終わり", "type": "float", "name": "endHoldSeconds", "label": "End Hold Seconds", "default": "2f", "tooltip": "ほめたあと、次のチュートリアルへ進むまでの秒数（セリフを聞き終わるまで）"}, {"header": "間", "type": "float", "name": "beatPauseSeconds", "label": "Beat Pause Seconds", "default": "0.5f", "tooltip": "段と段のあいだの秒数。できた直後に次のセリフを重ねないため"}], "menus": [], "members": [{"mods": ["override"], "rtype": "PhaseId", "name": "Phase", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": ["override"], "rtype": "IEnumerator", "name": "Play", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "コンポーネント", "remarks": "流れ:\n0. （Stand Field が空でなければ）足あとの印を出し、その場所に立つのを待つ。時間がたったら、立たなくても進む（ブースではキーを打てないため）。\n1. 雲を光らせ、刺すのを待つ。Hint 秒たっても刺せなければ、光る雲を近くへ寄せる。\n2. 口に含むのを待つ。Hint 秒たったら、巫女がくり返す。Alert 秒たったら、スタッフに知らせる印を出す。\n3. 食感が Texture Changes 回切り替わるのを待つ。\n4. ボタンを光らせ、決定するのを待つ。Hint 秒たったら、ボタンを強く光らせる。\n5. 雲とボタンの光を消し、\"Good.\" と言う。どの段もあきらめずに終わったときだけ、`fork-learned` を覚える。\nどの待ちにも Give Up 秒（0 なら待ち続ける）があり、過ぎたら次の段へ進む。体験が止まらないようにするため。\n\n出す合図（名前は Inspector で変えられる。空にすると出さない）:\n- `<Stand Field>.footprint`: 立つ場所の足あとの印を出す\n- `cloud.glow`: 雲を 1 つ光らせる（CloudCues が受ける）\n- `cloud.approach`: 光る雲を体験者の近くへ寄せる（CloudCues が受ける）\n- `cloud.calm`: 雲の光を消し、寄せた雲を戻す（CloudCues が受ける）\n- `staff.alert`: スタッフに、体験者が困っていると知らせる\n- `device.button.glow` / `device.button.glow-strong` / `device.button.glow-off`: ボタンの位置を光らせる・強く光らせる・消す\n- `miko.say.<id>`: 巫女のセリフ（下の表。文はシーンの LineBook に書く）\n\nセリフ（id: 英語。日本語は参考訳）:\n- `t1-pierce`: \"Take the fork in your hand. Pierce that glowing cloud.\"（手のフォークで、あの光る雲を刺してみよ。）\n- `t1-mouth`: \"Now bring it to your mouth.\"（では、それを口に含むのじゃ。）\n- `t1-mouth-again`: \"Bring it to your mouth.\"（口に含むのじゃ。）\n- `t1-changing`: \"Keep it in your mouth. Feel it? The texture keeps changing.\"（含んだままでおれ。味わいが移ろうであろう？）\n- `t1-button`: \"When it feels right, press the button.\"（これだと思うたら、ボタンを押すのじゃ。）\n- `t1-good`: \"Good.\"（うむ、よいぞ。）", "usedBy": ["TutorialPrefabGenerator"], "uses": ["PhaseId", "StandWait", "TutorialEvent", "TutorialScript", "TutorialWait"]}, {"id": "t-T2Spawn", "name": "T2Spawn", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Tutorial", "file": "Tutorial/T2Spawn.cs", "mod": "Tutorial", "sec": "Runtime", "bases": ["TutorialScript"], "attrs": [], "serializable": false, "doc": "チュートリアル 2「物が生まれる」（シナリオブック S4。場面 spawn）。口に含んだ食感で、口から物が生まれることを見せる。【参考】この流れは、担当者が作り直すときの参考です（#317・#318 で、かぶって試しながら調整する）。霞の中の影（shadow.* の合図と FoodShadow）は、試しに入れたものです。影は実装しないことになったので（#277）、使わなくてかまいません。使わないときは、Inspector で shadow の合図の名前を空にします。", "brief": "チュートリアル 2「物が生まれる」（シナリオブック S4。", "values": [], "fields": [{"header": "食べ物", "type": "string", "name": "targetFood", "label": "Target Food", "default": "\"apple\"", "tooltip": "生んでほしい食べ物の ID。これが生まれたら成功"}, {"header": "食べ物", "type": "int", "name": "missesBeforeEmphasize", "label": "Misses Before Emphasize", "default": "3", "tooltip": "目当て以外を何回生んだら、影を強く見せるか（0 なら強くしない）"}, {"header": "お供え物", "type": "GameObject", "name": "offering", "label": "Offering", "default": "", "tooltip": "目の前に浮かべるお供え物のリンゴ。入れれば、始めに表示し、終わりに隠す。空なら合図だけ出す"}, {"header": "時間（秒）", "type": "float", "name": "pierceHintSeconds", "label": "Pierce Hint Seconds", "default": "10f", "tooltip": "雲を刺さないとき、刺すヒントをくり返す間隔（0 ならくり返さない）"}, {"header": "時間（秒）", "type": "float", "name": "mouthHintSeconds", "label": "Mouth Hint Seconds", "default": "10f", "tooltip": "口に含まないとき、含むヒントをくり返す間隔（0 ならくり返さない）"}, {"header": "時間（秒）", "type": "float", "name": "spawnHintSeconds", "label": "Spawn Hint Seconds", "default": "20f", "tooltip": "何も生まれないとき、「リンゴの影を待て」をくり返す間隔（0 ならくり返さない）"}, {"header": "時間（秒）", "type": "float", "name": "giveUpSeconds", "label": "Give Up Seconds", "default": "90f", "tooltip": "始めてからこの秒数がたったら、生まれていなくても先へ進む（ブースで止まらないように）。0 なら、いつまでも待つ"}, {"header": "時間（秒）", "type": "float", "name": "bornDelaySeconds", "label": "Born Delay Seconds", "default": "0.5f", "tooltip": "目当ての物が生まれてから、「見よ」と言うまでの間（物が落ちるのを見せる）"}, {"header": "時間（秒）", "type": "float", "name": "endPauseSeconds", "label": "End Pause Seconds", "default": "4f", "tooltip": "最後のセリフのあと、次のチュートリアルへ進むまでの間（セリフを聞き終える時間）"}, {"header": "セリフの id（Miko の LineBook の Id。空なら言わない）", "type": "string", "name": "rememberLine", "label": "Remember Line", "default": "\"t2-remember\"", "tooltip": "最初の語り。「供えたリンゴを覚えておるか。雲を刺して、口に含んでみよ」"}, {"header": "セリフの id（Miko の LineBook の Id。空なら言わない）", "type": "string", "name": "rememberShortLine", "label": "Remember Short Line", "default": "\"t2-remember-short\"", "tooltip": "チュートリアル 1 を済ませた（fork-learned）ときの、短い最初の語り。空なら Remember Line を使う"}, {"header": "セリフの id（Miko の LineBook の Id。空なら言わない）", "type": "string", "name": "pierceHintLine", "label": "Pierce Hint Line", "default": "\"t2-hint-pierce\"", "tooltip": "雲を刺さないときのヒント。「フォークで雲を刺すのじゃ」"}, {"header": "セリフの id（Miko の LineBook の Id。空なら言わない）", "type": "string", "name": "mouthHintLine", "label": "Mouth Hint Line", "default": "\"t2-hint-mouth\"", "tooltip": "口に含まないときのヒント。「口に含むのじゃ」"}, {"header": "セリフの id（Miko の LineBook の Id。空なら言わない）", "type": "string", "name": "waitAppleLine", "label": "Wait Apple Line", "default": "\"t2-wait-apple\"", "tooltip": "口に含んだあと。「歯ざわりが変われば、生まれる物も変わる。リンゴの影が見えたら、そこじゃ」"}, {"header": "セリフの id（Miko の LineBook の Id。空なら言わない）", "type": "string", "name": "wrongLine", "label": "Wrong Line", "default": "\"t2-wrong\"", "tooltip": "ほかの物が生まれたとき。「それも恵みじゃ。だが今はリンゴを」"}, {"header": "セリフの id（Miko の LineBook の Id。空なら言わない）", "type": "string", "name": "bornLine", "label": "Born Line", "default": "\"t2-born\"", "tooltip": "目当ての物が生まれたとき。「見よ、そなたの口から恵みが生まれたぞ！」"}, {"header": "セリフの id（Miko の LineBook の Id。空なら言わない）", "type": "string", "name": "giveUpLine", "label": "Give Up Line", "default": "\"\"", "tooltip": "あきらめて先へ進むときのセリフ（空なら言わない）"}, {"header": "合図の名前（空なら出さない）", "type": "string", "name": "offeringShowCue", "label": "Offering Show Cue", "default": "\"offering.show\"", "tooltip": "お供え物のリンゴを見せる"}, {"header": "合図の名前（空なら出さない）", "type": "string", "name": "offeringHideCue", "label": "Offering Hide Cue", "default": "\"offering.hide\"", "tooltip": "お供え物のリンゴを消す"}, {"header": "合図の名前（空なら出さない）", "type": "string", "name": "cloudGlowCue", "label": "Cloud Glow Cue", "default": "\"cloud.glow\"", "tooltip": "雲を光らせる"}, {"header": "合図の名前（空なら出さない）", "type": "string", "name": "shadowShowCue", "label": "Shadow Show Cue", "default": "\"shadow.show\"", "tooltip": "影を出し始める（UI の FoodShadow が受ける）"}, {"header": "合図の名前（空なら出さない）", "type": "string", "name": "shadowEmphasizeCue", "label": "Shadow Emphasize Cue", "default": "\"shadow.emphasize\"", "tooltip": "外し続けたとき、影を強く見せる"}, {"header": "合図の名前（空なら出さない）", "type": "string", "name": "shadowHideCue", "label": "Shadow Hide Cue", "default": "\"shadow.hide\"", "tooltip": "影を消す"}], "menus": [], "members": [{"mods": ["override"], "rtype": "PhaseId", "name": "Phase", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": ["override"], "rtype": "IEnumerator", "name": "Play", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}, {"mods": ["protected", "override"], "rtype": "void", "name": "OnAborted", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "コンポーネント", "remarks": "流れ:\n1. お供え物のリンゴを目の前に浮かべ、雲を光らせ、影を出し始める。雲を刺して、口に含むのを待つ（待ちきれないと、ヒントをくり返す）。\n2. 「リンゴの影を待て」と言い、何かが生まれるのを待つ。目当ての食べ物（既定 `apple`）なら次へ。\n   ほかの物なら「それも恵みじゃ。だが今はリンゴを」と言って、もう一度待つ。決めた回数外したら、影を強く見せる。\n3. お供え物と影を消し、「見よ、恵みが生まれたぞ」と言う。`food-born` と `texture-shadow-seen` を覚える。\n\n出す合図（Inspector で名前を変えられる。空にすると出さない）:\n- `offering.show` / `offering.hide`: お供え物のリンゴを見せる・消す。`Offering` に物を入れれば、このスクリプトも直接出し入れする。\n- `cloud.glow`: 雲を光らせる。\n- `shadow.show` / `shadow.emphasize` / `shadow.hide`: 影を出す・強く見せる・消す（UI の FoodShadow が受ける）。\n- `miko.say.<id>`: 巫女のセリフ（`Say`）。\n\nセリフ（英文はシーンの Miko の LineBook に書く。ここは既定の id と、そこに入れる文）:\n- `t2-remember`: \"Remember the apple the villagers offered? Pierce a cloud and put it in your mouth.\"\n- `t2-remember-short`: \"Remember the apple the villagers offered? Try it again.\" （`fork-learned` を覚えているときに使う）\n- `t2-hint-pierce`: \"Pierce a cloud with your fork.\"\n- `t2-hint-mouth`: \"Bring it to your mouth.\"\n- `t2-wait-apple`: \"As the feel changes, so does the blessing. Wait for the apple.\"\n- `t2-wrong`: \"That too is a blessing — but now, the apple.\"\n- `t2-born`: \"Look! A blessing is born from your mouth! Remember that feel.\"\n\nブースで止まらないように、あきらめる時間（`Give Up Seconds`）を過ぎたら、生まれていなくても先へ進む。\nそのときは `t2-born` を言わず、見たことだけを覚える（何か生まれていれば `food-born`、口に含んでいれば `texture-shadow-seen`）。", "usedBy": ["TutorialPrefabGenerator"], "uses": ["FoodId", "ForkWait", "PhaseId", "SpawnWait", "TutorialScript"]}, {"id": "t-T3Recognize", "name": "T3Recognize", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Tutorial", "file": "Tutorial/T3Recognize.cs", "mod": "Tutorial", "sec": "Runtime", "bases": ["TutorialScript"], "attrs": [], "serializable": false, "doc": "チュートリアル 3「食感で変わる・欲しい物」（シナリオブック S5。場面 recognize）。海の村人が魚を欲しがる吹き出しを見せ、体験者に、魚の食感を思い出して魚を生ませる。【参考】この流れは、担当者が作り直すときの参考です（#317・#318 で、かぶって試しながら調整する）。霞の中の影（shadow.* の合図と FoodShadow）は、試しに入れたものです。影は実装しないことになったので（#277）、使わなくてかまいません。使わないときは、Inspector で shadow の合図の名前を空にします。", "brief": "チュートリアル 3「食感で変わる・欲しい物」（シナリオブック S5。", "values": [], "fields": [{"header": "欲しい物", "type": "string", "name": "requestField", "label": "Request Field", "default": "\"sea\"", "tooltip": "欲しい物を出すフィールドの ID（village / mountain / sea / grassland）。光らせる合図は「<この ID>.glow」になる"}, {"header": "欲しい物", "type": "string", "name": "requestFood", "label": "Request Food", "default": "\"fish\"", "tooltip": "欲しがる食べ物の ID。これが生まれたら先へ進む"}, {"header": "合図（空にすると出さない）", "type": "string", "name": "fieldGlowSuffix", "label": "Field Glow Suffix", "default": "\"glow\"", "tooltip": "フィールドを光らせる合図の、フィールド ID の後ろの部分。「glow」なら「sea.glow」を出す。空にすると出さない"}, {"header": "合図（空にすると出さない）", "type": "string", "name": "shadowFaintCue", "label": "Shadow Faint Cue", "default": "\"shadow.faint\"", "tooltip": "影を薄く出す合図。T2 で影を見た（texture-shadow-seen）ときに出す"}, {"header": "合図（空にすると出さない）", "type": "string", "name": "shadowShowCue", "label": "Shadow Show Cue", "default": "\"shadow.show\"", "tooltip": "影をふつうに出す合図。T2 で影を見ていないときに出す"}, {"header": "合図（空にすると出さない）", "type": "string", "name": "shadowEmphasizeCue", "label": "Shadow Emphasize Cue", "default": "\"shadow.emphasize\"", "tooltip": "何回か外したときに、影をはっきり出す合図"}, {"header": "合図（空にすると出さない）", "type": "string", "name": "shadowHideCue", "label": "Shadow Hide Cue", "default": "\"shadow.hide\"", "tooltip": "影を消す合図。魚が生まれたら出す"}, {"header": "合図（空にすると出さない）", "type": "string", "name": "cloudGlowCue", "label": "Cloud Glow Cue", "default": "\"cloud.glow\"", "tooltip": "刺す雲を光らせる合図"}, {"header": "巫女のセリフ（LineBook の id。空にすると言わない）", "type": "string", "name": "troubledLine", "label": "Troubled Line", "default": "\"t3-troubled\"", "tooltip": "Oh, the people by the sea are troubled. They want fish.（おや、海の者が困っておる。魚が欲しいようじゃ。）"}, {"header": "巫女のセリフ（LineBook の id。空にすると言わない）", "type": "string", "name": "whichFeelLine", "label": "Which Feel Line", "default": "\"t3-which-feel\"", "tooltip": "Pierce a new cloud. Which feel was the fish?（新しい雲を刺してみよ。魚は、どの歯ざわりであったかの？）"}, {"header": "巫女のセリフ（LineBook の id。空にすると言わない）", "type": "string", "name": "wrongLine", "label": "Wrong Line", "default": "\"t3-wrong\"", "tooltip": "違う物が生まれたときのセリフ（仮: Not that one. Which feel was the fish?）"}, {"header": "巫女のセリフ（LineBook の id。空にすると言わない）", "type": "string", "name": "fishHereLine", "label": "Fish Here Line", "default": "\"t3-fish-here\"", "tooltip": "That's the fish — but blessings fall where you stand. Fish belong in the sea.（うむ、魚じゃ。だが恵みは、そなたの立つ場所に落ちる。魚は海のものじゃ。）"}, {"header": "間と時間切れ", "type": "float", "name": "pauseAfterTroubledSeconds", "label": "Pause After Troubled Seconds", "default": "3f", "tooltip": "「海の者が困っておる」のあと、次のセリフまで待つ秒数"}, {"header": "間と時間切れ", "type": "float", "name": "pauseBeforeFishHereSeconds", "label": "Pause Before Fish Here Seconds", "default": "1.5f", "tooltip": "魚が生まれたあと、「魚は海のもの」と言うまで待つ秒数（魚が落ちて跳ねるのを見せる間）"}, {"header": "間と時間切れ", "type": "float", "name": "pauseAtEndSeconds", "label": "Pause At End Seconds", "default": "4f", "tooltip": "最後のセリフのあと、次のチュートリアルへ進むまで待つ秒数"}, {"header": "間と時間切れ", "type": "int", "name": "missesBeforeEmphasize", "label": "Misses Before Emphasize", "default": "2", "tooltip": "この回数だけ違う物が生まれたら、影をはっきり出す（shadow.emphasize）。0 なら出さない"}, {"header": "間と時間切れ", "type": "float", "name": "giveUpSeconds", "label": "Give Up Seconds", "default": "60f", "tooltip": "魚が生まれるのを待つ秒数。過ぎたら、あきらめて先へ進む（ブースで止まらないため）。0 なら、ずっと待つ"}], "menus": [], "members": [{"mods": ["override"], "rtype": "PhaseId", "name": "Phase", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": ["override"], "rtype": "IEnumerator", "name": "Play", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "コンポーネント", "remarks": "流れ:\n1. 海（`requestField`）に、魚（`requestFood`）の欲しい物を出す（`Fields.Find(海).Open(魚)`。吹き出しは UI が出す）。\n   海を光らせ、巫女が「海の者が困っておる」と言う。フィールドが無い・出せないときは、警告を出して先へ進む。\n2. 霞の影を出す（T2 で影を見ていれば薄く）。雲を光らせ、巫女が「魚はどの歯ざわりであったか」と聞く。\n   魚が生まれるまで待つ。違う物が生まれたら「それではない」と言い、何回か外したら影を強める。\n3. 影を消し、巫女が「恵みは立つ場所に落ちる。魚は海のもの」と言う。`request-seen` を覚える。\n\n海の欲しい物は、出したまま終える（チュートリアル 4 で海に届ける）。ここでは Expire しない。\n\n出す合図（Inspector で変えられる。空にすると出さない）:\n- `<requestField>.glow`（例 `sea.glow`）: 欲しがっているフィールドを光らせる。\n- `shadow.show`: 霞の影を、ふつうの濃さで出す（T2 で影を見ていないとき）。\n- `shadow.faint`: 霞の影を、S4 より薄く出す（覚えたこと `texture-shadow-seen` があるとき）。\n- `shadow.emphasize`: 何回か外したので、影をはっきり出す。\n- `shadow.hide`: 影を消す。\n- `cloud.glow`: 刺す雲を光らせる。\n\n巫女のセリフ（合図 `miko.say.<id>`。中身はシーンの Miko の LineBook に書く）:\n- `t3-troubled`: \"Oh, the people by the sea are troubled. They want fish.\"\n- `t3-which-feel`: \"Pierce a new cloud. Which feel was the fish?\"\n- `t3-wrong`: \"Not that one. Which feel was the fish?\"（台本に無いので仮）\n- `t3-fish-here`: \"That's the fish — but blessings fall where you stand. Fish belong in the sea.\"\n\n魚・海は仮の割り当て（村 → リンゴ、海 → 魚）。決まったら Inspector で変える。", "usedBy": ["TutorialPrefabGenerator"], "uses": ["FieldId", "Fields", "FoodId", "IFieldRequests", "PhaseId", "SpawnWait", "TutorialScript"]}, {"id": "t-T4Deliver", "name": "T4Deliver", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Tutorial", "file": "Tutorial/T4Deliver.cs", "mod": "Tutorial", "sec": "Runtime", "bases": ["TutorialScript"], "attrs": [], "serializable": false, "doc": "チュートリアル 4「届ける」（シナリオブック S6）。届け先は、体験者が立っている場所で決まることを覚えてもらう。欲しがっているフィールド（既定は海）の前まで歩き、そこで欲しい物（既定は魚）を生み出すと終わる。", "brief": "チュートリアル 4「届ける」（シナリオブック S6）。", "values": [], "fields": [{"header": "届け先", "type": "string", "name": "field", "label": "Field", "default": "\"sea\"", "tooltip": "届けてもらうフィールドの ID（village / mountain / sea / grassland）。合図の名前の頭にも使う"}, {"header": "届け先", "type": "string", "name": "food", "label": "Food", "default": "\"fish\"", "tooltip": "届けてもらう物の ID。このフィールドが欲しがっていなければ、始めに Open で欲しがらせる"}, {"header": "セリフ（巫女の LineBook の Id。空なら言わない）", "type": "string", "name": "walkLine", "label": "Walk Line", "default": "\"t4-walk\"", "tooltip": "指示。「Walk to the sea, and create the fish there.」。しばらく届かないときも、くり返す"}, {"header": "セリフ（巫女の LineBook の Id。空なら言わない）", "type": "string", "name": "hereLine", "label": "Here Line", "default": "\"t4-here\"", "tooltip": "目当てのフィールドの前に立ったとき。「Now, create it here.」"}, {"header": "セリフ（巫女の LineBook の Id。空なら言わない）", "type": "string", "name": "notHereLine", "label": "Not Here Line", "default": "\"t4-not-here\"", "tooltip": "よそのフィールドに届いたとき。「Not here — go to the place that glows.」"}, {"header": "セリフ（巫女の LineBook の Id。空なら言わない）", "type": "string", "name": "wrongFoodLine", "label": "Wrong Food Line", "default": "\"t4-walk\"", "tooltip": "目当てのフィールドに、違う物が届いたとき。既定は指示のくり返し"}, {"header": "セリフ（巫女の LineBook の Id。空なら言わない）", "type": "string", "name": "splendidLine", "label": "Splendid Line", "default": "\"t4-splendid\"", "tooltip": "正しく届いたとき。「Splendid!」"}, {"header": "セリフ（巫女の LineBook の Id。空なら言わない）", "type": "string", "name": "trueGodLine", "label": "True God Line", "default": "\"t4-true-god\"", "tooltip": "締め。「Find what each place needs, go there, and create it. Now you are a true god.」"}, {"header": "合図（フィールドの ID のあとに付ける接尾辞。空なら出さない）", "type": "string", "name": "glowSuffix", "label": "Glow Suffix", "default": "\"glow\"", "tooltip": "目当てのフィールドを光らせる（<field>.glow）"}, {"header": "合図（フィールドの ID のあとに付ける接尾辞。空なら出さない）", "type": "string", "name": "glowOffSuffix", "label": "Glow Off Suffix", "default": "\"glow-off\"", "tooltip": "光を消す（<field>.glow-off）。最後に出す"}, {"header": "合図（フィールドの ID のあとに付ける接尾辞。空なら出さない）", "type": "string", "name": "footprintSuffix", "label": "Footprint Suffix", "default": "\"footprint\"", "tooltip": "目当てのフィールドの前に、足あとの印を出す（<field>.footprint）"}, {"header": "合図（フィールドの ID のあとに付ける接尾辞。空なら出さない）", "type": "string", "name": "footprintOffSuffix", "label": "Footprint Off Suffix", "default": "\"footprint-off\"", "tooltip": "足あとの印を消す（<field>.footprint-off）。前に立ったときと、最後に出す"}, {"header": "合図（フィールドの ID のあとに付ける接尾辞。空なら出さない）", "type": "string", "name": "cheerSuffix", "label": "Cheer Suffix", "default": "\"\"", "tooltip": "正しく届いたフィールドに出す合図（<field>.cheer）。空なら出さない。届いたときの反応は、フィールドの DeliveryFx が出すので、ふつうは空のまま"}, {"header": "合図（フィールドの ID のあとに付ける接尾辞。空なら出さない）", "type": "string", "name": "shakeHeadSuffix", "label": "Shake Head Suffix", "default": "\"\"", "tooltip": "違う場所・違う物が届いたフィールドに出す合図（<届いたフィールド>.shake-head）。空なら出さない。ふつうは空のまま（DeliveryFx が反応する）"}, {"header": "巫女の合図（空なら出さない）", "type": "string", "name": "mikoFollowCue", "label": "Miko Follow Cue", "default": "\"miko.follow\"", "tooltip": "指示を出すときに、巫女を体験者についてこさせる"}, {"header": "巫女の合図（空なら出さない）", "type": "string", "name": "mikoStayCue", "label": "Miko Stay Cue", "default": "\"miko.stay\"", "tooltip": "締めのセリフの前に、巫女をその場にとどまらせる"}, {"header": "時間（秒）", "type": "float", "name": "hintSeconds", "label": "Hint Seconds", "default": "15f", "tooltip": "この秒数のあいだ何も届かなければ、指示をもう一度言う。0 なら言わない"}, {"header": "時間（秒）", "type": "float", "name": "giveUpSeconds", "label": "Give Up Seconds", "default": "60f", "tooltip": "この秒数たっても正しく届かなければ、あきらめて締めへ進む。0 ならいつまでも待つ"}, {"header": "時間（秒）", "type": "float", "name": "pauseAfterSplendid", "label": "Pause After Splendid", "default": "2f", "tooltip": "「Splendid!」のあと、締めのセリフまでの間"}, {"header": "時間（秒）", "type": "float", "name": "pauseAfterTrueGod", "label": "Pause After True God", "default": "5f", "tooltip": "締めのセリフのあと、次の場面へ進むまでの間"}], "menus": [], "members": [{"mods": ["override"], "rtype": "PhaseId", "name": "Phase", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": ["override"], "rtype": "IEnumerator", "name": "Play", "params": "", "kind": "method", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "コンポーネント", "remarks": "流れ:\n1. 準備。目当てのフィールドの欲しい物が出ていなければ、Open(食べ物) で出す（チュートリアル 3 を外しても、これだけで動くように）。\n   フィールドがシーンに無ければ、警告を出して、このチュートリアルを終える（止まらない）。\n2. フィールドを光らせ、足あとの印を出し、巫女をついて来させて「海の前まで歩き、そこで魚を生み出す」と言う。\n   その後は、どこかに物が届くのを待つ。目当てのフィールドに、欲しがっていた物が届いたら成功。\n   - 目当ての前に立ったら、足あとの印を消し、「ここで生み出す」と言う。\n   - よそのフィールドに届いたら、「ここではない」と言う。足あとの印をもう一度出す。\n   - 目当てのフィールドに、違う物が届いたら、指示をもう一度言う。\n   - どちらの場合も、届いたフィールドは自分でがっかりする（DeliveryFx）。届いた物は霞のように消える（DeliveryZone）。\n   - しばらく何も届かなければ、指示をもう一度言う。\n   - あきらめる時間を過ぎたら、成功しないまま 4 へ進む（ブースを止めない）。\n3. 成功したら、「見事じゃ」と言う。フィールドは自分で喜ぶ（ステップが済み、DeliveryFx が粒と音を出す）。\n4. 光と足あとの印を消し、巫女をとどまらせて、締めのセリフを言う。成功したときだけ、`delivered-by-standing` を覚える。\n\n出す合図（フィールド名は Inspector の Field。接尾辞を空にした合図は出さない）:\n- `<field>.glow` / `<field>.glow-off`: 目当てのフィールドを光らせる / 光を消す。\n- `<field>.footprint` / `<field>.footprint-off`: 目当てのフィールドの前の床に、足あとの印を出す / 消す。\n- `<field>.cheer` / `<届いたフィールド>.shake-head`: 既定では出さない。届いたときの反応（喜ぶ・がっかりする）は、\n  フィールドの DeliveryFx が、チュートリアルでも本編でも同じように出すため。演出を足したいときだけ、接尾辞を入れる。\n- `miko.follow` / `miko.stay`: 巫女が体験者についてくる / その場にとどまる。\n\nセリフ（`miko.say.<id>`。中身はシーンの Miko の LineBook に書く）:\n- `t4-walk`: \"Walk to the sea, and create the fish there.\"\n- `t4-here`: \"Now, create it here.\"\n- `t4-not-here`: \"Not here — go to the place that glows.\"\n- `t4-splendid`: \"Splendid!\"\n- `t4-true-god`: \"Find what each place needs, go there, and create it. Now you are a true god.\"", "usedBy": ["TutorialPrefabGenerator"], "uses": ["AnyWait", "Delivered", "DeliveryWait", "FieldId", "Fields", "FoodId", "IFieldRequests", "PhaseId", "TutorialScript"]}, {"id": "t-TutorialHistory", "name": "TutorialHistory", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Tutorial", "file": "Tutorial/TutorialHistory.cs", "mod": "Tutorial", "sec": "Runtime", "bases": ["IDisposable"], "attrs": [], "serializable": false, "doc": "チュートリアルが始まってから、体験者がしたことの記録。待ちが、先回りした操作も数えるために使う。たとえば「刺して」と言う前に刺していたら、刺すのを待つ待ちは、すぐ終わる。", "brief": "チュートリアルが始まってから、体験者がしたことの記録。", "values": [], "fields": [], "menus": [], "members": [{"mods": [], "rtype": "", "name": "TutorialHistory", "params": "", "kind": "ctor", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "int", "name": "Pending", "params": "TutorialEvent kind", "kind": "method", "acc": "", "doc": "kind の、まだ使われていない記録の数。", "brief": "kind の、まだ使われていない記録の数。"}, {"mods": [], "rtype": "void", "name": "UseAll", "params": "TutorialEvent kind", "kind": "method", "acc": "", "doc": "kind の記録を、今までの分すべて使ったことにする。", "brief": "kind の記録を、今までの分すべて使ったことにする。"}, {"mods": [], "rtype": "void", "name": "Dispose", "params": "", "kind": "method", "acc": "", "doc": "記録をやめ、聞くのをやめる。", "brief": "記録をやめ、聞くのをやめる。"}], "nested_in": null, "role": "クラス", "remarks": "- 記録するのは、刺した・かけらの付いた先を口に含んだ・食感が変わった・決定した（食感あり）・食べ物が生まれた、の 5 つ。\n- 待ちは、まだ使われていない記録を数える。待ちが終わると、その種類の記録は、そこまで使ったことにする（同じ操作で 2 回進まない）。\n- `TutorialRunner` が、チュートリアル 1 つごとに作り、終わったら `Dispose` する。前のチュートリアルの操作は数えない。", "usedBy": ["TutorialRunner", "TutorialScript"], "uses": ["Devices", "FoodId", "FoodSpawners", "Forks", "IDevice", "IFoodSpawner", "IFork", "Spawned", "TextureId"]}, {"id": "t-TutorialEvent", "name": "TutorialEvent", "kind": "enum", "mods": [], "ns": "MouthOfGod.Tutorial", "file": "Tutorial/TutorialHistory.cs", "mod": "Tutorial", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "TutorialHistory が記録すること。", "brief": "TutorialHistory が記録すること。", "values": [{"name": "Pierced", "doc": "雲を刺した。"}, {"name": "MouthEntered", "doc": "かけらの付いた先を、口に含んだ。"}, {"name": "TextureChanged", "doc": "食感が変わった（噛み始めの最初の食感も含む）。"}, {"name": "Confirmed", "doc": "食感を選んで決定した。"}, {"name": "Spawned", "doc": "食べ物が生まれた。"}], "fields": [], "menus": [], "members": [], "nested_in": null, "role": "選択肢（enum）", "remarks": "", "usedBy": ["T1Fork", "TutorialScript"], "uses": ["Devices", "FoodId", "FoodSpawners", "Forks",  null, "type": "bool", "name": "waitUntilWorn", "label": "Wait Until Worn", "default": "true", "tooltip": "Begin On Start のとき、Quest をかぶるまで待ってから始める。かぶっているかが分からない（エディタなど）ときは、待たない"}, {"header": null, "type": "float", "name": "beginDelaySeconds", "label": "Begin Delay Seconds", "default": "", "tooltip": "Begin On Start のとき、始めるまで待つ秒数"}, {"header": null, "type": "bool", "name": "skipOnStart", "label": "Skip On Start", "default": "", "tooltip": "入れると、Play を始めたときにチュートリアルを飛ばして、本編を始める（Begin On Start より優先）。試験用"}, {"header": null, "type": "string", "name": "skipPhase", "label": "Skip Phase", "default": "\"deliver\"", "tooltip": "Skip したときに、一度だけ入る場面。最後のチュートリアルの場面名（GameRunner の After Phase と同じ）にする"}], "menus": [{"kind": "ContextMenu", "path": "Begin"}, {"kind": "ContextMenu", "path": "Stop"}, {"kind": "ContextMenu", "path": "Skip"}], "members": [{"mods": [], "rtype": "TutorialMemory", "name": "Memory", "params": "", "kind": "property", "acc": "get;", "doc": "チュートリアルのあいだで引き継ぐ、覚えたこと。", "brief": "チュートリアルのあいだで引き継ぐ、覚えたこと。"}, {"mods": [], "rtype": "bool", "name": "IsRunning", "params": "", "kind": "property", "acc": "", "doc": "動いているか。", "brief": "動いているか。"}, {"mods": [], "rtype": "Action<PhaseId>", "name": "ScriptStarted", "params": "", "kind": "event", "acc": "", "doc": "スクリプトを動かし始めた（その場面の名前を運ぶ）。", "brief": "スクリプトを動かし始めた（その場面の名前を運ぶ）。"}, {"mods": [], "rtype": "Action<PhaseId>", "name": "ScriptFinished", "params": "", "kind": "event", "acc": "", "doc": "スクリプトが終わった（例外でやめた場合も含む）。", "brief": "スクリプトが終わった（例外でやめた場合も含む）。"}, {"mods": [], "rtype": "Action", "name": "Finished", "params": "", "kind": "event", "acc": "", "doc": "全部のスクリプトが終わった。Stop でやめたときは出ない。", "brief": "全部のスクリプトが終わった。"}, {"mods": [], "rtype": "bool", "name": "Begin", "params": "", "kind": "method", "acc": "", "doc": "最初から動かす。すでに動いていれば、警告して false。", "brief": "最初から動かす。"}, {"mods": [], "rtype": "void", "name": "Skip", "params": "", "kind": "method", "acc": "", "doc": "チュートリアルを飛ばして、全部終わった扱いにする。動いていれば止め、村を最初に戻し、 合図の後片付け（巫女をとどまらせる・光と足あとを消す）をして、場面を skipPhase から空へ進め、Finished を出す。", "brief": "チュートリアルを飛ばして、全部終わった扱いにする。"}, {"mods": [], "rtype": "void", "name": "Stop", "params": "", "kind": "method", "acc": "", "doc": "途中でやめる。待ちを外し、場面を空に戻す。動いていなければ何もしない。", "brief": "途中でやめる。"}], "nested_in": null, "role": "コンポーネント", "remarks": "- 動かすのは `Begin` を呼んだときから。いつ呼ぶか（台の前に立ったとき、など）は、呼ぶ側が決める。\n- 無効なスクリプト（enabled を外した、または非アクティブ）は飛ばす。特定のチュートリアルだけを試すときに使う。\n- スクリプトで例外が出たら、そのスクリプトだけをやめて、次へ進む。\n- 全部終わったら `Finished` を出し、場面を空に戻す。次の場面（本編など）は、`Finished` を受けた側が決める。\n- 覚えたこと（`Memory`）は、`Begin` で空にする。\n- `Skip` は、チュートリアルを飛ばして「全部終わった」ことにする。動いている途中でも、始める前でも呼べる。\n  場面を `skipPhase`（既定 deliver。本編の GameRunner が待つ場面）にしてから空に戻すので、本編が普通に始まる。", "usedBy": ["OpenAllRequestsAfterTutorial", "TutorialAutoStart", "TutorialDebugHud", "TutorialTestSceneBuilder"], "uses": ["CueId", "Cues", "Fields", "IFieldRequests", "PhaseId", "Phases", "TutorialHistory", "TutorialMemory", "TutorialScript"]}, {"id": "t-TutorialScript", "name": "TutorialScript", "kind": "class", "mods": ["abstract"], "ns": "MouthOfGod.Tutorial", "file": "Tutorial/TutorialScript.cs", "mod": "Tutorial", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "人形劇スクリプトの土台。チュートリアル 1 つにつき、これを継いだクラスを 1 つ書く（T1.cs … T4.cs）。流れ（合図を出す、待つ、分岐する）をコルーチンで書く。見せ方は、合図を受けるフィールドや UI が決める。", "brief": "人形劇スクリプトの土台。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["abstract"], "rtype": "PhaseId", "name": "Phase", "params": "", "kind": "property", "acc": "get;", "doc": "このチュートリアルの場面の名前（fork、spawn など）。動いているあいだ Current になる。番号は使わない。", "brief": "このチュートリアルの場面の名前（fork、spawn など）。"}, {"mods": ["abstract"], "rtype": "IEnumerator", "name": "Play", "params": "", "kind": "method", "acc": "", "doc": "流れを書く。yield return で待つ。", "brief": "流れを書く。"}, {"mods": ["protected"], "rtype": "TutorialMemory", "name": "Memory", "params": "", "kind": "property", "acc": "", "doc": "前のチュートリアルで覚えたこと。TutorialRunner が渡す。", "brief": "前のチュートリアルで覚えたこと。"}, {"mods": ["protected"], "rtype": "Tut 画。Clip と File のどちらかを入れる。両方あれば Clip を使う"}, {"header": "動画", "type": "string", "name": "streamingAssetsFile", "label": "Streaming Assets File", "default": "\"\"", "tooltip": "StreamingAssets の中の動画ファイル名（例: prologue.mp4）。大きい動画はこちらに置く。Clip が空のときに使う"}, {"header": "動画", "type": "float", "name": "volume", "label": "Volume", "default": "1f", "tooltip": "音量（0〜1）。動画の音は、頭の位置によらず、そのまま鳴る"}, {"header": "動画", "type": "float", "name": "prepareTimeoutSeconds", "label": "Prepare Timeout Seconds", "default": "10f", "tooltip": "読み込みを待つ最長の秒数。過ぎたら、流さずに終わる"}, {"header": "動画", "type": "float", "name": "maxSeconds", "label": "Max Seconds", "default": "", "tooltip": "流す最長の秒数。0 なら、動画の終わりまで。動画が終わらないときの保険"}, {"header": "置き方", "type": "Transform", "name": "head", "label": "Head", "default": "", "tooltip": "頭の位置と向き。空なら Main Camera"}, {"header": "置き方", "type": "float", "name": "distance", "label": "Distance", "default": "3f", "tooltip": "頭から画面までの距離（m）"}, {"header": "置き方", "type": "float", "name": "viewDegrees", "label": "View Degrees", "default": "80f", "tooltip": "画面の幅を、水平の視野の角度（度）で決める。Quest の視野（水平 100〜110 度）は、端が見えにくいので、80 でほぼ視界いっぱいに収まる。高さは動画の縦横比で決まる"}, {"header": "置き方", "type": "float", "name": "maxVerticalDegrees", "label": "Max Vertical Degrees", "default": "55f", "tooltip": "画面の高さを、縦の視野の角度（度）で抑える。縦長の動画でも、画面が上下にはみ出さないようにする"}, {"header": "置き方", "type": "float", "name": "heightOffset", "label": "Height Offset", "default": "-0.1f", "tooltip": "画面の中心を、目の高さからずらす量（m）。負なら下"}, {"header": "置き方", "type": "float", "name": "recenterAngle", "label": "Recenter Angle", "default": "50f", "tooltip": "頭の向きがこの角度より大きくずれたら、画面を正面へ回り込ませる（度）。0 なら回り込まない"}, {"header": "置き方", "type": "float", "name": "recenterSpeed", "label": "Recenter Speed", "default": "1.5f", "tooltip": "回り込む速さ（1 秒あたりの割合）"}, {"header": "見え方", "type": "bool", "name": "darkSurround", "label": "Dark Surround", "default": "true", "tooltip": "流している間、周りを暗い球で囲み、村やミニチュアを見せない"}, {"header": "見え方", "type": "Color", "name": "surroundColor", "label": "Surround Color", "default": "Color.black", "tooltip": "周りの球の色"}, {"header": "見え方", "type": "Material", "name": "screenMaterial", "label": "Screen Material", "default": "", "tooltip": "画面のマテリアル。空なら UI/Default で作る。色（_Color / _BaseColor）の透明度でフェードする"}, {"header": "見え方", "type": "float", "name": "fadeSeconds", "label": "Fade Seconds", "default": "1f", "tooltip": "出す・消すときのフェードの秒数"}, {"header": "見え方", "type": "GameObject[]", "name": "hideWhilePlaying", "label": "Hide While Playing", "default": "new GameObject[0]", "tooltip": "動画を流している間だけ隠す物（村など）。終わったら元に戻す"}, {"header": "見え方", "type": "GameObject[]", "name": "showWhilePlaying", "label": "Show While Playing", "default": "new GameObject[0]", "tooltip": "動画を流している間だけ出す物（暗い背景など）。終わったら隠す"}], "menus": [{"kind": "ContextMenu", "path": "Skip"}], "members": [{"mods": [], "rtype": "bool", "name": "IsBusy", "params": "", "kind": "property", "acc": "", "doc": "流している（読み込み・フェードの間も含む）。", "brief": "流している（読み込み・フェードの間も含む）。"}, {"mods": [], "rtype": "bool", "name": "HasVideo", "params": "", "kind": "property", "acc": "", "doc": "流せる動画が入っているか。", "brief": "流せる動画が入っているか。"}, {"mods": [], "rtype": "void", "name": "Play", "params": "", "kind": "method", "acc": "", "doc": "動画を流し始める。終わるまで IsBusy が true。もう流していれば何もしない。", "brief": "動画を流し始める。"}, {"mods": [], "rtype": "void", "name": "Skip", "params": "", "kind": "method", "acc": "", "doc": "途中でやめる（フェードして消す）。流していなければ何もしない。", "brief": "途中でやめる（フェードして消す）。"}, {"mods": [], "rtype": "CustomYieldInstruction", "name": "PlayAndWait", "params": "", "kind": "method", "acc": "", "doc": "流し始め、終わるまで待つ。yield return で使う。", "brief": "流し始め、終わるまで待つ。"}], "nested_in": null, "role": "コンポーネント", "remarks": "VR 酔いを避けるための決まり:\n- 画面は空間に固定する。頭を少し回しても動かない。大きく向きを変えたときだけ、ゆっくり正面へ回り込む（Recenter）。\n  頭に付けた画面は、頭と一緒に動くので酔いやすい。そのため、画面いっぱいに見せるときも、頭には付けない。\n- 画面の大きさは、水平と縦の視野の角度で決める（初期値: 3 m 先に水平 80 度・縦 55 度まで。Quest の視野は水平におよそ 100〜110 度だが、端は見えにくい）。\n- 暗い球と画面は、ほかのどの物よりも手前に描く。近くにあるミニチュアも隠れる。\n- 出し入れは、フェードで行う。視界を急に暗くしない。\n- 読み込みに失敗したとき・動画が無いときは、警告を出してすぐ終わる。体験を止めない。\nシーンは切り替えない。同じシーンの中で流すので、XR リグと AprilTag の位置合わせが残る。", "usedBy": ["PrologueVideo", "TutorialPrefabGenerator"], "uses": []}, {"id": "t-CueReaction", "name": "CueReaction", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.UI", "file": "UI/CueReaction.cs", "mod": "UI", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "合図（Requested）を受けて、物を出す・消す・UnityEvent を呼ぶ。コードを書かずに、Inspector だけで合図に反応できる。例: sea.glow で光る物を出す、village.cheer で村人の Animator を呼ぶ、staff.alert でスタッフ向けの表示を出す。", "brief": "合図（Requested）を受けて、物を出す・消す・UnityEvent を呼ぶ。", "values": [], "fields": [], "menus": [], "members": [{"mods": [], "rtype": "IReadOnlyList<Entry>", "name": "Entries", "params": "", "kind": "property", "acc": "", "doc": "反応の一覧。", "brief": "反応の一覧。"}], "nested_in": null, "role": "コンポーネント", "remarks": "- 合図の名前は、大文字小文字を区別して、そのまま比べる。同じ合図の行がいくつあっても、すべて動く。\n- `Seconds` が 0 より大きい行は、その秒数のあとに元に戻す（出した物を消し、消した物を出す）。戻す前に同じ合図が来たら、そこから数え直す。\n- このコンポーネントを付けた物は、消さない（Hide に入れない）。無効になると、合図を受けず、元に戻す予定も止まる。", "usedBy": ["TutorialTestSceneBuilder"], "uses": ["CueId", "CueRequested", "Cues"]}, {"id": "t-Entry", "name": "Entry", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.UI", "file": "UI/CueReaction.cs", "mod": "UI", "sec": "Runtime", "bases": [], "attrs": [], "serializable": true, "doc": "1 つの合図への反応。", "brief": "1 つの合図への反応。", "values": [], "fields": [{"header": null, "type": "string", "name": "cue", "label": "Cue", "default": "\"\"", "tooltip": "受ける合図の名前（例: sea.glow、village.cheer、device.button.glow）"}, {"header": null, "type": "GameObject[]", "name": "show", "label": "Show", "default": "new GameObject[0]", "tooltip": "合図で出す物"}, {"header": null, "type": "GameObject[]", "name": "hide", "label": "Hide", "default": "new GameObject[0]", "tooltip": "合図で消す物"}, {"header": null, "type": "float", "name": "seconds", "label": "Seconds", "default": "", "tooltip": "0 なら、そのまま。0 より大きければ、その秒数のあとに元に戻す（Show を消し、Hide を出す）"}, {"header": null, "type": "UnityEvent", "name": "onCue", "la ": "Fx Parent", "default": "", "tooltip": "このフィールドの効果（喜びの粒・消える煙・出現の星）を、この子として出す。空なら、シーンの直下"}, {"header": "音", "type": "float", "name": "volume", "label": "Volume", "default": "0.6f", "tooltip": ""}], "menus": [], "members": [{"mods": [], "rtype": "Transform", "name": "FxParent", "params": "", "kind": "property", "acc": "", "doc": "効果の置き場（親）。空ならシーンの直下。DeliveryZone・PopInEffect の効果もここに出る。", "brief": "効果の置き場（親）。"}], "nested_in": null, "role": "コンポーネント", "remarks": "- 欲しい物が届いた（ステップが済んだ）: 助かった村人の頭の上に喜びの粒を出し、音を 2D で鳴らす。村人の喜ぶ動きは `VillagerMood` が出す。\n- 違う物が届いた（頼まれていない物・よその物。どちらも同じ反応）: 困っている村人に、Animator のトリガー（`Missed Trigger`）を送り、がっかりした音を鳴らす。\n- 粒と音を空にしておくと、Resources の標準の物を使う（粒: Prefabs/Village/Fx_Joy、音: Sounds/Village/Done と Missed）。\n  動きを変えるときは、村人の Animator Controller の、このトリガーで入るステートの Motion を差し替える。コードは直さない。\n  トリガーを持たない Animator（動物など）には、何もしない。\n- 届いた物そのものの消え方（違う物は霞のように消える）は、`DeliveryZone` が受け持つ。\n- `Fx Parent` を入れると、粒・煙・出現の星を、その子として出す。\n- 独自の反応を足すときは、On Requested / On Missed に、つなぐ。", "usedBy": ["DeliveryZone", "FieldStages", "SkipPopIn", "VillageBaker"], "uses": ["Delivered", "DeliveryKind", "FieldStages", "FieldStep", "VillagerMood"]}, {"id": "t-DeliveryZone", "name": "DeliveryZone", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.Village", "file": "Village/DeliveryZone.cs", "mod": "Village", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": ["[RequireComponent(typeof(Collider))]"], "serializable": false, "doc": "食べ物が落ちる場所。フィールドの上に置き、食べ物が入ったら、そのフィールドの Receive を呼ぶ。Collider（Is Trigger）と一緒に付ける。頼まれた物かどうかは、フィールドが判断する。ここでは判断しない。", "brief": "食べ物が落ちる場所。", "values": [], "fields": [{"header": null, "type": "string", "name": "fieldId", "label": "Field Id", "default": "\"\"", "tooltip": "届けるフィールドの ID（village など）。空なら、親にあるフィールド（FieldStages）に届ける"}, {"header": null, "type": "bool", "name": "consumeRequested", "label": "Consume Requested", "default": "true", "tooltip": "頼まれた物が届いたら、その食べ物を消す"}, {"header": null, "type": "bool", "name": "consumeOthers", "label": "Consume Others",
