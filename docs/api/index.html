<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>MouthOfGod API</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 配置: 上に細い帯、左に名前空間と型の一覧、右に Javadoc 風の型のページ（概要の表 → 詳細）。幅が狭いと一覧は引き出しになる */
:root {
  --bg: #f3f5f8;
  --panel: #ffffff;
  --ink: #1b2733;
  --muted: #5a6978;
  --line: #d5dce4;
  --accent: #1d5ca8;
  --mark: #d4691a;
  --band: #dde7f1;
  --band-ink: #1f3550;
  --bar: #1f3550;
  --bar-ink: #f2f6fa;
  --code-bg: #eaeff5;
  --hit: #fff1c9;
  --sans: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12181f; --panel: #1a222b; --ink: #e4eaf0; --muted: #9aa9b8; --line: #2c3947; --accent: #7db4f0; --mark: #f0993f;
    --band: #243447; --band-ink: #d7e4f2; --bar: #0d131a; --bar-ink: #e4eaf0; --code-bg: #232e3a; --hit: #4a3f1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12181f; --panel: #1a222b; --ink: #e4eaf0; --muted: #9aa9b8; --line: #2c3947; --accent: #7db4f0; --mark: #f0993f;
  --band: #243447; --band-ink: #d7e4f2; --bar: #0d131a; --bar-ink: #e4eaf0; --code-bg: #232e3a; --hit: #4a3f1a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.75 var(--sans); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre, .mono { font-family: var(--mono); font-size: 0.9em; }
code { background: var(--code-bg); padding: 0.08em 0.35em; border-radius: 3px; }
pre { background: var(--code-bg); padding: 12px 14px; border-radius: 4px; overflow-x: auto; line-height: 1.55; }
pre code { background: none; padding: 0; }
.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
.bar { background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; gap: 14px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: 0.02em; white-space: nowrap; }
.bar h1 small { font-weight: 400; opacity: 0.7; margin-left: 8px; font-size: 12px; }
.bar input { flex: 1; min-width: 0; max-width: 360px; background: rgba(255,255,255,0.12); color: inherit; border: 1px solid rgba(255,255,255,0.25);
  border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 14px; }
.bar input::placeholder { color: rgba(255,255,255,0.6); }
.bar button { background: none; border: 1px solid rgba(255,255,255,0.3); color: inherit; border-radius: 4px; padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.bar .grow { flex: 1; }
.menu-btn { display: none; }
.shell { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: 0; }
nav { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 0 40px; font-size: 13.5px; line-height: 1.5; }
nav h2 { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 14px 16px 4px; font-weight: 500; }
nav a { display: block; padding: 3px 16px; color: var(--ink); }
nav a:hover { background: var(--band); text-decoration: none; }
nav a.on { background: var(--band); color: var(--band-ink); font-weight: 700; box-shadow: inset 3px 0 0 var(--mark); }
nav a.t { padding-left: 28px; font-family: var(--mono); font-size: 12.5px; }
nav a.t.sub { padding-left: 40px; color: var(--muted); }
nav a.mod { font-weight: 700; margin-top: 6px; }
nav .count { color: var(--muted); font-weight: 400; font-size: 11px; margin-left: 6px; }
nav details > summary { cursor: pointer; padding: 3px 16px 3px 28px; color: var(--muted); font-size: 12px; }
main { overflow-y: auto; min-width: 0; padding-block: 24px 80px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1040px; }
.crumb { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.title { font-size: 26px; line-height: 1.3; margin: 0 0 6px; padding-bottom: 8px; border-bottom: 3px solid var(--mark); font-weight: 700; text-wrap: balance; }
.title .kind { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--mark); margin-right: 10px; }
.title .tname { font-family: var(--mono); }
.meta { margin: 10px 0 14px; display: grid; gap: 3px; font-size: 13.5px; }
.meta code { word-break: break-all; }
.meta b { display: inline-block; min-width: 5.5em; color: var(--muted); font-weight: 500; }
.lead { font-size: 16px; margin: 14px 0 22px; }
h2.sec { font-size: 15px; background: var(--band); color: var(--band-ink); margin: 26px 0 0; padding: 6px 12px; border: 1px solid var(--line); border-bottom: 0; font-weight: 700; }
.tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); margin-bottom: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; vertical-align: top; padding: 7px 12px; border-top: 1px solid var(--line); }
tr:first-child th, tr:first-child td { border-top: 0; }
th { font-weight: 500; color: var(--muted); font-size: 12.5px; background: color-mix(in srgb, var(--band) 45%, var(--panel)); white-space: nowrap; }
td.ret { white-space: nowrap; font-family: var(--mono); font-size: 12.5px; color: var(--muted); width: 1%; }
td.nm { font-family: var(--mono); font-size: 13px; }
td.nm a { font-weight: 500; }
td.nm .brief { display: block; font-family: var(--sans); font-size: 13.5px; color: var(--ink); margin-top: 2px; font-weight: 400; }
tr.grp td { background: color-mix(in srgb, var(--band) 30%, var(--panel)); font-weight: 700; font-size: 12.5px; color: var(--band-ink); }
.chip { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; margin-right: 4px; color: var(--muted); }
.det { background: var(--panel); border: 1px solid var(--line); border-top: 0; padding: 4px 16px 6px; }
.det article { padding: 12px 0; border-top: 1px solid var(--line); scroll-margin-top: 12px; }
.det article:first-child { border-top: 0; }
.det h3 { margin: 0 0 6px; font-family: var(--mono); font-size: 15px; font-weight: 500; }
.det pre { margin: 6px 0; font-size: 13px; }
.det p { margin: 6px 0 0; }
.hit { background: var(--hit); }
.prose h1 { font-size: 26px; border-bottom: 3px solid var(--mark); padding-bottom: 8px; margin: 0 0 14px; }
.prose h2 { font-size: 20px; margin: 30px 0 10px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.prose h3 { font-size: 16.5px; margin: 24px 0 8px; }
.prose .tablewrap, .prose pre { margin: 12px 0; }
.prose table { background: var(--panel); }
.prose blockquote { margin: 12px 0; padding: 4px 14px; border-left: 3px solid var(--mark); background: var(--panel); color: var(--muted); }
.prose p, .prose li { max-width: 72ch; }
.prose table p { max-width: none; }
.prose ul, .prose ol { padding-left: 1.4em; }
.pre-mermaid { background: var(--panel); border: 1px solid var(--line); padding: 12px; overflow-x: auto; }
.results a { display: block; padding: 4px 16px; font-family: var(--mono); font-size: 12.5px; }
.results small { display: block; color: var(--muted); font-family: var(--sans); }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  nav { position: fixed; z-index: 20; inset: 0 20% 0 0; transform: translateX(-102%); transition: transform .18s; box-shadow: 2px 0 12px rgba(0,0,0,.3);
    padding-top: calc(12px + env(safe-area-inset-top, 0px)); }
  body.open nav { transform: none; }
  .menu-btn { display: inline-block; }
  .bar h1 small { display: none; }
  main { padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { nav { transition: none; } }
.role { display: inline-block; font-size: 12px; font-weight: 700; color: var(--band-ink); background: var(--band); border-radius: 3px; padding: 1px 8px; margin-right: 8px; vertical-align: 3px; }
.rolenote { color: var(--muted); font-size: 13px; }
nav .grp { font-size: 11px; color: var(--muted); padding: 6px 16px 1px 28px; }
.notes { background: var(--panel); border: 1px solid var(--line); border-top: 0; padding: 4px 18px 10px; }
.notes ul { margin: 8px 0; padding-left: 1.2em; }
.notes li { margin: 4px 0; max-width: 78ch; }
.rel { background: var(--panel); border: 1px solid var(--line); border-top: 0; padding: 10px 16px; display: grid; gap: 8px; }
.rel div { display: grid; grid-template-columns: 8.5em minmax(0, 1fr); gap: 10px; }
.rel b { color: var(--muted); font-weight: 500; font-size: 13px; }
.rel a { font-family: var(--mono); font-size: 13px; margin-right: 10px; white-space: nowrap; display: inline-block; }
.mem { background: var(--panel); border: 1px solid var(--line); border-top: 0; }
.mem h4 { margin: 0; padding: 6px 16px; font-size: 12.5px; color: var(--band-ink); background: color-mix(in srgb, var(--band) 30%, var(--panel)); border-top: 1px solid var(--line); }
.mem h4:first-child { border-top: 0; }
.mem article { padding: 10px 16px 12px; border-top: 1px solid var(--line); scroll-margin-top: 12px; }
.mem h4 + article { border-top: 0; }
.mem .name { font-family: var(--mono); font-size: 15px; font-weight: 500; }
.mem .sig { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 2px; word-break: break-word; }
.mem p { margin: 6px 0 0; max-width: 78ch; }
.none { color: var(--muted); }
.why { background: var(--panel); border: 1px solid var(--line); border-top: 0; padding: 4px 16px 10px; }
.why section { padding: 10px 0 4px; border-top: 1px solid var(--line); }
.why section:first-child { border-top: 0; }
.why h3 { margin: 0 0 4px; font-size: 15px; }
.why p { margin: 4px 0; max-width: 78ch; }
.why .more { font-size: 13px; }
.dp { background: var(--panel); border: 1px solid var(--line); margin: 18px 0; padding: 4px 20px 14px; scroll-margin-top: 12px; }
.dp > h2 { font-size: 19px; margin: 14px 0 6px; border: 0; padding: 0; }
.dp h3 { font-size: 13px; letter-spacing: 0.04em; color: var(--muted); margin: 14px 0 2px; font-weight: 700; }
.dp .src { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.dp .tys a { font-family: var(--mono); font-size: 13px; margin-right: 10px; display: inline-block; }
.dp.hit { box-shadow: 0 0 0 3px var(--mark); }
.first { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--mark); padding: 10px 16px; margin: 14px 0 22px; }
.svgwrap { background: var(--panel); border: 1px solid var(--line); overflow-x: auto; padding: 8px; }
.svgwrap.top { border-top: 0; }
svg.g { display: block; font-family: var(--mono); }
svg.g .box rect { fill: var(--panel); stroke-width: 1.5; }
svg.g .box text { fill: var(--ink); font-size: 12.5px; dominant-baseline: middle; text-anchor: middle; }
svg.g .box.center rect { fill: var(--band); stroke-width: 2.5; }
svg.g .box.center text { font-weight: 700; }
svg.g .box:hover rect { fill: var(--band); }
svg.g .mod { fill: var(--muted); font-size: 10px; text-anchor: middle; dominant-baseline: middle; font-family: var(--sans); }
svg.g .edge { stroke: var(--muted); stroke-width: 1.2; fill: none; opacity: .75; }
svg.g .lbl rect { fill: var(--bg); }
svg.g .lbl text { fill: var(--band-ink); font-family: var(--sans); font-size: 11.5px; dominant-baseline: middle; text-anchor: middle; }
svg.g .colhead { fill: var(--muted); font-family: var(--sans); font-size: 12px; text-anchor: middle; }
svg.g .arrowhead { fill: var(--muted); }
.legend { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
.recipe { background: var(--panel); border: 1px solid var(--line); margin: 18px 0; padding: 4px 20px 14px; scroll-margin-top: 12px; }
.recipe > h2 { font-size: 19px; margin: 14px 0 6px; border: 0; padding: 0; }
.recipe.hit { box-shadow: 0 0 0 3px var(--mark); }
.recipe pre { font-size: 12.5px; }
.see { font-size: 13px; color: var(--muted); }
.see a { margin-right: 10px; }
:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
</style>
<div class="app">
  <header class="bar">
    <button class="menu-btn" id="menu" aria-label="一覧を開く">一覧</button>
    <h1>MouthOfGod API<small>スクリプトリファレンス（2026-10-28）</small></h1>
    <input id="q" type="search" placeholder="型・メンバーを検索（例: Spawn）" autocomplete="off" aria-label="検索">
    <span class="grow"></span>
    <button id="theme" aria-label="表示の明るさを切り替える">明暗</button>
  </header>
  <div class="shell">
    <nav id="nav" aria-label="型の一覧"></nav>
    <main id="main"></main>
  </div>
</div>
<script>
const DATA = {"recipes": [{"id": "r-creature-mood", "title": "困っている生き物（例: 猫）を、元気にする", "types": ["VillagerMood", "FieldStep", "FieldStages", "DeliveryFx", "CueReaction"], "md": "このゲームの生き物には、「困っている」と「元気」の 2 つの状態があります。体験者が欲しい物を届けると、困っている生き物が元気になります。村人も海の住人も、同じ仕組みで動いています。猫を足すときも、この仕組みに乗せます。\n\n| 状態 | 見た目（`VillagerMood` が Animator で出す） |\n|---|---|\n| 困っている | 頭の上に印が出ます。肩を落として、ゆっくり立ちます。ときどき、がっくりうなだれます。うなだれる間隔は生き物ごとにばらつくので、全員が同時には動きません |\n| 元気 | 印が消え、ふつうに立ちます。ステップが済んだときは、元気な生き物が 1 回喜びます |\n| 困っているときに違う物が届いた | がっかりする動き（トリガー `Missed`）を 1 回します。状態は困っているのままです |\n\n**猫を、困っている状態から元気にする手順**\n\n1. 猫に `VillagerMood` を付けます。Animator Controller には、村人と同じパラメータ（`Worried`・`Slump` の bool と、`Missed` のトリガー）を用意します。村人の `Villager.controller` を元にすると早いです。\n2. 頭の上の印を、Worry Mark に入れます。\n3. フィールドの `Steps` の下で、猫を助ける段の `FieldStep` を選び、Helped に猫を入れます。Food に、猫が欲しがる物の ID を入れます。\n4. Play すると、猫は困っている状態で始まります。その段の欲しい物が届くと、`FieldStages` が猫を元気にします。Helped に猫の名前がある段がすべて済むまで、猫は困ったままです。\n5. 違う物が届いたときのがっかりする動きは、`DeliveryFx` が送ります。猫の側では何もしません。\n\n**あわせて使える変え方**\n\n- 元気になった段で、猫が新しく現れるようにしたい: 猫を、その段の `FieldStep` の子に置きます。段が済むと、小さい所から「ぽんっ」と出てきます。\n- チュートリアルの合図で、猫に何かさせたい: 猫か近くの物に `CueReaction` を付け、合図の名前（例: `grassland.cat-look`）と、On Cue で呼ぶ Animator のトリガーを入れます。チュートリアルからは `Cue(\"grassland.cat-look\");` で合図を出します。"}, {"id": "r-creature-ai", "title": "生き物に、自分で考えて動く振る舞い（AI のような動き）を持たせる", "types": ["Phases", "Standing", "Fields", "IFieldRequests", "Delivered", "DeliveryKind"], "md": "振る舞いは、ふつうの MonoBehaviour で書きます。特別な枠組みは要りません。守ることは 3 つです。\n\n- 読むのは Core だけにします。場面は `Phases`、体験者の立つ場所は `Standing`、届いた物は `IFieldRequests.Received` から受け取ります。\n- `GameObject.Find` や `FindObjectOfType` で、ほかの機能の物を探しません。どこから使われているか追えなくなるためです。\n- 受け取りの登録は `OnEnable` で行い、`OnDisable` で外します。\n\nファイルは、その生き物がいるフィールドの機能（たとえば `Assets/Scripts/Village/`）に置きます。\n\n次の例の猫は、本編のあいだだけ、決めた範囲を歩き回ります。欲しかった物が届くと、喜ぶトリガーを 1 回送ります。\n\n```csharp\nusing MouthOfGod.Core;\nusing UnityEngine;\n\nnamespace MouthOfGod.Village\n{\n    /// <summary>猫が、本編のあいだ決めた範囲を歩き回る。欲しい物が届くと喜ぶ。</summary>\n    public sealed class CatWander : MonoBehaviour\n    {\n        [Tooltip(\"歩き回る範囲の半径（m）。フィールドの Prefab の中の寸法\")]\n        [SerializeField] float radius = 0.08f;\n        [Tooltip(\"歩く速さ（m / 秒）\")]\n        [SerializeField] float speed = 0.03f;\n        [SerializeField] Animator animator;\n\n        Vector3 _home, _target;\n        bool _walking;\n        IFieldRequests _field;\n\n        void OnEnable()\n        {\n            _home = transform.localPosition;\n            Phases.Changed += OnPhase;\n            OnPhase(Phases.Current);\n            _field = GetComponentInParent<IFieldRequests>(); // 親のフィールド（FieldStages）\n            if (_field != null) _field.Received += OnReceived;\n        }\n\n        void OnDisable()\n        {\n            Phases.Changed -= OnPhase;\n            if (_field != null) _field.Received -= OnReceived;\n        }\n\n        void OnPhase(PhaseId phase)\n        {\n            _walking = phase == new PhaseId(\"main-game\");\n            if (animator != null) animator.SetBool(\"Walking\", _walking);\n            PickTarget();\n        }\n\n        void OnReceived(Delivered delivered)\n        {\n            if (delivered.Kind == DeliveryKind.Requested && animator != null) animator.SetTrigger(\"Happy\");\n        }\n\n        void Update()\n        {\n            if (!_walking) return;\n            Vector3 from = transform.localPosition;\n            transform.localPosition = Vector3.MoveTowards(from, _target, speed * Time.deltaTime);\n            Vector3 dir = _target - from;\n            dir.y = 0f;\n            if (dir.sqrMagnitude > 1e-8f)\n                transform.localRotation = Quaternion.Slerp(transform.localRotation, Quaternion.LookRotation(dir), 5f * Time.deltaTime);\n            if ((transform.localPosition - _target).sqrMagnitude < 1e-6f) PickTarget();\n        }\n\n        void PickTarget()\n        {\n            Vector2 r = Random.insideUnitCircle * radius;\n            _target = _home + new Vector3(r.x, 0f, r.y);\n        }\n    }\n}\n```\n\n振る舞いを足すときの考え方です。\n\n- 体験者が前に立ったら寄ってくる: `Standing.Changed` を受け、自分のフィールドの ID と同じなら、目標を体験者の側にします。\n- 判断が複雑になったら: 判断の部分を、Unity に依存しないクラス（`StepProgress` のような形）に分けます。EditMode のテストで確かめられます。\n- 場面の名前（`main-game` など）は、`docs/progress-keys.md` にある名前だけを使います。"}, {"id": "r-tutorial-event", "title": "チュートリアルの中で、イベントを待つ・使う", "types": ["TutorialScript", "TutorialWait", "DeliveryWait", "ConfirmWait", "ForkWait", "SpawnWait", "TextureChangeWait", "StandWait", "AnyWait", "TutorialMemory"], "md": "チュートリアルのスクリプト（`TutorialScript` を継いだクラス）の `Play()` の中で、`yield return` で待ちます。よく使うイベントには、待ちがもう用意されています。\n\n| 待ちたいこと | 書き方 | 終わったあとに読めるもの |\n|---|---|---|\n| 雲を刺す | `yield return WaitForPierce(秒);` | `TimedOut` |\n| かけらの付いた先を口に含む | `yield return WaitForMouth(秒);` | `TimedOut` |\n| 食感が n 回切り替わる | `yield return WaitForTextureChanges(n, 秒);` | `Changes` |\n| デバイスで決定する | `var w = WaitForConfirm(秒); yield return w;` | `w.Result`（決定した食感） |\n| 食べ物が生まれる | `var w = WaitForSpawn(\"apple\", 秒); yield return w;` | `w.Result`（`Spawned`） |\n| フィールドに物が届く | `var w = WaitForDelivery(\"sea\", 秒); yield return w;` | `w.Result`（`Delivered`。`Kind` で正しいか分かる） |\n| 体験者がフィールドの前に立つ | `yield return WaitForStanding(\"sea\", 秒);` | `TimedOut` |\n| どれか 1 つが起きる | `var any = WaitForAny(a, b); yield return any;` | `any.Index`（先に終わった待ちの番号） |\n\n- 秒を 0 にすると、時間切れはありません。展示を止めないために、ふつうは時間切れを入れ、`TimedOut` のときの流れも書きます。\n- 待ちは、待ち始める前に済んだ操作（先回り）も数えます。早く進める体験者でも、止まりません。先回りした段のセリフを飛ばすときは、`AlreadyDone(TutorialEvent.Pierced)` を見ます。\n- ほかの物に何かをさせるときは、`Cue(\"合図の名前\")` と `Say(\"セリフの id\")` を使います。巫女やフィールドのクラスは、直接呼びません。\n- 次のチュートリアルに伝えたいことは、`Memory.Set(\"名前\")` で覚えます。名前は `docs/progress-keys.md` に足します。\n\n次の例は、海に魚が届くのを 30 秒待ちます。ほめるか、ヒントを出します。\n\n```csharp\npublic override IEnumerator Play()\n{\n    Cue(\"sea.glow\");\n    Say(\"t4-walk\");\n    var delivery = WaitForDelivery(\"sea\", 30f);\n    yield return delivery;\n    if (delivery.TimedOut) { Say(\"t4-walk\"); yield break; }\n    if (delivery.Result.Value.Kind == DeliveryKind.Requested)\n    {\n        Say(\"t4-splendid\");\n        Memory.Set(\"delivered-by-standing\");\n    }\n    Cue(\"sea.glow-off\");\n}\n```\n\n**用意されていないイベントを待ちたいとき**\n\n`TutorialWait` を継いだ待ちを、`Assets/Scripts/Tutorial/` に足します。コンストラクタで、Core の置き場から相手を受け取り、聞き始めます。条件が満たされたら、`Complete()` を呼びます。聞くのをやめる処理は、`Unsubscribe()` に書きます。次の例は、あるフィールドの欲しい物が 1 つ解決するのを待ちます。\n\n```csharp\nusing MouthOfGod.Core;\n\nnamespace MouthOfGod.Tutorial\n{\n    /// <summary>そのフィールドの欲しい物が、届いて解決するのを待つ。</summary>\n    public sealed class ResolvedWait : TutorialWait\n    {\n        readonly IFieldRequests _field;\n\n        public ResolvedWait(FieldId field, float timeoutSeconds) : base(timeoutSeconds, null)\n        {\n            _field = Fields.Find(field);\n            if (_field == null) { Cancel(); return; } // フィールドが無ければ、すぐ終える\n            _field.Closed += OnClosed;\n        }\n\n        /// <summary>解決した欲しい物。時間切れなら null。</summary>\n        public RequestClosed? Result { get; private set; }\n\n        void OnClosed(RequestClosed closed)\n        {\n            if (!closed.Resolved) return;\n            Result = closed;\n            Complete();\n        }\n\n        protected override void Unsubscribe()\n        {\n            if (_field != null) _field.Closed -= OnClosed;\n        }\n    }\n}\n```\n\n使う側は、`var wait = new ResolvedWait(new FieldId(\"sea\"), 30f); yield return wait;` と書きます。`new` で作った待ちは、チュートリアルを途中で止めても自動では取り消されません。`OnAborted()` で `wait.Cancel()` を呼びます。\n\n**待たずに、イベントを受け続けたいとき**\n\nチュートリアルの間ずっと何かを数えたい、のような場合です。`Play()` の始めに購読し、終わりと `OnAborted()` の両方で外します。外し忘れると、次のチュートリアルの間も呼ばれ続けます。"}, {"id": "r-tutorial-new", "title": "新しいチュートリアルを足す", "types": ["TutorialScript", "TutorialRunner", "MikoLineBook", "Phases"], "md": "1. `Assets/Scripts/Tutorial/` に、`TutorialScript` を継いだクラスを 1 つ書きます。`Phase` には、やることを表す名前を返します（例: `new PhaseId(\"harvest\")`）。番号は使いません。\n2. 場面の名前を、`docs/progress-keys.md` の表に足します。\n3. Prefab を `Assets/Resources/Prefabs/Tutorial/` に作ります。同じ Prefab に `MikoLineBook` を付け、このチュートリアルのセリフを書きます。セリフの id は、シーン全体で重ならないようにします。\n4. 共有シーンで、その Prefab を `TutorialRunner` の子に置きます。並び順が、動く順番です。シーンは Scene Fusion の中で直します。\n5. 最後のチュートリアルの場面名を変えたときは、`GameRunner` の After Phase と、`TutorialRunner` の Skip Phase も合わせます。"}, {"id": "r-react-cue", "title": "合図に反応させる", "types": ["CueReaction", "Cues", "CueRequested", "CueId"], "md": "**コードを書かない場合**: 反応させたい物に `CueReaction` を付けます。Entries に 1 行足し、Cue に合図の名前、Show・Hide に出し入れする物、On Cue に呼ぶものを入れます。Seconds を入れると、その秒数のあとで元に戻ります。\n\n**コードを書く場合**: `Cues.Requested` を `OnEnable` で購読し、`OnDisable` で外します。名前で自分あての合図かを見分けます。\n\n```csharp\nvoid OnEnable() => Cues.Requested += OnCue;\nvoid OnDisable() => Cues.Requested -= OnCue;\n\nvoid OnCue(CueRequested request)\n{\n    if (request.Cue.Value == \"grassland.cat-wake\") WakeUp();\n}\n```\n\n合図の名前は、受ける側の名前から始めます（`grassland.`、`miko.`、`cloud.` など）。"}, {"id": "r-add-food", "title": "新しい食べ物を足す", "types": ["FoodTable", "FoodTables", "FoodRow", "FoodSpawner", "FieldStep"], "md": "1. 食べ物の Prefab を `Assets/Resources/Prefabs/Food/` に置きます。ファイル名が食べ物の ID になります（例: `cat_food.prefab` → `cat_food`）。飛ばすには `Rigidbody` が要ります。\n2. 大きさは、メニュー `MouthOfGod/Food/Fit Prefab Sizes` でそろえられます。吹き出しのアイコンは `MouthOfGod/Food/Generate Icons` で作ります。\n3. どの食感で生まれるかを、自分のフィールドの `FoodTable` に 1 行足します。全フィールドで生まれる物だけは、共通の表（`FoodSpawner` の Prefab に付いた表）に足します。\n4. フィールドに欲しがらせるなら、その段の `FieldStep` の Food に、同じ ID を書きます。\n5. Play すると、表の食い違いが Console に警告として出ます。"}, {"id": "r-open-request", "title": "本編で欲しい物を出す", "types": ["Fields", "IFieldRequests", "RequestIssued", "RequestClosed", "GameRunner"], "md": "本編が、いつ・どのフィールドに欲しい物を出すかを決めるコードは、まだありません。書くときは、次の形にします。\n\n```csharp\nforeach (IFieldRequests field in Fields.All)\n{\n    if (field.CanOpen) field.Open();   // 出せなければ false が返る\n}\n```\n\n- 後から置かれたフィールドも受け取るには、`Fields.All` を見たあと、`Fields.Added` を購読します。\n- 出した欲しい物が終わった知らせは `Closed` です。`Resolved` が true なら届いて解決、false なら待ちきれずに終わった物です。\n- 待ちきれなかった物は、`Expire(番号)` で 1 つずつ終えます。番号は `RequestIssued.Request` です。\n- 2026-10-28 時点の Main シーンには、`GameRunner` がありません。本編を動かすには、まず `GameRunner` をシーンに置きます。"}, {"id": "r-camera-cut", "title": "カメラのカットを作る", "types": ["CameraCutPlayer", "CameraShot", "ShotKind", "ShotAim", "CameraEase"], "md": "1. カット用のカメラ（VR の Main Camera とは別のもの）に `CameraCutPlayer` を付けます。\n2. シーンに空の GameObject を置き、行き先・曲がり方・回る中心の目印にします。\n3. Shots にカットを足し、Kind（Line・Curve・Orbit・Hold）、秒数か速さ、Ease、Aim を選び、目印を入れます。\n4. カメラを選ぶと、シーンビューに軌道の線が出ます。目印を動かして、線を見ながら直します。\n5. Play On Start を入れるか、コードで `Play()` を呼びます。終わったあとの処理は、On Finished につなぎます。\n\n村のカットの見本は、メニュー `MouthOfGod/CameraWork/Add Village Tour` と `Add Village Zoom-Out` で置けます。"}], "recipesIntro": "「〇〇をしたい」から引く手順です。どの手順も、設計の考え方に沿っています。別の機能のクラスを直接呼ばず、Core の置き場・合図・イベントを使います。\n\nコード例は、手順を説明するための見本です。そのまま入れる前に、自分の場面に合わせて直してください。コード例は、Unity でコンパイルして確かめてはいません。", "design": [{"id": "d-files", "title": "作業の単位と、ファイルの単位をそろえる", "types": ["TutorialScript", "PrologueVideo", "T1Fork", "T2Spawn", "T3Recognize", "T4Deliver", "MikoLineBook", "FoodTable", "FieldStep", "FieldStages"], "source": "docs/architecture.md「1. 同じファイルを取り合わない」", "secs": {"決めたこと": "1 人が直す物は、1 つのファイルに収めます。チュートリアルは 1 本につき、スクリプト 1 つと Prefab 1 つです。フィールドは、担当者ごとに Prefab 1 つです。食べ物の表は、フィールドの Prefab ごとに付けます。", "なぜ": "シーンや Prefab は、Git でマージできないからです。2 人が同じファイルを直すと、片方の作業が消えます。ファイルが分かれていれば、担当者は自分のファイルだけを直せます。ほかの人を待たずに、並行して作れます。", "あきらめたこと": "全体を 1 つのファイルで見渡すことは、あきらめました。たとえば、セリフの英文を 1 か所でまとめて見直すことはできません。", "読む人へ": "自分の担当のファイル以外を直す変更は、分け方を見直す合図です。PR が同じファイルでぶつかったら、分け方の問題として扱います。"}}, {"id": "d-nocenter", "title": "中央の進行役を作らない", "types": ["TutorialRunner", "GameRunner", "Phases"], "source": "docs/decisions.md 2026-10-13・2026-10-15、docs/architecture.md「6. 避けること」", "secs": {"決めたこと": "`GameManager` や `GameFlow` のような、全部を知っている進行役は作りません。チュートリアルを進める `TutorialRunner` は、どのチュートリアルでも同じコードです。中身の流れは、チュートリアルごとのスクリプトに書きます。本編の `GameRunner` は、チュートリアルの型を知りません。場面（`Phases`）が `deliver` から空に変わったのを見て、本編を始めます。", "なぜ": "進行役が全部を持つと、何かを足すたびに、全員がその 1 つのファイルを直します。作業が順番待ちになります。1 か所の変更が、ほかの全部を壊すこともあります。", "あきらめたこと": "「いま何がどう動いているか」を 1 ファイルで読めることは、あきらめました。流れを追うときは、このリファレンスの「機能どうしのつなぎ方」を読みます。"}}, {"id": "d-registry", "title": "置き場に自分で登録する（組み立て役を置かない）", "types": ["Devices", "Forks", "FoodSpawners", "Fields", "Standing", "Phases", "Cues", "MockDevice", "ForkTip", "FoodSpawner", "FieldStages", "StandArea"], "source": "docs/decisions.md 2026-10-15「全部をつなぐ組み立て役（Bootstrap）は置かず、Core の置き場に自分で登録する」", "secs": {"決めたこと": "機能をまたいで使う「もの」（デバイス・フォーク・フィールドなど）は、有効になったときに、Core の置き場へ自分で登録します。使う側は、置き場から受け取ります。置き場は `Devices`・`Forks`・`FoodSpawners`・`Fields`・`Standing`・`Phases`・`Cues` だけです。全部の機能を参照して組み立てる役（Bootstrap）は置きません。", "なぜ": "4 つのフィールドは、4 人が別々に作り、最後に 1 つのシーンへまとめます。登録する形なら、作ったフィールドは、シーンに置くだけで本編・チュートリアル・吹き出しにつながります。担当者は、自分のサンドボックスのシーンで、1 人で試せます。組み立て役がいると、機能を足すたびに全員がそのファイルを直します。組み立て役ができるまで、誰もつないで動かせません。", "あきらめたこと": "- 組み立て役（#34 の案）: つながりを 1 ファイルで見渡せます。しかし、`GameManager` と同じ問題が起きます。\n- イベントバスや、ScriptableObject のイベントチャンネル: 結合はいちばん弱くなります。しかし、誰が出して誰が受けるかを追えません。`Open()` の戻り値のような返事や、「`Issued` と `Closed` が交互に来る」といった順番の約束を守らせにくいです。チャンネルを `.asset` にすると、Git でぶつかります。", "読む人へ": "使う側は `WhenReady` で受け取ります。後から登録されても届きます。消える側は `OnDisable` で `CancelWhenReady` を呼びます。置き場は static なので、Play のたびに空にします。置き場を足すのは、機能をまたぐ「もの」が増えたときだけです。"}}, {"id": "d-core", "title": "機能どうしは Core だけを通してつながる", "types": ["IDevice", "IFork", "IFoodSpawner", "IFoodItem", "IFieldRequests", "Spawned", "Delivered", "RequestIssued", "RequestClosed", "CueRequested"], "source": "docs/architecture.md「2. 機能と依存の向き」、docs/decisions.md 2026-10-13", "secs": {"決めたこと": "Device・Fork・Food・Village・UI・Miko・Tutorial・Game は、互いのクラスを参照しません。参照してよいのは Core だけです。Core には、ID・イベントのデータ・interface・置き場だけを置き、ロジックは置きません。asmdef の `references` で向きを決め、`check_coupling.py` が直接参照を PR に警告します。", "なぜ": "機能どうしが絡み合うと、1 か所の変更が全体を壊し、作業が止まります。Core の interface を通せば、相手の中身を差し替えても、使う側は直さずに済みます。たとえば、フィールドを `FieldStages` とは違う作りにしても、`IFieldRequests` を実装すれば、本編にそのままつながります。", "読む人へ": "別の機能の型が欲しくなったら、その型を直接使わずに、Core の interface か合図で受け取れないかを考えます。"}}, {"id": "d-ids", "title": "ID は文字列にする（enum にしない）", "types": ["TextureId", "FoodId", "FieldId", "CueId", "PhaseId"], "source": "docs/decisions.md 2026-10-13、CONTRIBUTING「型の名前とデータの置き場所」", "secs": {"決めたこと": "食感・食べ物・フィールド・合図・場面の ID は、文字列を包んだ型にします。`enum` にはしません。", "なぜ": "`enum` にすると、食感や食べ物を 1 つ足すたびに、Core を直すことになります。全機能が再コンパイルされ、素材の担当者は自分で足せません。文字列なら、Prefab のファイル名を変えるだけで食べ物を足せます。ただの `string` にせず型で包むのは、食べ物の ID を食感の ID として渡す、といった取り違えをコンパイルで止めるためです。", "あきらめたこと": "打ち間違いを、コンパイルでは見つけられません。代わりに、起動時の確かめ（`FoodTables.Validate` など）で警告を出します。"}}, {"id": "d-cues", "title": "チュートリアルは合図を出し、見せ方は受け手が決める", "types": ["Cues", "CueId", "CueRequested", "CueReaction", "CloudCues", "MikoCueReceiver", "FoodShadow", "StandArea", "TutorialScript"], "source": "docs/decisions.md 2026-10-19", "secs": {"決めたこと": "チュートリアルは「ここを光らせる」「巫女にこれを言わせる」を、合図（`Cues.Request`）で頼むだけです。光らせ方・しゃべり方は、合図を受けた側（フィールド・巫女・UI）が決めます。合図の名前は、受け手の名前から始めます（`sea.glow`、`miko.say.<id>`）。", "なぜ": "チュートリアルの担当者は流れだけを、フィールドの担当者は見せ方だけを直せるようにするためです。チュートリアルが Village や Miko のクラスを直接呼ぶと、依存の向きが崩れ、片方だけを直せなくなります。", "あきらめたこと": "合図を受けた側がいなくても、エラーにはなりません。合図の名前を打ち間違えると、何も起きないだけです。`TutorialDebugHud` に、最近の合図が出るので、そこで確かめます。"}}, {"id": "d-puppet", "title": "チュートリアルは、コルーチンの人形劇スクリプトで書く", "types": ["TutorialScript", "TutorialRunner", "TutorialWait", "DeliveryWait", "ConfirmWait", "ForkWait", "SpawnWait", "TextureChangeWait", "StandWait", "AnyWait", "T1Fork", "T2Spawn", "T3Recognize", "T4Deliver", "PrologueVideo"], "source": "docs/decisions.md 2026-10-19", "secs": {"決めたこと": "チュートリアル 1 本につき、`TutorialScript` を継いだクラスを 1 つ書きます。流れはコルーチンで書き、合図を出し、待ち（`WaitForPierce` など）で待ち、分岐します。`TutorialRunner` が、Hierarchy の並び順に 1 本ずつ動かします。", "なぜ": "チュートリアルは約 8 分の一本道です。シナリオブックと同じ順に、1 か所で流れを読めるほうが直しやすいからです。待ちは、待ち始める前に済んだ操作（先回り）も数えます。早く進める体験者でも、止まらずに進みます。", "あきらめたこと": "- 手順をデータ（`TutorialStep`）で並べる案: Inspector で並べられます。しかし、待てる条件が決まった種類に限られます。\n- チュートリアルとフィールドの組み合わせごとにスクリプトを書く案（4 × 4 で 16 個）: 空の組み合わせが多く、流れを直すたびに複数の担当のファイルを直すことになります。"}}, {"id": "d-tutprefab", "title": "チュートリアルは 1 本ずつ Prefab にし、セリフもその中に持つ", "types": ["MikoLineBook", "MikoLine", "T1Fork", "T2Spawn", "T3Recognize", "T4Deliver", "PrologueVideo", "TutorialRunner"], "source": "docs/decisions.md 2026-10-25", "secs": {"決めたこと": "プロローグとチュートリアル 1〜4 は、1 本ずつ Prefab（`Resources/Prefabs/Tutorial/`）にします。共有シーンには、その Prefab を `TutorialRunner` の子として置くだけです。そのチュートリアルのセリフは、その Prefab に付けた `MikoLineBook` に書きます。", "なぜ": "チュートリアルは、担当者が並行して作ります。セリフが巫女の 1 つの一覧にあると、全員が同じ一覧を直すことになり、順番待ちになります。チュートリアルが共有シーンに直接あると、直すたびに Scene Fusion のセッションが要ります。Prefab に分ければ、担当者は自分の Prefab だけを直せます。", "あきらめたこと": "- シーンの物（指さす先や行き先）は、Prefab に入れられません。これだけは、シーンに置いた Prefab の上で入れます。\n- セリフの id は、シーン全体で重ならないようにする必要があります。重なると、Play の始めに警告が出ます。"}}, {"id": "d-memory", "title": "チュートリアルの間の引き継ぎは、名前だけで行う", "types": ["TutorialMemory", "TutorialRunner", "TutorialScript"], "source": "docs/decisions.md 2026-10-19、docs/progress-keys.md", "secs": {"決めたこと": "前のチュートリアルで覚えたことは、名前（`fork-learned` など）だけを `TutorialMemory` に書きます。次のチュートリアルは、その名前があるかだけを見ます。名前は `docs/progress-keys.md` の 1 か所に書きます。", "なぜ": "T3 のコードが「T2 では」と書くと、T2 を直したときに T3 が壊れます。名前だけを見れば、T2 の中身を変えても、名前を変えなければ T3 は壊れません。名前は「事実」にします（`t2-done` ではなく `food-born`）。チュートリアルの順番を変えても、意味が変わらないようにするためです。"}}, {"id": "d-steps", "title": "フィールドの戻り方は Hierarchy の並びで持ち、いつ出すかは Game・Tutorial が決める", "types": ["FieldStages", "FieldStep", "StepProgress", "IFieldRequests", "VillagerMood"], "source": "docs/decisions.md 2026-10-15", "secs": {"決めたこと": "フィールドの戻り方は、`Steps` の下に並べた `FieldStep` で持ちます。順番は Hierarchy の並び順で、番号は持ちません。いつ・どのフィールドに欲しい物を出すかは、フィールドではなく、本編（Game）とチュートリアル（Tutorial）が `IFieldRequests` 越しに決めます。", "なぜ": "4 つのフィールドを別々の人が作り、それでも全体が調和して動くようにするためです。フィールドの担当者は、自分の Prefab だけを触り、時間や他のフィールドのことを考えずに済みます。出す順番と間隔は 1 か所で決めるので、4 つがばらばらに動きません。段階を途中に挟む・並べ替えるのは、Hierarchy の操作だけで済みます。", "あきらめたこと": "段階を番号で持つ案（#237）は採りませんでした。途中に段階を挟むと、後ろの番号を全部ずらす必要があり、ずらし忘れても気づけないからです。"}}, {"id": "d-receive", "title": "何が届いても受け取り、何が届いたかを知らせる", "types": ["DeliveryKind", "Delivered", "FieldStages", "DeliveryFx", "DeliveryZone", "IFieldRequests"], "source": "docs/decisions.md 2026-10-15", "secs": {"決めたこと": "フィールドは、何が届いても受け取ります（`Receive`）。戻るのは、頼まれた物が届いたときだけです。届くたびに、届いた物の種類（`Requested`・`Own`・`Foreign`）を `Received` で知らせます。", "なぜ": "体験者は、頼まれていない物も投げてきます。にんじんを 2 本目に投げると「やたらと豊作になる」、村に豚を投げると「いびつな世界になる」、のような反応を、あとから足せるようにするためです。反応や採点は、知らせを受けた側に足します。フィールドの仕組みは直しません。"}}, {"id": "d-multi", "title": "1 つのフィールドに、欲しい物を同時に複数出す", "types": ["RequestIssued", "RequestClosed", "FieldStages", "StepProgress", "RequestBubbles"], "source": "docs/decisions.md 2026-10-20", "secs": {"決めたこと": "1 つのフィールドに、欲しい物を同時に複数出せます。上限は `FieldStages` の Max Open Requests（仮に 2）です。欲しい物には番号（`Request`）を付けて見分けます。", "なぜ": "1 つの場所にいる何人かが、それぞれ別の物を欲しがるほうが、ゲームとして面白いからです（10/20 の判断）。"}}, {"id": "d-foodtable", "title": "食感 → 食べ物の対応は、Prefab に付ける表で持つ", "types": ["FoodTable", "FoodTables", "FoodRow", "FoodSpawner"], "source": "docs/decisions.md 2026-10-19・2026-10-25", "secs": {"決めたこと": "どの食感でどの食べ物が生まれるかは、`FoodTable`（表）で持ちます。全フィールド共通の表は 1 つまでです。フィールドごとに変えたいときだけ、そのフィールドの Prefab に専用の表を付けます。引く順は、立っているフィールドの表、共通の表、なし、です。", "なぜ": "食感の数は、これからのテストで変わります。フィールドごとに別の食べ物を生む可能性もあります。行を足す・消すだけで、どちらも直せる形にしました。各フィールドの担当者は、自分の Prefab の表だけを触ります。", "あきらめたこと": "- ScriptableObject の `FoodDefinition`・`FoodCatalog`: 食感 3 つに対して 13 ファイル・330 行と大きく、フィールドごとの違いを表せませんでした。\n- CSV の表: 全体を 1 ファイルで見られます。しかし、Prefab を名前の文字で指すので打ち間違いが起き、読み込みのコードも要ります。"}}, {"id": "d-aim", "title": "生まれた物は、体験者が狙って飛ばす", "types": ["FoodSpawner", "DeliveryZone", "StandArea", "Standing"], "source": "docs/decisions.md 2026-10-25", "secs": {"決めたこと": "口から生まれた物は、顔を向けた方へ飛びます。どのフィールドに届いたかは、物が落ちた所の `DeliveryZone` で決まります。立っている場所（`Standing`）は、チュートリアルの「ここに立って」の案内と、食べ物の表を選ぶのに使います。", "なぜ": "狙いを定めて飛ばすことが、この体験の遊びだからです。立っている場所へ自動で飛ばすと、狙う操作がなくなります。"}}, {"id": "d-mock", "title": "デバイスがなくても、全部が動く", "types": ["IDevice", "Devices", "MockDevice", "MockDeviceModel", "DesktopHead", "TutorialDebugHud"], "source": "docs/architecture.md「5. デバイス連携」", "secs": {"決めたこと": "ゲームは、触感デバイスを `IDevice` 越しにしか見ません。実機が無いときは、`MockDevice` が自動で用意され、Quest のコントローラかキーボードで「噛む・決定する」を代わりにします。Quest が無いときは、`DesktopHead` と `TutorialDebugHud` で試せます。", "なぜ": "実機のデバイスは、ゲームと並行して作っています。デバイスができるまで誰も試せない、という状態を避けるためです。前のプロジェクトでは、通信のクラスがゲームの状態を持っていて、代わりの物に差し替えられませんでした。その反省から、デバイスは入力を ID とイベントにするだけにしました。"}}, {"id": "d-noprep", "title": "Play の前に、手作業を要らなくする", "types": ["MockDevice", "RequestBubbles", "RequestBubbleSettings", "AprilTagDetectionService", "AprilTagSettings", "DeliveryFx", "FieldStages"], "source": "CONTRIBUTING「最終的に Inspector／Editor の操作が要らないシステムにする」、docs/architecture.md「6. 避けること」", "secs": {"決めたこと": "機能をまたぐつなぎは、Inspector で手で入れません（`[SerializeField]` の手配線をしません）。足りない部品は、自分で用意します。たとえば、`MockDevice`・`RequestBubbles`・`AprilTagDetectionService` は Play で自動で現れます。`FieldStages` は、`DeliveryFx` が無ければ自分で付けます。設定のアセットが無いときは、コードの既定値で動きます。", "なぜ": "手で入れるつなぎは、付け忘れると動きません。しかも、どこを付け忘れたかが分かりにくいです。シーンに置くだけで動けば、担当者は自分の部分だけに集中できます。"}}, {"id": "d-pure", "title": "計算は Unity から切り離して、テストできるようにする", "types": ["StepProgress", "GameClock", "HandHeldTip", "PoseTracker", "PoseCalibrator", "AprilTagGeometry", "CameraPathMath", "MikoLineQueue"], "source": "各機能の README", "secs": {"決めたこと": "判定や計算の中身は、MonoBehaviour から分けて、Unity のシーンに依存しないクラスにします（`StepProgress`、`GameClock` など）。MonoBehaviour は、Unity とのつなぎだけを受け持ちます。", "なぜ": "Quest をかぶらずに、Play もせずに、EditMode のテストで正しさを確かめられるからです。並行して作る人数が多いほど、壊したことに早く気づける仕組みが要ります。"}}, {"id": "d-scene", "title": "共有シーンは 1 つにし、動画も同じシーンで流す", "types": ["VideoScreen", "PrologueVideo", "AprilTagPlace", "SurfaceAnchor"], "source": "docs/decisions.md 2026-10-09・2026-10-25", "secs": {"決めたこと": "村と全フィールドは、1 つの共有シーン（Main）に置きます。複数人で編集するときは、Scene Fusion を使います。プロローグの動画も、シーンを切り替えずに、同じシーンの中の画面（`VideoScreen`）で流します。", "なぜ": "シーンを分けると、重ねて読み込む仕組み、シーンの間の位置合わせ、他の人のシーンと合わせる手間が要ります。このチームには重すぎます。動画のためにシーンを読み込み直すと、XR リグが作り直されて画面が一瞬黒くなり、AprilTag の位置合わせも消えます。VR では、この暗転が酔いの元になります。", "あきらめたこと": "フィールドごとにシーンを分ける案は、採りませんでした。別々の時間に作業してもぶつからない利点はあります。Scene Fusion が使えなくなったら、見直します。"}}, {"id": "d-camera", "title": "カメラワークは、どの物にも付けられる独立した部品にする", "types": ["CameraCutPlayer", "CameraShot", "ShotPath", "CameraPathMath", "CameraEase", "ShotKind", "ShotAim", "VillageTourBuilder"], "source": "PR #347", "secs": {"決めたこと": "カメラの動きは、`CameraCutPlayer` を付けた物を、カット（直線・曲線・円弧・待ち）の並びで動かします。CameraWork は Core にも依存しません。位置の目印は、シーンに置いた空の GameObject で指定します。", "なぜ": "アニメのカット割りのように、カメラを自由に動かせるようにするためです。Core に依存しないので、ゲームのどの仕組みとも関係なく、どのカメラにも付けられます。目印を Transform にしたので、シーンビューで目印を動かせば、軌道の線もその場で変わります。数字を打ち込むより、直感的に直せます。"}}], "designIntro": "このページは、コードが「なぜこの形なのか」をまとめます。型のページの「なぜこの形か」は、ここから引いています。\n\n前提が 3 つあります。どの決まりも、この 3 つから出ています。\n\n- **数人が、同じ時期に、別々の物を作ります。** 山・海・草原・村は別々の担当者が作ります。チュートリアルも、担当者が並行して作ります。\n- **Unity の `.unity`（シーン）・`.prefab`・`.asset` は、Git でマージできません。** 2 人が同じファイルを直すと、どちらかの作業を捨てることになります。そのため、同じファイルを直す作業は、順番待ちになります。\n- **締切があります。** GDC の応募は 10/30 です。あとから直すと全体の作り直しになる所だけは、最初から守ります。\n\n決めた日と経緯の全文は、[docs/decisions.md](https://github.com/Fialuxe/MouthOfGod_System/blob/main/docs/decisions.md) と [docs/architecture.md](https://github.com/Fialuxe/MouthOfGod_System/blob/main/docs/architecture.md) にあります。", "roles": [["コンポーネント", "GameObject に付ける"], ["設定アセット", "Project に置くアセット"], ["待ち（yield return）", "人形劇スクリプトで yield return する"], ["static（置き場・計算）", "コードから直接呼ぶ"], ["データ", "値を運ぶ型"], ["interface", "機能どうしの約束"], ["選択肢（enum）", "決まった値の中から選ぶ"], ["クラス", "コードから new して使う"], ["エディタ", "Unity エディタのメニュー"], ["試験用", "動作確認用。展示では使わない"]], "types": [{"id": "t-CameraCutPlayer", "name": "CameraCutPlayer", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.CameraWork", "file": "CameraWork/CameraCutPlayer.cs", "mod": "CameraWork", "sec": "Runtime", "bases": ["MonoBehaviour"], "attrs": [], "serializable": false, "doc": "付けたオブジェクト（カメラなど）を、決めた軌道と速さで動かす。アニメのカット割りのように、直線・曲線・円弧のカットをつないで撮る。", "brief": "付けたオブジェクト（カメラなど）を、決めた軌道と速さで動かす。", "values": [], "fields": [{"header": null, "type": "CameraShot[]", "name": "shots", "label": "Shots", "default": "new CameraShot[0]", "tooltip": ""}, {"header": null, "type": "bool", "name": "playOnStart", "label": "Play On Start", "default": "", "tooltip": "Play を始めたときに、自動で再生する"}, {"header": null, "type": "bool", "name": "loop", "label": "Loop", "default": "", "tooltip": "最後のカットのあと、最初に戻ってくり返す。最初のカットの出発点は、そのときの位置になる"}, {"header": null, "type": "bool", "name": "unscaledTime", "label": "Unscaled Time", "default": "", "tooltip": "動かすのを Time.timeScale に左右されない時間にする（ポーズ中でも撮る）"}, {"header": null, "type": "UnityEvent", "name": "onFinished", "label": "On Finished", "default": "new UnityEvent()", "tooltip": "全カットが終わったときに呼ぶ"}], "menus": [{"kind": "ContextMenu", "path": "Play"}, {"kind": "ContextMenu", "path": "Stop"}], "members": [{"mods": [], "rtype": "bool", "name": "IsPlaying", "params": "", "kind": "property", "acc": "", "doc": "再生中か。", "brief": "再生中か。"}, {"mods": [], "rtype": "int", "name": "CurrentIndex", "params": "", "kind": "property", "acc": "", "doc": "いま撮っているカットの番号。再生していなければ -1。", "brief": "いま撮っているカットの番号。"}, {"mods": [], "rtype": "CameraShot[]", "name": "Shots", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "Action<int>", "name": "ShotStarted", "params": "", "kind": "event", "acc": "", "doc": "カットが始まった（番号）。", "brief": "カットが始まった（番号）。"}, {"mods": [], "rtype": "Action", "name": "Finished", "params": "", "kind": "event", "acc": "", "doc": "全カットが終わった（Stop でやめたときは出ない）。", "brief": "全カットが終わった（Stop でやめたときは出ない）。"}, {"mods": [], "rtype": "void", "name": "Play", "params": "", "kind": "method", "acc": "", "doc": "最初のカットから撮る。再生中なら、やり直す。", "brief": "最初のカットから撮る。"}, {"mods": [], "rtype": "void", "name": "Play", "params": "int fromIndex", "kind": "method", "acc": "", "doc": "fromIndex 番のカットから撮る。いまの位置が出発点になる。", "brief": "fromIndex 番のカットから撮る。"}, {"mods": [], "rtype": "void", "name": "Stop", "params": "", "kind": "method", "acc": "", "doc": "その場でやめる。位置はそのまま。", "brief": "その場でやめる。"}], "nested_in": null, "role": "コンポーネント", "remarks": "使い方:\n1. カメラ（またはカメラの親）に付ける。Shots に、カットを順に足す。\n2. 位置の目印は、シーンに空の GameObject を置き、End・Control Points・Center に入れる。目印を動かすと、軌道の線がシーンビューに出る。\n3. `Play` を呼ぶ（Play On Start で自動でも）。Play 中は、右クリックメニューの「Play」でも試せる。\n\nカットの種類:\n- Line: 出発点から End へ直線。End が空なら、Direction From（空ならカメラ自身）の前向きに Distance 進む。\n- Curve: Control Points に引き寄せられるベジェ曲線で、End へ。\n- Orbit: Center のまわりを、Axis を軸に Angle 度まわる。360 で一周。Radius Scale・Height Change でらせんや寄り引きになる。\n- Hold: その場で Seconds 待つ。向きだけ変えたいとき、間を置きたいときに使う。\n\n速さ・緩急: Use Speed を入れると m / 秒で、外すと秒数で動く。Ease と Ease Strength で、出だしと着き際の緩急をつける。\n出発点は、前のカットの到着点。最初のカットは、再生を始めたときの位置。目印の位置は、そのカットが始まる瞬間に読む。", "usedBy": ["VillageTourBuilder"], "uses": ["CameraPathMath", "CameraShot", "ShotAim", "ShotKind", "ShotPath"]}, {"id": "t-CameraEase", "name": "CameraEase", "kind": "enum", "mods": [], "ns": "MouthOfGod.CameraWork", "file": "CameraWork/CameraPathMath.cs", "mod": "CameraWork", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "動きの緩急のつけ方。", "brief": "動きの緩急のつけ方。", "values": [{"name": "Linear", "doc": "一定の速さ"}, {"name": "EaseIn", "doc": "ゆっくり出て、速く着く"}, {"name": "EaseOut", "doc": "速く出て、ゆっくり着く"}, {"name": "EaseInOut", "doc": "ゆっくり出て、ゆっくり着く"}, {"name": "Custom", "doc": "Ease Curve で決める"}], "fields": [], "menus": [], "members": [], "nested_in": null, "role": "選択肢（enum）", "remarks": "", "usedBy": ["CameraShot", "VillageTourBuilder"], "uses": []}, {"id": "t-CameraPathMath", "name": "CameraPathMath", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.CameraWork", "file": "CameraWork/CameraPathMath.cs", "mod": "CameraWork", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "カメラの軌道の計算。Unity の Transform を知らない、位置と数だけの計算。", "brief": "カメラの軌道の計算。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "float", "name": "Ease", "params": "CameraEase ease, float t, float strength, AnimationCurve curve = null", "kind": "method", "acc": "", "doc": "緩急をかける。t は 0〜1 で、結果も 0〜1。strength が大きいほど、緩急が強い（1 で Linear と同じ）。", "brief": "緩急をかける。"}, {"mods": ["static"], "rtype": "Vector3", "name": "Line", "params": "Vector3 from, Vector3 to, float t", "kind": "method", "acc": "", "doc": "直線。from から to へ、t（0〜1）の位置。", "brief": "直線。"}, {"mods": ["static"], "rtype": "Vector3", "name": "Bezier", "params": "Vector3[] points, float t", "kind": "method", "acc": "", "doc": "ベジェ曲線。points の最初が出発点、最後が到着点で、間は引っぱる点（曲がり方を決める）。3 点なら二次、4 点なら三次、それ以上でも動く。点が 1 つなら、その点。", "brief": "ベジェ曲線。"}, {"mods": ["static"], "rtype": "Vector3", "name": "Orbit", "params": "Vector3 start, Vector3 center, Vector3 axis, float angle, float radiusScale, float heightChange, float t", "kind": "method", "acc": "", "doc": "円弧・らせん。center のまわりを、axis を軸に angle 度まわる。start は出発点。radiusScale は到着までに半径を何倍にするか（1 で同じ円）、heightChange は軸の向きに動く高さ（m）。360 度で一周する。負の角度で逆向き。", "brief": "円弧・らせん。"}, {"mods": ["static"], "rtype": "float", "name": "Length", "params": "System.Func<float, Vector3> position", "kind": "method", "acc": "", "doc": "軌道の長さを、細かく区切って測る。", "brief": "軌道の長さを、細かく区切って測る。"}, {"mods": ["static"], "rtype": "float", "name": "Duration", "params": "bool useSpeed, float seconds, float speed, float length", "kind": "method", "acc": "", "doc": "動かす長さ（秒）。useSpeed なら、軌道の長さ ÷ 速さ（m / 秒）。そうでなければ seconds。0 にはしない。", "brief": "動かす長さ（秒）。"}], "nested_in": null, "role": "static（置き場・計算）", "remarks": "", "usedBy": ["CameraCutPlayer", "ShotPath"], "uses": []}, {"id": "t-ShotKind", "name": "ShotKind", "kind": "enum", "mods": [], "ns": "MouthOfGod.CameraWork", "file": "CameraWork/CameraShot.cs", "mod": "CameraWork", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "1 カットの軌道の種類。", "brief": "1 カットの軌道の種類。", "values": [{"name": "Line", "doc": "直線"}, {"name": "Curve", "doc": "曲線（ベジェ）"}, {"name": "Orbit", "doc": "円弧・一周・らせん"}, {"name": "Hold", "doc": "その場で待つ（向きだけ変える）"}], "fields": [], "menus": [], "members": [], "nested_in": null, "role": "選択肢（enum）", "remarks": "", "usedBy": ["CameraCutPlayer", "ShotPath", "VillageTourBuilder"], "uses": ["CameraEase"]}, {"id": "t-ShotAim", "name": "ShotAim", "kind": "enum", "mods": [], "ns": "MouthOfGod.CameraWork", "file": "CameraWork/CameraShot.cs", "mod": "CameraWork", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "動いている間の向きの決め方。", "brief": "動いている間の向きの決め方。", "values": [{"name": "Keep", "doc": "向きは変えない"}, {"name": "AlongPath", "doc": "進む向きを向く"}, {"name": "LookAtTarget", "doc": "Aim Target を見続ける"}, {"name": "MatchEnd", "doc": "到着点（End）の向きに、だんだん合わせる"}], "fields": [], "menus": [], "members": [], "nested_in": null, "role": "選択肢（enum）", "remarks": "", "usedBy": ["CameraCutPlayer", "VillageTourBuilder"], "uses": ["CameraEase"]}, {"id": "t-CameraShot", "name": "CameraShot", "kind": "class", "mods": ["sealed"], "ns": "MouthOfGod.CameraWork", "file": "CameraWork/CameraShot.cs", "mod": "CameraWork", "sec": "Runtime", "bases": [], "attrs": [], "serializable": true, "doc": "カメラの 1 カット。出発点は、前のカットの到着点（最初のカットは、いまの位置）。使う項目は種類しだいで、Inspector では使わない項目も見える。種類ごとの使う項目は、各項目の説明にある。", "brief": "カメラの 1 カット。", "values": [], "fields": [{"header": null, "type": "string", "name": "name", "label": "Name", "default": "\"Shot\"", "tooltip": "メモ用の名前。動きには効かない"}, {"header": null, "type": "ShotKind", "name": "kind", "label": "Kind", "default": "ShotKind.Line", "tooltip": ""}, {"header": "時間", "type": "bool", "name": "useSpeed", "label": "Use Speed", "default": "", "tooltip": "入れると、Speed（m / 秒）で動く。外すと、Seconds で動く。Hold は常に Seconds"}, {"header": "時間", "type": "float", "name": "seconds", "label": "Seconds", "default": "2f", "tooltip": ""}, {"header": "時間", "type": "float", "name": "speed", "label": "Speed", "default": "1f", "tooltip": ""}, {"header": "緩急（Lerp 加減）", "type": "CameraEase", "name": "ease", "label": "Ease", "default": "CameraEase.EaseInOut", "tooltip": ""}, {"header": "緩急（Lerp 加減）", "type": "float", "name": "easeStrength", "label": "Ease Strength", "default": "2f", "tooltip": "緩急の強さ。1 で一定の速さ、大きいほど出だしと着き際がゆっくりになる"}, {"header": "緩急（Lerp 加減）", "type": "AnimationCurve", "name": "easeCurve", "label": "Ease Curve", "default": "AnimationCurve.EaseInOut(0f, 0f, 1f, 1f)", "tooltip": "Ease が Custom のときの曲線（横: 進み具合 0〜1、縦: 動いた割合 0〜1）"}, {"header": "Line / Curve の到着点", "type": "Transform", "name": "end", "label": "End", "default": "", "tooltip": "到着点（位置と向き ble で外す。\n- static なので、Play のたびに空にする。すべてメインスレッドから呼ぶ。\n- この形を変えるときは、使う側すべてに効くので、別の PR にする。", "usedBy": ["CloudCues", "CueReaction", "FoodShadow", "MikoCueReceiver", "StandArea", "TutorialDebugHud", "TutorialRunner", "TutorialScript"], "uses": ["CueId", "CueRequested"]}, {"id": "t-Devices", "name": "Devices", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Core", "file": "Core/Devices.cs", "mod": "Core", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "いま使える IDevice の受け取り口。デバイスは 1 台なので、全体で 1 つにする。実装（MockDevice、実機の Device）が Register し、使う側は WhenReady で受け取る（後から登録されても届く）。", "brief": "いま使える IDevice の受け取り口。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "IDevice", "name": "Current", "params": "", "kind": "property", "acc": "", "doc": "登録されている IDevice。まだ無ければ null。", "brief": "登録されている IDevice。"}, {"mods": ["static"], "rtype": "void", "name": "WhenReady", "params": "Action<IDevice> callback", "kind": "method", "acc": "", "doc": "IDevice が使えるようになったら callback を 1 回呼ぶ。すでに登録されていれば、すぐ呼ぶ。取り消せるように、ラムダではなくメソッドを渡す（CancelWhenReady はメソッドでしか外せない）。", "brief": "IDevice が使えるようになったら callback を 1 回呼ぶ。"}, {"mods": ["static"], "rtype": "void", "name": "CancelWhenReady", "params": "Action<IDevice> callback", "kind": "method", "acc": "", "doc": "まだ呼ばれていない WhenReady を取り消す（登録前に消える側が、OnDisable で呼ぶ）。WhenReady に渡したのと同じメソッドを渡す。", "brief": "まだ呼ばれていない WhenReady を取り消す（登録前に消える側が、OnDisable で呼ぶ）。"}, {"mods": ["static"], "rtype": "bool", "name": "Register", "params": "IDevice device", "kind": "method", "acc": "", "doc": "デバイスを登録する。別のデバイスがすでに登録されていれば、登録せずに警告を出して false を返す。待っている WhenReady を 1 つずつ呼ぶ。1 つが例外を投げても、残りは呼ぶ（例外は Console に出す）。", "brief": "デバイスを登録する。"}, {"mods": ["static"], "rtype": "void", "name": "Unregister", "params": "IDevice device", "kind": "method", "acc": "", "doc": "登録を外す。登録されているデバイスと同じときだけ外す。", "brief": "登録を外す。"}], "nested_in": null, "role": "static（置き場・計算）", "remarks": "- すべてメインスレッドから呼ぶ（シリアル通信の受信スレッドから直接呼ばない）。\n- 登録は起動時に 1 回 Core", "file": "Core/Events.cs", "mod": "Core", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "Tutorial から Village や UI への指示（「この場所を光らせる」など）。", "brief": "Tutorial から Village や UI への指示（「この場所を光らせる」など）。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["readonly"], "rtype": "CueId", "name": "Cue", "params": "", "kind": "property", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "", "name": "CueRequested", "params": "CueId cue", "kind": "ctor", "acc": "", "doc": "", "brief": ""}], "nested_in": null, "role": "データ", "remarks": "", "usedBy": ["CloudCues", "CueReaction", "Cues", "FoodShadow", "MikoCueReceiver", "StandArea", "TutorialDebugHud"], "uses": ["CueId", "FieldId", "FoodId"]}, {"id": "t-Fields", "name": "Fields", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Core", "file": "Core/Fields.cs", "mod": "Core", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "いまシーンにあるフィールド（IFieldRequests）の掲示板。フィールドが自分で Register し、使う側（本編・チュートリアル・吹き出し・届いたかの判定）は All と Added で受け取る。誰も相手のクラスを知らずにつながる（docs/requests.md「API 仕様」）。", "brief": "いまシーンにあるフィールド（IFieldRequests）の掲示板。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "IReadOnlyList<IFieldRequests>", "name": "All", "params": "", "kind": "property", "acc": "", "doc": "登録されているフィールド（登録した順）。", "brief": "登録されているフィールド（登録した順）。"}, {"mods": ["static"], "rtype": "Action<IFieldRequests>", "name": "Added", "params": "", "kind": "event", "acc": "", "doc": "フィールドが登録された。", "brief": "フィールドが登録された。"}, {"mods": ["static"], "rtype": "Action<IFieldRequests>", "name": "Removed", "params": "", "kind": "event", "acc": "", "doc": "フィールドの登録が外れた（シーンから消えた、無効になった）。", "brief": "フィールドの登録が外れた（シーンから消えた、無効になった）。"}, {"mods": ["static"], "rtype": "IFieldRequests", "name": "Find", "params": "FieldId id", "kind": "method", "acc": "", "doc": "その ID のフィールド。無ければ null。", "brief": "その ID のフィールド。"}, {"mods": ["static"], "rtype": "bool", "name": "Register", "params": "IFieldRequests field", "kind": "method", "acc": "", "doc": "フィールドを登録する。ID が空・同じ ID がすでにあるなら、登録せずに警告を出して false。同じものを 2 回登録しても 1 つ。", "brief": "フィールドを登録する。"}, {"mods": ["static"], "rtype": "void", "name": "Unregister", "params": "IFieldRequests field", "kind": "method", "acc": "", "doc": "登録を外す。登録されていなければ何もしない。", "brief": "登録を外す。"}], "nested_in": null, "role": "static（置き場・計算）", "remarks": "- 使う側は、All を見てから Added を購読する（後から置かれたフィールドも届く）。OnDisable で Added・Removed の購読を外す。\n- ID が空のフィールド、すでにある ID のフィールドは登録せず、警告を出す（Play は止めない）。データの間違いなので、先のフィールドが外れても、断ったフィールドを後から登録し直すことはしない。\n- すべてメインスレッドから呼ぶ。\n- この形を変えるときは、使う側すべてに効くので、別の PR にする。", "usedBy": ["DeliveryZone", "FieldStages", "OpenAllRequestsAfterTutorial", "RequestBubbles", "T3Recognize", "T4Deliver", "TutorialDebugHud", "TutorialRunner", "TutorialWait", "VillageTutorialProbe"], "uses": ["FieldId", "IFieldRequests"]}, {"id": "t-FoodSpawners", "name": "FoodSpawners", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Core", "file": "Core/FoodSpawners.cs", "mod": "Core", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "いま使える IFoodSpawner の受け取り口。食べ物を生む所は 1 つなので、全体で 1 つにする。実装（Food の FoodSpawner）が Register し、使う側は WhenReady で受け取る（後から登録されても届く）。形は Devices・Forks と同じ。", "brief": "いま使える IFoodSpawner の受け取り口。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "IFoodSpawner", "name": "Current", "params": "", "kind": "property", "acc": "", "doc": "登録されている IFoodSpawner。まだ無ければ null。", "brief": "登録されている IFoodSpawner。"}, {"mods": ["static"], "rtype": "void", "name": "WhenReady", "params": "Action<IFoodSpawner> callback", "kind": "method", "acc": "", "doc": "IFoodSpawner が使えるようになったら callback を 1 回呼ぶ。すでに登録されていれば、すぐ呼ぶ。取り消せるように、ラムダではなくメソッドを渡す（CancelWhenReady はメソッドでしか外せない）。", "brief": "IFoodSpawner が使えるようになったら callback を 1 回呼ぶ。"}, {"mods": ["static"], "rtype": "void", "name": "CancelWhenReady", "params": "Action<IFoodSpawner> callback", "kind": "method", "acc": "", "doc": "まだ呼ばれていない WhenReady を取り消す。WhenReady に渡したのと同じメソッドを渡す。", "brief": "まだ呼ばれていない WhenReady を取り消す。"}, {"mods": ["static"], "rtype": "bool", "name": "Register", "params": "IFoodSpawner spawner", "kind": "method", "acc": "", "doc": "食べ物を生む所を登録する。別の食べ物を生む所がすでに登録されていれば、登録せずに警告を出して false を返す。待っている WhenReady を 1 つずつ呼ぶ。1 つが例外を投げても、残りは呼ぶ（例外は Console に出す）。", "brief": "食べ物を生む所を登録する。"}, {"mods": ["static"], "rtype": "void", "name": "Unregister", "params": "IFoodSpawner spawner", "kind": "method", "acc": "", "doc": "登録を外す。登録されているものと同じときだけ外す。", "brief": "登録を外す。"}], "nested_in": null, "role": "static（置き場・計算）", "remarks": "- すべてメインスレッドから呼ぶ。\n- 登録は起動時に 1 回の前提。途中で Unregister して別の食べ物を生む所を Register しても、すでに受け取った側には知らせない。", "usedBy": ["FoodShadow", "FoodSpawner", "TutorialHistory", "TutorialWait"], "uses": ["IFoodSpawner"]}, {"id": "t-Forks", "name": "Forks", "kind": "class", "mods": ["static"], "ns": "MouthOfGod.Core", "file": "Core/Forks.cs", "mod": "Core", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "いま使える IFork の受け取り口。フォークは 1 本なので、全体で 1 つにする。実装（Fork）が Register し、使う側は WhenReady で受け取る（後から登録されても届く）。形は Devices と同じ。", "brief": "いま使える IFork の受け取り口。", "values": [], "fields": [], "menus": [], "members": [{"mods": ["static"], "rtype": "IFork", "name": "Current", "params": "", "kind": "property", "acc": "", "doc": "登録されている IFork。まだ無ければ null。", "brief": "登録されている IFork。"}, {"mods": ["static"], "rtype": "void", "name": "WhenReady", "params": "Action<IFork> callback", "kind": "method", "acc": "", "doc": "IFork が使えるようになったら callback を 1 回呼ぶ。すでに登録されていれば、すぐ呼ぶ。取り消せるように、ラムダではなくメソッドを渡す（CancelWhenReady はメソッドでしか外せない）。", "brief": "IFork が使えるようになったら callback を 1 回呼ぶ。"}, {"mods": ["static"], "rtype": "void", "name": "CancelWhenReady", "params": "Action<IFork> callback", "kind": "method", "acc": "", "doc": "まだ呼ばれていない WhenReady を取り消す。WhenReady に渡したのと同じメソッドを渡す。", "brief": "まだ呼ばれていない WhenReady を取り消す。"}, {"mods": ["static"], "rtype": "bool", "name": "Register", "params": "IFork fork", "kind": "method", "acc": "", "doc": "フォークを登録する。別のフォークがすでに登録されていれば、登録せずに警告を出して false を返す。待っている WhenReady を 1 つずつ呼ぶ。1 つが例外を投げても、残りは呼ぶ（例外は Console に出す）。", "brief": "フォークを登録する。"}, {"mods": ["static"], "rtype": "void", "name": "Unregister", "params": "IFork fork", "kind": "method", "acc": "", "doc": "登録を外す。登録されているフォークと同じときだけ外す。", "brief": "登録を外す。"}], "nested_in": null, "role": "static（置き場・計算）", "remarks": "- すべてメインスレッドから呼ぶ。\n- 登録は起動時に 1 回の前提。途中で Unregister して別のフォークを Register しても、すでに受け取った側には知らせない。", "usedBy": ["FoodShadow", "ForkTip", "TutorialDebugHud", "TutorialHistory", "TutorialWait"], "uses": ["IFork"]}, {"id": "t-IDevice", "name": "IDevice", "kind": "interface", "mods": [], "ns": "MouthOfGod.Core", "file": "Core/IDevice.cs", "mod": "Core", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "触感デバイスの入力。実装は Device（と MockDevice）。物理量は実装の内側で TextureId に変換する。", "brief": "触感デバイスの入力。", "values": [], "fields": [], "menus": [], "members": [{"mods": [], "rtype": "TextureId", "name": "Current", "params": "", "kind": "property", "acc": "get;", "doc": "いまの食感。まだ噛んでいなければ TextureId.None。噛むのをやめても、最後の食感が残る。", "brief": "いまの食感。"}, {"mods": [], "rtype": "Action<TextureId>", "name": "TextureChanged", "params": "", "kind": "event", "acc": "", "doc": "食感が変わった（新しい食感を運ぶ）。Current を更新してから出す。噛み始めは Bitten の直後に、最初の食感で出す（前と同じ食感でも出す）。噛むのをやめても None では出さない。", "brief": "食感が変わった（新しい食感を運ぶ）。"}, {"mods": [], "rtype": "Action<TextureId>", "name": "Confirmed", "params": "", "kind": "event", "acc": "", "doc": "決定した。決定したときの食感（Current）を運ぶ。噛む前の決定なら TextureId.None。", "brief": "決定した。"}, {"mods": [], "rtype": "Action", "name": "Bitten", "params": "", "kind": "event", "acc": "", "doc": "噛み始めた。噛み始めるたびに 1 回出す（噛んでいる間は出さない）。", "brief": "噛み始めた。"}], "nested_in": null, "role": "interface", "remarks": "前提（この形に、全員のコードが乗っている）:\n- 使う側（Food・Tutorial・UI など）は Devices.WhenReady で受け取り、相手が Mock か実機かを知らない。\n- 実機は、IDevice を実装して Devices.Register するだけで差し替わる。実機が先に登録されていれば、MockDevice は自動で作られない。\n  そのため実機は、通信がつながる前でも Awake か OnEnable で Register する（Start や接続後だと、Mock が先に登録される）。\n- 約束: 噛み始めに Bitten、食感が変わったら TextureChanged、ボタンで Confirmed（そのときの食感）。\n  内容量の制御や物理量の変換は、実装の内側に閉じる（使う側に ％ やパターン番号を見せない）。\n- イベントはメインスレッドで出す（シリアル通信の受信スレッドから直接出さない）。\nこの形（メンバー・イベントの意味・受け取り方）を変えたい場合は、使う側すべてに影響するので、別の PR でお願いします。", "usedBy": ["Devices", "FoodShadow", "FoodSpawner", "ForkTip", "MockDevice", "TutorialDebugHud", "TutorialHistory", "TutorialWait"], "uses": ["TextureId"]}, {"id": "t-IFieldRequests", "name": "IFieldRequests", "kind": "interface", "mods": [], "ns": "MouthOfGod.Core", "file": "Core/IFieldRequests.cs", "mod": "Core", "sec": "Runtime", "bases": [], "attrs": [], "serializable": false, "doc": "1 つのフィールドの欲しい物。いつもの実装は Village の FieldStages。フィールドは自分で Fields に登録し、Game・Tutorial・UI はそこから受け取る。", "brief": "1 つのフィールドの欲しい物。", "values": [], "fields": [], "menus": [], "members": [{"mods": [], "rtype": "FieldId", "name": "Field", "params": "", "kind": "property", "acc": "get;", "doc": "", "brief": ""}, {"mods": [], "rtype": "bool", "name": "IsOpen", "params": "", "kind": "property", "acc": "get;", "doc": "欲しい物が 1 つ以上出ている（吹き出しが出ている）。", "brief": "欲しい物が 1 つ以上出ている（吹き出しが出ている）。"}, {"mods": [], "rtype": "bool", "name": "CanOpen", "params": "", "kind": "property", "acc": "get;", "doc": "次の欲しい物を出せる（出ている数が上限より少なく、まだ出していない欲しい物が残っている）。すっかり戻ったフィールドは false。", "brief": "次の欲しい物を出せる（出ている数が上限より少なく、まだ出していない欲しい物が残っている）。"}, {"mods": [], "rtype": "bool", "name": "Open", "params": "", "kind": "method", "acc": "", "doc": "次の欲しい物を出す（Issued が出る）。出せなければ false。", "brief": "次の欲しい物を出す（Issued が出る）。"}, {"mods": [], "rtype": "bool", "name": "Open", "params": "FoodId food", "kind": "method", "acc": "", "doc": "その物を欲しがる、まだ済んでいないステップを出す（並び順によらない）。チュートリアルのように、出す物が台本で決まっているときに使う。上限まで出ている・その物を欲しがるステップが無いなら false。", "brief": "その物を欲しがる、まだ済んでいないステップを出す（並び順によらない）。"}, {"mods": [], "rtype": "DeliveryKind", "name": "Receive", "params": "FoodId food", "kind": "method", "acc": "", "doc": "物がこのフィールドに届いた。何が届いても受け取り、何だったかを返す（Received も 1 回出る）。出ている欲しい物のどれかと同じ物（Requested）なら、同じ物を欲しがる一番古いものが済んで、見た目が変わってから Closed（Resolved = true）が出る。それ以外（Own・Foreign）は、フィールドは戻らない。反応（豊作・いびつな世界など）は、Received を受けた側が足す。物が落ちた場所を決める所（DeliveryZone）が呼ぶ。", "brief": "物がこのフィールドに届いた。"}, {"mods": [], "rtype": "void", "name": "Expire", "params": "", "kind": "method", "acc": "", "doc": "出ている欲しい物を、すべて届かないまま終える（Closed が Resolved = false で、出した順に出る）。出ていなければ何もしない。", "brief": "出ている欲しい物を、すべて届かないまま終える（Closed が Resolved = false で、出した順に出る）。"}, {"mods": [], "rtype": "void", "name": "Expire", "params": "int request", "kind": "method", "acc": "", "doc": "その番号の欲しい物だけを、届かないまま終える（待ちきれなかった。Closed が Resolved = false で出る）。出ていなければ何もしない。", "brief": "その番号の欲しい物だけを、届かないまま終える（待ちきれなかった。"}, {"mods": [], "rtype": "void", "name": "Restart", "params": "", "kind": "method", "acc": "", "doc": "はじめ（何も戻っていない）に戻す。出ていた欲しい物も終える（Closed、Resolved = false）。体験の終わり（次の人へ）に呼ぶ。チュートリアルと本編の間では戻さない。", "brief": "はじめ（何も戻っていない）に戻す。"}, {"mods": [], "rtype": "Action<RequestIssued>", "name": "Issued", "params": "", "kind": "event", "acc": "", "doc": "", "brief": ""}, {"mods": [], "rtype": "Action<RequestClosed>", "name": "Closed", "params": "", "kind": "event", "acc": "", "doc": "欲しい物が終わった。届いて解決した（Resolved = true）か、Expire やリセットで終わった（false）。", "brief": "欲しい物が終わった。"}, {"mods": [], "rtype": "Action<Delivered>", "name": "Received", "params": "", "kind": "event", "acc": "", "doc": "物が届いた（Receive のたびに 1 回）。採点はこれを数える。Requested のときは Closed の後に出る。", "brief": "物が届いた（Receive のたびに 1 回）。"}], "nested_in": null, "role": "interface", "remarks": "フィールドを FieldStages とは違う独自の作りにしても、この interface を実装すれば、本編・チュートリアル・吹き出しにそのままつながる。\n分担（docs/requests.md）:\n- フィールドは「何が欲しいか」と「届いたら何が変わるか」だけを持つ。いつ出すかは決めない。\n- いつ・どのフィールドに出すか（同時にいくつ、待ち時間）は、呼ぶ側（本編は Game、チュートリアルは Tutorial）が決める。\n- 1 つのフィールドに、同時に複数の欲しい物が出ていることがある（上限はフィールドのデータで決まる）。どれかは番号（Request）で見分ける。フィールドの中の順番は、フィールドのデータで決まっている。\n- 同じ番号の Issued と Closed は、1 回ずつ、この順に出る。状態を変えてから知らせるので、イベントの中から Open などをすぐ呼んでよい。メインスレッドから使う。\n約束の全体は docs/requests.md「API 仕様」。形を変えるときは、使う側すべてに効くので別の PR にする。", "usedBy": ["Delive
